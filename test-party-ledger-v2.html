<!DOCTYPE html>
<html>
<head>
    <title>Party Ledger Test V2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            font-size: 12px;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .debit {
            color: red;
        }
        .credit {
            color: green;
        }
        .balance {
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .test-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .test-fail {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Party Ledger API Test Suite</h1>
    
    <div class="section">
        <h2>Test Configuration</h2>
        <p><strong>Backend URL:</strong> https://pharma-backend-production-0c09.up.railway.app</p>
        <p><strong>Customer:</strong> Garg Medical Store (ID: 108)</p>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div class="section">
        <h2>Test 1: Balance Endpoint</h2>
        <div id="test1-result"></div>
    </div>
    
    <div class="section">
        <h2>Test 2: Statement Endpoint</h2>
        <div id="test2-result"></div>
    </div>
    
    <div class="section">
        <h2>Test 3: Customer Search</h2>
        <div id="test3-result"></div>
    </div>
    
    <div class="section">
        <h2>Ledger Entries Table</h2>
        <div id="ledger-table"></div>
    </div>
    
    <script>
        const API_BASE = 'https://pharma-backend-production-0c09.up.railway.app';
        const AUTH_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyLWlkIiwiZXhwIjoxNzM1NjA0NDQ0LCJvcmdfaWQiOiJlNzhkNjc3Ny0zNWY2LTRiMTktOTk0Zi1jYWFlZGUyZjAyMWEifQ.RhSa-Cf9jqGqhJx3bBOAGWBIMl3xOt7V0Qy-4vjD5uo';
        const ORG_ID = 'e78d6777-35f6-4b19-994f-caaede2f021a';
        
        async function testBalanceEndpoint() {
            const resultDiv = document.getElementById('test1-result');
            resultDiv.innerHTML = '<p>Testing balance endpoint...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/party-ledger/balance/108?party_type=customer`, {
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`,
                        'X-Org-Id': ORG_ID
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="test-success">
                        <p class="success">✓ Balance Endpoint Working!</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <p><strong>Balance:</strong> ₹${data.balance?.toFixed(2) || '0.00'}</p>
                        <p><strong>Transaction Count:</strong> ${data.transaction_count || 0}</p>
                        <p><strong>Last Transaction:</strong> ${data.last_transaction_date || 'N/A'}</p>
                    </div>
                `;
                return true;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-fail">
                        <p class="error">✗ Balance Endpoint Failed</p>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
                return false;
            }
        }
        
        async function testStatementEndpoint() {
            const resultDiv = document.getElementById('test2-result');
            resultDiv.innerHTML = '<p>Testing statement endpoint...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/party-ledger/statement/108?party_type=customer`, {
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`,
                        'X-Org-Id': ORG_ID
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="test-success">
                        <p class="success">✓ Statement Endpoint Working!</p>
                        <p><strong>Party Name:</strong> ${data.party?.name || 'N/A'}</p>
                        <p><strong>Statement Entries:</strong> ${data.statement?.length || 0}</p>
                        <details>
                            <summary>View Raw Response</summary>
                            <pre>${JSON.stringify(data, null, 2).substring(0, 1000)}...</pre>
                        </details>
                    </div>
                `;
                
                // Display ledger table
                if (data.statement && data.statement.length > 0) {
                    displayLedgerTable(data.statement);
                }
                
                return true;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-fail">
                        <p class="error">✗ Statement Endpoint Failed</p>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
                return false;
            }
        }
        
        async function testCustomerSearch() {
            const resultDiv = document.getElementById('test3-result');
            resultDiv.innerHTML = '<p>Testing customer search...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/customers/?search=garg&limit=10`, {
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`,
                        'X-Org-Id': ORG_ID
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                const customer = data.customers?.[0];
                
                if (customer) {
                    resultDiv.innerHTML = `
                        <div class="test-success">
                            <p class="success">✓ Customer Search Working!</p>
                            <p><strong>Customer Found:</strong> ${customer.customer_name}</p>
                            <p><strong>Customer ID:</strong> ${customer.customer_id}</p>
                            <p><strong>Customer Code:</strong> ${customer.customer_code}</p>
                            <p><strong>Phone:</strong> ${customer.primary_phone}</p>
                            <p><strong>GSTIN:</strong> ${customer.gstin}</p>
                            <details>
                                <summary>View Full Customer Object</summary>
                                <pre>${JSON.stringify(customer, null, 2)}</pre>
                            </details>
                        </div>
                    `;
                } else {
                    throw new Error('No customer found in search results');
                }
                
                return true;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-fail">
                        <p class="error">✗ Customer Search Failed</p>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
                return false;
            }
        }
        
        function displayLedgerTable(entries) {
            const tableDiv = document.getElementById('ledger-table');
            
            if (!entries || entries.length === 0) {
                tableDiv.innerHTML = '<p>No ledger entries to display</p>';
                return;
            }
            
            let tableHTML = `
                <h3>Transaction History (${entries.length} entries)</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Reference</th>
                            <th>Description</th>
                            <th class="debit">Debit</th>
                            <th class="credit">Credit</th>
                            <th>Running Balance</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            entries.forEach(entry => {
                tableHTML += `
                    <tr>
                        <td>${entry.date}</td>
                        <td>${entry.transaction_type}</td>
                        <td>${entry.reference}</td>
                        <td>${entry.description}</td>
                        <td class="debit">${entry.debit > 0 ? '₹' + entry.debit.toFixed(2) : '-'}</td>
                        <td class="credit">${entry.credit > 0 ? '₹' + entry.credit.toFixed(2) : '-'}</td>
                        <td class="balance">₹${entry.running_balance?.toFixed(2) || '0.00'}</td>
                        <td>${entry.status || '-'}</td>
                    </tr>
                `;
            });
            
            tableHTML += '</tbody></table>';
            
            // Calculate summary
            const totalDebit = entries.reduce((sum, e) => sum + (e.debit || 0), 0);
            const totalCredit = entries.reduce((sum, e) => sum + (e.credit || 0), 0);
            const balance = totalDebit - totalCredit;
            
            tableHTML += `
                <h3>Summary</h3>
                <table style="width: 400px;">
                    <tr>
                        <td><strong>Total Debit:</strong></td>
                        <td class="debit" style="text-align: right;">₹${totalDebit.toFixed(2)}</td>
                    </tr>
                    <tr>
                        <td><strong>Total Credit:</strong></td>
                        <td class="credit" style="text-align: right;">₹${totalCredit.toFixed(2)}</td>
                    </tr>
                    <tr>
                        <td><strong>Outstanding Balance:</strong></td>
                        <td style="text-align: right; color: ${balance > 0 ? 'red' : 'green'}; font-weight: bold;">
                            ₹${Math.abs(balance).toFixed(2)} ${balance > 0 ? '(Receivable)' : '(Payable)'}
                        </td>
                    </tr>
                </table>
            `;
            
            tableDiv.innerHTML = tableHTML;
        }
        
        async function runAllTests() {
            console.log('Running all tests...');
            await testBalanceEndpoint();
            await testStatementEndpoint();
            await testCustomerSearch();
        }
        
        function clearResults() {
            document.getElementById('test1-result').innerHTML = '';
            document.getElementById('test2-result').innerHTML = '';
            document.getElementById('test3-result').innerHTML = '';
            document.getElementById('ledger-table').innerHTML = '';
        }
        
        // Auto-run tests on load
        window.onload = () => runAllTests();
    </script>
</body>
</html>
