name: Canonical conversion preflight

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  production-read-only-preflight:
    runs-on: ubuntu-latest
    env:
      SOURCE_PROJECT_REF: jfrairkkzxwkhbtqejnz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse any source except production and verify healthy state
        run: |
          set -euo pipefail
          test "$SOURCE_PROJECT_REF" = jfrairkkzxwkhbtqejnz
          test -n "$SUPABASE_ACCESS_TOKEN"
          project_json=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SOURCE_PROJECT_REF")
          test "$(jq -r .id <<<"$project_json")" = "$SOURCE_PROJECT_REF"
          test "$(jq -r .status <<<"$project_json")" = ACTIVE_HEALTHY
      - name: Run aggregate-only production conversion diagnostics
        run: |
          set -euo pipefail
          query=$(cat backend/scripts/sql/canonical_conversion_preflight.sql)
          response=$(mktemp)
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg query "$query" '{query:$query}')" \
            "https://api.supabase.com/v1/projects/$SOURCE_PROJECT_REF/database/query/read-only" \
            >"$response"
          jq -e '.. | objects | select(.canonical_conversion_preflight?) | .canonical_conversion_preflight | select(.transaction_read_only == "on")' \
            "$response" >canonical-conversion-preflight.json
          jq . canonical-conversion-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-conversion-preflight-${{ github.run_id }}
          path: canonical-conversion-preflight.json
          if-no-files-found: error
          retention-days: 7
