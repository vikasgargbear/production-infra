name: Canonical staging web authority reconcile

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact deployed Railway API SHA to bind to the authority receipt
        required: true
        type: string
      confirmation:
        description: Type RECONCILE_CANONICAL_STAGING_WEB_AUTHORITY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: canonical-staging-live-browser-identities
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: canonical-staging
    timeout-minutes: 20
    env:
      CANONICAL_STAGING_PROJECT_REF: ${{ vars.CANONICAL_STAGING_PROJECT_REF }}
      CANONICAL_PRODUCTION_PROJECT_REFS: ${{ vars.CANONICAL_PRODUCTION_PROJECT_REFS }}
      CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID: ${{ vars.CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      AUTHORITY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.reviewed_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bind reconciliation to exact deployed disposable staging
        run: |
          set -euo pipefail
          echo "SSH_PRIVATE_KEY=$RUNNER_TEMP/canonical-web-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "SSH_FINGERPRINT_PATH=$RUNNER_TEMP/canonical-web-authority-ssh-fingerprint" >> "$GITHUB_ENV"
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$REVIEWED_SHA" origin/main
          test "$AUTHORITY_CONFIRMATION" = RECONCILE_CANONICAL_STAGING_WEB_AUTHORITY
          test "$CANONICAL_STAGING_PROJECT_REF" = rgihahbmkrmhitjdjvev
          case ",$CANONICAL_PRODUCTION_PROJECT_REFS," in
            *",$CANONICAL_STAGING_PROJECT_REF,"*)
              echo 'Refusing web authority reconciliation against production' >&2
              exit 2
              ;;
          esac
          test "$RAILWAY_API_SERVICE" = aasopharma-api-pilot
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"

      - name: Install the pinned Railway CLI
        run: npm install --global @railway/cli@5.43.4

      - name: Register one run-scoped Railway SSH key
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RAILWAY_API_TOKEN"
          railway whoami >/dev/null
          umask 077
          mkdir -p "$HOME/.ssh" "$HOME/.railway"
          chmod 700 "$HOME/.ssh" "$HOME/.railway"
          printf '%s\n' \
            'Host ssh.railway.com' \
            "    UserKnownHostsFile $HOME/.railway/known_hosts_relay" \
            '    StrictHostKeyChecking accept-new' \
            '    BatchMode yes' \
            '    IdentitiesOnly yes' \
            '    ConnectTimeout 10' \
            '    ServerAliveInterval 15' \
            '    ServerAliveCountMax 2' \
            > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh-keygen -q -t ed25519 -N '' \
            -C "canonical-web-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f "$SSH_PRIVATE_KEY"
          fingerprint=$(ssh-keygen -E sha256 -lf "$SSH_PRIVATE_KEY.pub" | awk '{print $2}')
          case "$fingerprint" in SHA256:*) ;; *) exit 2 ;; esac
          printf '%s\n' "$fingerprint" > "$SSH_FINGERPRINT_PATH"
          eval "$(ssh-agent -s)"
          {
            printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK"
            printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"
          ssh-add "$SSH_PRIVATE_KEY" >/dev/null
          key_name="canonical-web-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          railway ssh keys add --key "$fingerprint" --name "$key_name" >/dev/null
          railway ssh keys list > "$RUNNER_TEMP/canonical-web-authority-ssh-keys.txt"
          grep -F -- "$fingerprint" "$RUNNER_TEMP/canonical-web-authority-ssh-keys.txt" >/dev/null

      - name: Resolve and attest the exact active API instance
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/canonical-web-authority-railway-status.json"
          matching_instance_ids=()
          for attempt in $(seq 1 12); do
            railway status \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --json > "$status"
            mapfile -t candidate_instance_ids < <(jq -r \
              --arg environment "$RAILWAY_ENVIRONMENT_ID" \
              --arg service "$RAILWAY_API_SERVICE" '
                [.environments.edges[].node
                 | select(.id == $environment)
                 | .serviceInstances.edges[].node
                 | select(.serviceName == $service)
                 | .activeDeployments[]
                 | .instances[]
                 | select(.status == "RUNNING")
                 | .id]
                | unique[]
              ' "$status")
            matching_instance_ids=()
            for candidate in "${candidate_instance_ids[@]}"; do
              observed_sha=$(timeout --signal=TERM 20s railway ssh \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "$RAILWAY_ENVIRONMENT_ID" \
                --service "$RAILWAY_API_SERVICE" \
                --deployment-instance "$candidate" \
                --identity-file "$SSH_PRIVATE_KEY" \
                -- printenv RAILWAY_GIT_COMMIT_SHA 2>/dev/null || true)
              if test "$observed_sha" = "$REVIEWED_SHA"; then
                matching_instance_ids+=("$candidate")
              fi
            done
            test "${#matching_instance_ids[@]}" -ne 1 || break
            echo "Waiting for the exact API instance and SSH key (attempt $attempt/12)" >&2
            sleep 5
          done
          test "${#matching_instance_ids[@]}" -eq 1
          echo "RAILWAY_API_DEPLOYMENT_INSTANCE_ID=${matching_instance_ids[0]}" >> "$GITHUB_ENV"

      - name: Reconcile one bounded reviewed web grant
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/canonical-web-authority-request.json"
          response="$RUNNER_TEMP/canonical-web-authority-response.json"
          trap 'rm -f "$request" "$response"' EXIT
          umask 077
          jq -n \
            --arg expected_sha "$REVIEWED_SHA" \
            --arg project_ref "$CANONICAL_STAGING_PROJECT_REF" \
            --arg production_refs "$CANONICAL_PRODUCTION_PROJECT_REFS" \
            --arg password "$SUPABASE_DB_PASSWORD" \
            --arg auth_user_id "$CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID" \
            '{expected_sha:$expected_sha,project_ref:$project_ref,
              production_project_refs:$production_refs,password:$password,
              auth_user_id:$auth_user_id}' > "$request"
          remote_code=$(python3 - <<'PY'
          print(r'''
          import json
          import os
          import re
          import sys
          from urllib.parse import quote
          from uuid import NAMESPACE_URL, UUID, uuid5

          import psycopg2

          sys.path.insert(0, "/app/backend")
          from app.domain.operator_actions.contract import ACTION_POLICIES
          from scripts.provision_staging_mcp_oauth import (
              DEMO_ORG_ID,
              REVIEWER_AUTH_USER_ID,
              REVIEWER_MEMBERSHIP_ID,
              TEST_REQUEST_ID,
              WEB_CLIENT_ID,
              WEB_CLIENT_NAME,
              _attest_reviewed_database,
              _enter_migration_owner,
              _leave_migration_owner,
          )

          value = json.load(sys.stdin)
          if value["project_ref"] != "rgihahbmkrmhitjdjvev":
              raise SystemExit("web authority target is not canonical staging")
          if value["project_ref"] in {
              item.strip() for item in value["production_project_refs"].split(",")
          }:
              raise SystemExit("refusing web authority reconciliation against production")
          if not re.fullmatch(r"[0-9a-f]{40}", value["expected_sha"]):
              raise SystemExit("reviewed SHA is invalid")
          if os.environ.get("RAILWAY_GIT_COMMIT_SHA") != value["expected_sha"]:
              raise SystemExit("active deployment differs from reviewed SHA")
          auth_user_id = str(UUID(value["auth_user_id"]))

          prepare_operations = (
              "sales.order.prepare",
              "sales.dispatch.prepare",
              "sales.invoice.prepare",
              "finance.customer_receipt.prepare",
              "finance.customer_cheque_clearance.prepare",
              "finance.customer_cheque_bounce.prepare",
              "sales.return.prepare",
              "finance.adjustment_note.prepare",
          )
          if any(operation not in ACTION_POLICIES for operation in prepare_operations):
              raise SystemExit("deployed API omits a requested sales lifecycle policy")
          capability_rows = [
              (
                  operation,
                  "write",
                  ACTION_POLICIES[operation].risk_class,
                  ACTION_POLICIES[operation].approval_policy,
                  "1000000.00",
                  "INR",
              )
              for operation in prepare_operations
          ]
          capability_rows.extend((
              ("automation.command.approve", "write", "consequential_write", "actor_confirmation", None, None),
              ("automation.command.execute", "write", "consequential_write", "actor_confirmation", None, None),
              ("automation.command.status.get", "read", "read_only", "none", None, None),
          ))
          capability_codes = tuple(row[0] for row in capability_rows)
          if len(capability_codes) != len(set(capability_codes)):
              raise SystemExit("web authority capability envelope is ambiguous")

          database_url = (
              "postgresql://postgres:" + quote(value["password"], safe="")
              + "@db." + value["project_ref"]
              + ".supabase.co:5432/postgres?sslmode=require&gssencmode=disable"
              + "&connect_timeout=15&application_name=canonical_web_authority_reconcile"
          )
          grant_id = str(uuid5(
              NAMESPACE_URL,
              f"canonical-staging-reviewed-web-agent:{DEMO_ORG_ID}:{auth_user_id}",
          ))
          with psycopg2.connect(database_url) as connection:
              with connection.cursor() as cursor:
                  _attest_reviewed_database(cursor)
                  cursor.execute(
                      "SELECT count(*) FROM auth.users WHERE id=%s",
                      (auth_user_id,),
                  )
                  if cursor.fetchone() != (1,):
                      raise SystemExit("reviewed web Auth identity does not exist exactly once")
                  supports_membership_options = _enter_migration_owner(cursor)
                  try:
                      cursor.execute("SET CONSTRAINTS ALL DEFERRED")
                      for name, setting in (
                          ("app.org_id", DEMO_ORG_ID),
                          ("app.auth_user_id", REVIEWER_AUTH_USER_ID),
                          ("app.membership_id", REVIEWER_MEMBERSHIP_ID),
                          ("app.request_id", TEST_REQUEST_ID),
                      ):
                          cursor.execute("SELECT set_config(%s,%s,true)", (name, setting))
                      cursor.execute(
                          """
                          SELECT user_row.id::text,membership.id::text
                            FROM core.users AS user_row
                            JOIN core.memberships AS membership
                              ON membership.user_id=user_row.id
                             AND membership.org_id=%s
                            JOIN core.organizations AS organization
                              ON organization.id=membership.org_id
                           WHERE user_row.auth_user_id=%s
                             AND user_row.status='active'
                             AND membership.status='active'
                             AND organization.status='active'
                             AND EXISTS (
                                 SELECT 1 FROM core.access_grants AS access_grant
                                  WHERE access_grant.org_id=membership.org_id
                                    AND access_grant.membership_id=membership.id
                                    AND access_grant.status='active'
                                    AND access_grant.valid_from_at<=transaction_timestamp()
                                    AND (access_grant.expires_at IS NULL
                                         OR access_grant.expires_at>transaction_timestamp())
                             )
                           ORDER BY user_row.id,membership.id
                           LIMIT 2
                          """,
                          (DEMO_ORG_ID, auth_user_id),
                      )
                      bindings = cursor.fetchall()
                      if len(bindings) != 1:
                          raise SystemExit(
                              "reviewed web identity lacks one active canonical membership authority"
                          )
                      _, membership_id = bindings[0]
                      cursor.execute(
                          """
                          UPDATE automation.agent_grants
                             SET status='suspended',row_version=row_version+1,
                                 updated_by_membership_id=%s
                           WHERE org_id=%s AND subject_membership_id=%s
                             AND client_id=%s AND status='active'
                          """,
                          (REVIEWER_MEMBERSHIP_ID, DEMO_ORG_ID, membership_id, WEB_CLIENT_ID),
                      )
                      cursor.execute(
                          """
                          INSERT INTO automation.agent_grants (
                              org_id,id,subject_membership_id,client_id,client_display_name,
                              branch_id,authorization_mode,consent_version,consent_text_hash,
                              consented_by_membership_id,consented_at,granted_by_membership_id,
                              granted_at,expires_at,status,created_by_membership_id,
                              updated_by_membership_id
                          ) VALUES (
                              %s,%s,%s,%s,%s,NULL,'self_consent','staging-web-manual-v1',
                              extensions.digest('canonical staging bounded manual web command consent','sha256'),
                              %s,transaction_timestamp(),%s,transaction_timestamp(),
                              transaction_timestamp()+interval '30 days','active',%s,%s
                          ) ON CONFLICT (org_id,id) DO UPDATE SET
                              subject_membership_id=excluded.subject_membership_id,
                              client_id=excluded.client_id,
                              client_display_name=excluded.client_display_name,
                              branch_id=NULL,
                              authorization_mode=excluded.authorization_mode,
                              consent_version=excluded.consent_version,
                              consent_text_hash=excluded.consent_text_hash,
                              consented_by_membership_id=excluded.consented_by_membership_id,
                              consented_at=excluded.consented_at,
                              granted_by_membership_id=excluded.granted_by_membership_id,
                              granted_at=excluded.granted_at,
                              expires_at=excluded.expires_at,
                              status='active',
                              updated_by_membership_id=excluded.updated_by_membership_id,
                              row_version=agent_grants.row_version+1
                          """,
                          (
                              DEMO_ORG_ID,grant_id,membership_id,WEB_CLIENT_ID,WEB_CLIENT_NAME,
                              membership_id,REVIEWER_MEMBERSHIP_ID,
                              REVIEWER_MEMBERSHIP_ID,REVIEWER_MEMBERSHIP_ID,
                          ),
                      )
                      cursor.execute(
                          """
                          UPDATE automation.agent_grant_capabilities
                             SET status='revoked',revoked_at=transaction_timestamp(),
                                 revoked_by_membership_id=%s
                           WHERE org_id=%s AND agent_grant_id=%s
                             AND status='active' AND capability_code<>ALL(%s::varchar[])
                          """,
                          (REVIEWER_MEMBERSHIP_ID, DEMO_ORG_ID, grant_id, list(capability_codes)),
                      )
                      cursor.executemany(
                          """
                          INSERT INTO automation.agent_grant_capabilities (
                              org_id,agent_grant_id,capability_code,operation_mode,
                              risk_class,approval_policy,maximum_amount,currency_code,
                              allow_sensitive_read,status,created_by_membership_id
                          ) VALUES (%s,%s,%s,%s,%s,%s,%s,%s,false,'active',%s)
                          ON CONFLICT (org_id,agent_grant_id,capability_code) DO UPDATE SET
                              operation_mode=excluded.operation_mode,
                              risk_class=excluded.risk_class,
                              approval_policy=excluded.approval_policy,
                              maximum_amount=excluded.maximum_amount,
                              currency_code=excluded.currency_code,
                              allow_sensitive_read=false,
                              status='active',revoked_at=NULL,revoked_by_membership_id=NULL
                          """,
                          [
                              (
                                  DEMO_ORG_ID,grant_id,capability,mode,risk,approval,
                                  maximum_amount,currency,REVIEWER_MEMBERSHIP_ID,
                              )
                              for capability,mode,risk,approval,maximum_amount,currency
                              in capability_rows
                          ],
                      )
                      cursor.execute(
                          """
                          SELECT grant_row.id::text,capability.capability_code,
                                 capability.operation_mode,capability.risk_class,
                                 capability.approval_policy,
                                 capability.maximum_amount::text,capability.currency_code
                            FROM automation.agent_grants AS grant_row
                            JOIN automation.agent_grant_capabilities AS capability
                              ON capability.org_id=grant_row.org_id
                             AND capability.agent_grant_id=grant_row.id
                           WHERE grant_row.org_id=%s
                             AND grant_row.subject_membership_id=%s
                             AND grant_row.client_id=%s
                             AND grant_row.status='active'
                             AND grant_row.expires_at>transaction_timestamp()
                             AND grant_row.consented_by_membership_id=%s
                             AND capability.status='active'
                           ORDER BY capability.capability_code
                          """,
                          (DEMO_ORG_ID, membership_id, WEB_CLIENT_ID, membership_id),
                      )
                      readback = cursor.fetchall()
                      expected = sorted(
                          (
                              grant_id,capability,mode,risk,approval,
                              maximum_amount,currency,
                          )
                          for capability,mode,risk,approval,maximum_amount,currency
                          in capability_rows
                      )
                      if readback != expected:
                          raise SystemExit("reviewed web authority did not reconcile exactly")
                  except BaseException:
                      # The connection context rolls back both the grant changes and
                      # the temporary role membership.  Do not mask the root error by
                      # issuing cleanup SQL inside an aborted transaction.
                      raise
                  else:
                      _leave_migration_owner(cursor, supports_membership_options)
          print(json.dumps({
              "status": "ready",
              "commit_sha": value["expected_sha"],
              "client_id": WEB_CLIENT_ID,
              "grant_id": grant_id,
              "capability_count": len(capability_rows),
              "expires_in_days": 30,
          }, sort_keys=True))
          ''')
          PY
          )
          railway ssh \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_API_SERVICE" \
            --deployment-instance "$RAILWAY_API_DEPLOYMENT_INSTANCE_ID" \
            --identity-file "$SSH_PRIVATE_KEY" \
            -- python -c "$remote_code" < "$request" > "$response"
          test "$(jq -r .status "$response")" = ready
          test "$(jq -r .commit_sha "$response")" = "$REVIEWED_SHA"
          test "$(jq -r .client_id "$response")" = aasopharma-erp-web
          test "$(jq -r .capability_count "$response")" = 11

      - name: Always remove the run-scoped Railway SSH key
        if: always()
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          if test -s "$SSH_FINGERPRINT_PATH"; then
            fingerprint=$(<"$SSH_FINGERPRINT_PATH")
            railway ssh keys remove "$fingerprint" >/dev/null 2>&1 || true
          fi
          ssh-add -D >/dev/null 2>&1 || true
          if test -n "${SSH_AGENT_PID:-}"; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -f "$SSH_PRIVATE_KEY" "$SSH_PRIVATE_KEY.pub" "$SSH_FINGERPRINT_PATH"
