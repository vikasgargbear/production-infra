name: Canonical staging user authority reconcile

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact deployed Railway API SHA to bind to the authority receipt
        required: true
        type: string
      authority_scope:
        description: Reconcile the reviewed first-party web or ChatGPT MCP authority
        required: true
        default: web
        type: choice
        options:
          - web
          - mcp
      mcp_client_id:
        description: Exact deployed public OAuth client ID (required for MCP only)
        required: false
        type: string
      subject_user_id:
        description: Exact signed canonical ERP user ID (required for MCP only)
        required: false
        type: string
      mcp_reviewed_sha:
        description: Exact deployed Railway MCP SHA (required for MCP only)
        required: false
        type: string
      consent_receipt_id:
        description: Stable explicit-consent receipt identifier (required for MCP only)
        required: false
        type: string
      confirmation:
        description: Type the exact RECONCILE_CANONICAL_STAGING_{WEB|MCP}_AUTHORITY phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: canonical-staging-live-browser-identities
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: canonical-staging
    timeout-minutes: 20
    env:
      CANONICAL_STAGING_PROJECT_REF: ${{ vars.CANONICAL_STAGING_PROJECT_REF }}
      CANONICAL_PRODUCTION_PROJECT_REFS: ${{ vars.CANONICAL_PRODUCTION_PROJECT_REFS }}
      CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID: ${{ vars.CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
      RAILWAY_MCP_SERVICE: ${{ vars.RAILWAY_MCP_SERVICE }}
      RAILWAY_MCP_ORIGIN: ${{ vars.RAILWAY_MCP_URL }}
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      AUTHORITY_SCOPE: ${{ inputs.authority_scope }}
      MCP_CLIENT_ID: ${{ inputs.mcp_client_id }}
      SUBJECT_USER_ID: ${{ inputs.subject_user_id }}
      MCP_REVIEWED_SHA: ${{ inputs.mcp_reviewed_sha }}
      CONSENT_RECEIPT_ID: ${{ inputs.consent_receipt_id }}
      AUTHORITY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.reviewed_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bind reconciliation to exact deployed disposable staging
        run: |
          set -euo pipefail
          echo "SSH_PRIVATE_KEY=$RUNNER_TEMP/canonical-web-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "SSH_FINGERPRINT_PATH=$RUNNER_TEMP/canonical-web-authority-ssh-fingerprint" >> "$GITHUB_ENV"
          echo "AUTHORITY_RECEIPT_PATH=$RUNNER_TEMP/canonical-user-authority-receipt.json" >> "$GITHUB_ENV"
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$REVIEWED_SHA" origin/main
          case "$AUTHORITY_SCOPE" in
            web)
              test "$AUTHORITY_CONFIRMATION" = RECONCILE_CANONICAL_STAGING_WEB_AUTHORITY
              test -z "$MCP_CLIENT_ID"
              test -z "$SUBJECT_USER_ID"
              test -z "$MCP_REVIEWED_SHA"
              test -z "$CONSENT_RECEIPT_ID"
              ;;
            mcp)
              test "$AUTHORITY_CONFIRMATION" = RECONCILE_CANONICAL_STAGING_MCP_AUTHORITY
              [[ "$MCP_CLIENT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
              [[ "$SUBJECT_USER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
              [[ "$MCP_REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$CONSENT_RECEIPT_ID" =~ ^[A-Za-z0-9._:-]{16,200}$ ]]
              ;;
            *) exit 2 ;;
          esac
          test "$CANONICAL_STAGING_PROJECT_REF" = rgihahbmkrmhitjdjvev
          case ",$CANONICAL_PRODUCTION_PROJECT_REFS," in
            *",$CANONICAL_STAGING_PROJECT_REF,"*)
              echo 'Refusing web authority reconciliation against production' >&2
              exit 2
              ;;
          esac
          test "$RAILWAY_API_SERVICE" = aasopharma-api-pilot
          test "$RAILWAY_MCP_SERVICE" = aasopharma-mcp-pilot
          test "$RAILWAY_MCP_ORIGIN" = https://aasopharma-mcp-pilot-production.up.railway.app
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"

      - name: Install the pinned Railway CLI
        run: npm install --global @railway/cli@5.43.4

      - name: Register one run-scoped Railway SSH key
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RAILWAY_API_TOKEN"
          railway whoami >/dev/null
          umask 077
          mkdir -p "$HOME/.ssh" "$HOME/.railway"
          chmod 700 "$HOME/.ssh" "$HOME/.railway"
          printf '%s\n' \
            'Host ssh.railway.com' \
            "    UserKnownHostsFile $HOME/.railway/known_hosts_relay" \
            '    StrictHostKeyChecking accept-new' \
            '    BatchMode yes' \
            '    IdentitiesOnly yes' \
            '    ConnectTimeout 10' \
            '    ServerAliveInterval 15' \
            '    ServerAliveCountMax 2' \
            > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh-keygen -q -t ed25519 -N '' \
            -C "canonical-web-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f "$SSH_PRIVATE_KEY"
          fingerprint=$(ssh-keygen -E sha256 -lf "$SSH_PRIVATE_KEY.pub" | awk '{print $2}')
          case "$fingerprint" in SHA256:*) ;; *) exit 2 ;; esac
          printf '%s\n' "$fingerprint" > "$SSH_FINGERPRINT_PATH"
          eval "$(ssh-agent -s)"
          {
            printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK"
            printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"
          ssh-add "$SSH_PRIVATE_KEY" >/dev/null
          key_name="canonical-web-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          railway ssh keys add --key "$fingerprint" --name "$key_name" >/dev/null
          railway ssh keys list > "$RUNNER_TEMP/canonical-web-authority-ssh-keys.txt"
          grep -F -- "$fingerprint" "$RUNNER_TEMP/canonical-web-authority-ssh-keys.txt" >/dev/null

      - name: Attest the exact active MCP authority
        if: env.AUTHORITY_SCOPE == 'mcp'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          railway variables \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_MCP_SERVICE" \
            --json | jq --exit-status --arg client "$MCP_CLIENT_ID" \
              '.MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS == $client' >/dev/null
          curl --fail --silent --show-error --max-time 30 \
            "$RAILWAY_MCP_ORIGIN/health" \
            | jq --exit-status --arg sha "$MCP_REVIEWED_SHA" \
              '.status == "ok" and .git_commit == $sha' >/dev/null
          curl --fail --silent --show-error --max-time 30 \
            "$RAILWAY_MCP_ORIGIN/ready" \
            | jq --exit-status '.status == "ready" and (.tools | length) > 0' >/dev/null

      - name: Resolve and attest the exact active API instance
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/canonical-web-authority-railway-status.json"
          matching_instance_ids=()
          for attempt in $(seq 1 12); do
            railway status \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --json > "$status"
            mapfile -t candidate_instance_ids < <(jq -r \
              --arg environment "$RAILWAY_ENVIRONMENT_ID" \
              --arg service "$RAILWAY_API_SERVICE" '
                [.environments.edges[].node
                 | select(.id == $environment)
                 | .serviceInstances.edges[].node
                 | select(.serviceName == $service)
                 | .activeDeployments[]
                 | .instances[]
                 | select(.status == "RUNNING")
                 | .id]
                | unique[]
              ' "$status")
            matching_instance_ids=()
            for candidate in "${candidate_instance_ids[@]}"; do
              observed_sha=$(timeout --signal=TERM 20s railway ssh \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "$RAILWAY_ENVIRONMENT_ID" \
                --service "$RAILWAY_API_SERVICE" \
                --deployment-instance "$candidate" \
                --identity-file "$SSH_PRIVATE_KEY" \
                -- printenv RAILWAY_GIT_COMMIT_SHA 2>/dev/null || true)
              if test "$observed_sha" = "$REVIEWED_SHA"; then
                matching_instance_ids+=("$candidate")
              fi
            done
            test "${#matching_instance_ids[@]}" -ne 1 || break
            echo "Waiting for the exact API instance and SSH key (attempt $attempt/12)" >&2
            sleep 5
          done
          test "${#matching_instance_ids[@]}" -eq 1
          echo "RAILWAY_API_DEPLOYMENT_INSTANCE_ID=${matching_instance_ids[0]}" >> "$GITHUB_ENV"

      - name: Reconcile one bounded reviewed web grant
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/canonical-web-authority-request.json"
          response="$RUNNER_TEMP/canonical-web-authority-response.json"
          trap 'rm -f "$request" "$response"' EXIT
          umask 077
          jq -n \
            --arg expected_sha "$REVIEWED_SHA" \
            --arg project_ref "$CANONICAL_STAGING_PROJECT_REF" \
            --arg production_refs "$CANONICAL_PRODUCTION_PROJECT_REFS" \
            --arg password "$SUPABASE_DB_PASSWORD" \
            --arg auth_user_id "$CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID" \
            --arg authority_scope "$AUTHORITY_SCOPE" \
            --arg mcp_client_id "$MCP_CLIENT_ID" \
            --arg subject_user_id "$SUBJECT_USER_ID" \
            --arg mcp_reviewed_sha "$MCP_REVIEWED_SHA" \
            --arg consent_receipt_id "$CONSENT_RECEIPT_ID" \
            '{expected_sha:$expected_sha,project_ref:$project_ref,
              production_project_refs:$production_refs,password:$password,
              auth_user_id:$auth_user_id,authority_scope:$authority_scope,
              mcp_client_id:$mcp_client_id,subject_user_id:$subject_user_id,
              mcp_reviewed_sha:$mcp_reviewed_sha,
              consent_receipt_id:$consent_receipt_id}' > "$request"
          remote_code=$(python3 - <<'PY'
          print(r'''
          import json
          import hashlib
          import os
          import re
          import sys
          from urllib.parse import quote
          from uuid import NAMESPACE_URL, UUID, uuid5

          import psycopg2

          sys.path.insert(0, "/app/backend")
          from app.domain.operator_actions.contract import ACTION_POLICIES
          from scripts.provision_staging_mcp_oauth import (
              CLIENT_NAME,
              DEMO_ORG_ID,
              READ_CAPABILITIES,
              REVIEWER_AUTH_USER_ID,
              REVIEWER_MEMBERSHIP_ID,
              STATUS_CAPABILITY,
              TEST_REQUEST_ID,
              WEB_CLIENT_ID,
              WEB_CLIENT_NAME,
              WRITE_CAPABILITIES,
              _attest_reviewed_database,
              _enter_migration_owner,
              _leave_migration_owner,
          )

          value = json.load(sys.stdin)
          if value["project_ref"] != "rgihahbmkrmhitjdjvev":
              raise SystemExit("web authority target is not canonical staging")
          if value["project_ref"] in {
              item.strip() for item in value["production_project_refs"].split(",")
          }:
              raise SystemExit("refusing web authority reconciliation against production")
          if not re.fullmatch(r"[0-9a-f]{40}", value["expected_sha"]):
              raise SystemExit("reviewed SHA is invalid")
          if os.environ.get("RAILWAY_GIT_COMMIT_SHA") != value["expected_sha"]:
              raise SystemExit("active deployment differs from reviewed SHA")
          auth_user_id = str(UUID(value["auth_user_id"]))
          authority_scope = value["authority_scope"]
          if authority_scope == "web":
              if (
                  value["mcp_client_id"]
                  or value["subject_user_id"]
                  or value["consent_receipt_id"]
              ):
                  raise SystemExit("web authority must not accept MCP identity inputs")
              consent_receipt_id = None
              subject_user_id = None
              target_subject_key = auth_user_id
              target_client_id = WEB_CLIENT_ID
              target_client_name = WEB_CLIENT_NAME
              consent_version = "staging-web-manual-v1"
              consent_text = "canonical staging bounded manual web command consent"
          elif authority_scope == "mcp":
              consent_receipt_id = value["consent_receipt_id"]
              if not re.fullmatch(r"[A-Za-z0-9._:-]{16,200}", consent_receipt_id):
                  raise SystemExit("MCP consent receipt identifier is invalid")
              subject_user_id = str(UUID(value["subject_user_id"]))
              target_subject_key = subject_user_id
              target_client_id = str(UUID(value["mcp_client_id"]))
              configured_clients = {
                  item.strip()
                  for item in os.environ.get(
                      "MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS", ""
                  ).split(",")
                  if item.strip()
              }
              if configured_clients != {target_client_id}:
                  raise SystemExit("MCP client differs from the exact deployed authority")
              target_client_name = CLIENT_NAME
              consent_version = "staging-chatgpt-mcp-manual-v1"
              consent_text = "canonical staging bounded ChatGPT MCP command consent"
          else:
              raise SystemExit("authority scope is invalid")

          web_prepare_operations = (
              "sales.order.prepare",
              "sales.dispatch.prepare",
              "sales.invoice.prepare",
              "finance.customer_receipt.prepare",
              "finance.customer_cheque_clearance.prepare",
              "finance.customer_cheque_bounce.prepare",
              "sales.return.prepare",
              "finance.adjustment_note.prepare",
          )
          requested_write_operations = (
              web_prepare_operations
              if authority_scope == "web"
              else tuple(operation for operation, _ in WRITE_CAPABILITIES)
          )
          policy_operations = tuple(
              operation
              for operation in requested_write_operations
              if operation not in {
                  "automation.command.approve",
                  "automation.command.execute",
              }
          )
          if any(operation not in ACTION_POLICIES for operation in policy_operations):
              raise SystemExit("deployed API omits a requested sales lifecycle policy")
          if authority_scope == "web":
              capability_rows = [
                  (
                      operation,
                      "write",
                      ACTION_POLICIES[operation].risk_class,
                      ACTION_POLICIES[operation].approval_policy,
                      "1000000.00",
                      "INR",
                      False,
                  )
                  for operation in web_prepare_operations
              ]
              capability_rows.extend((
                  ("automation.command.approve", "write", "consequential_write", "actor_confirmation", None, None, False),
                  ("automation.command.execute", "write", "consequential_write", "actor_confirmation", None, None, False),
                  (STATUS_CAPABILITY, "read", "read_only", "none", None, None, False),
              ))
          else:
              capability_rows = [
                  (capability, "read", "read_only", "none", None, None, allow_sensitive)
                  for capability, allow_sensitive in READ_CAPABILITIES
              ]
              for operation, reviewed_approval in WRITE_CAPABILITIES:
                  if operation in {
                      "automation.command.approve",
                      "automation.command.execute",
                  }:
                      risk_class = "consequential_write"
                      approval_policy = "actor_confirmation"
                  else:
                      policy = ACTION_POLICIES[operation]
                      risk_class = policy.risk_class
                      approval_policy = policy.approval_policy
                  if (
                      risk_class != "consequential_write"
                      or approval_policy != reviewed_approval
                  ):
                      raise SystemExit(
                          "deployed MCP policy differs from the reviewed envelope"
                      )
                  capability_rows.append((
                      operation,
                      "write",
                      risk_class,
                      approval_policy,
                      "1000000.00",
                      "INR",
                      False,
                  ))
              capability_rows.append(
                  (STATUS_CAPABILITY, "read", "read_only", "none", None, None, False)
              )
          capability_codes = tuple(row[0] for row in capability_rows)
          if len(capability_codes) != len(set(capability_codes)):
              raise SystemExit("user authority capability envelope is ambiguous")
          if authority_scope == "mcp":
              consent_text = json.dumps(
                  {
                      "capabilities": capability_rows,
                      "client_id": target_client_id,
                      "contract": consent_version,
                      "consent_receipt_id": consent_receipt_id,
                      "lifetime_days": 30,
                      "subject_user_id": subject_user_id,
                  },
                  separators=(",", ":"),
                  sort_keys=True,
              )
          consent_text_sha256 = hashlib.sha256(consent_text.encode("utf-8")).hexdigest()

          database_url = (
              "postgresql://postgres:" + quote(value["password"], safe="")
              + "@db." + value["project_ref"]
              + ".supabase.co:5432/postgres?sslmode=require&gssencmode=disable"
              + "&connect_timeout=15&application_name=canonical_user_authority_reconcile"
          )
          grant_namespace = (
              f"canonical-staging-reviewed-web-agent:{DEMO_ORG_ID}:{auth_user_id}"
              if authority_scope == "web"
              else f"canonical-staging-reviewed-mcp-agent:"
              f"{DEMO_ORG_ID}:{target_subject_key}:{target_client_id}:"
              f"{consent_text_sha256}"
          )
          grant_id = str(uuid5(NAMESPACE_URL, grant_namespace))
          with psycopg2.connect(database_url) as connection:
              with connection.cursor() as cursor:
                  _attest_reviewed_database(cursor)
                  supports_membership_options = _enter_migration_owner(cursor)
                  try:
                      cursor.execute("SET CONSTRAINTS ALL DEFERRED")
                      for name, setting in (
                          ("app.org_id", DEMO_ORG_ID),
                          ("app.auth_user_id", REVIEWER_AUTH_USER_ID),
                          ("app.membership_id", REVIEWER_MEMBERSHIP_ID),
                          ("app.request_id", TEST_REQUEST_ID),
                      ):
                          cursor.execute("SELECT set_config(%s,%s,true)", (name, setting))
                      cursor.execute(
                          """
                          SELECT user_row.id::text,membership.id::text
                            FROM core.users AS user_row
                            JOIN core.memberships AS membership
                              ON membership.user_id=user_row.id
                             AND membership.org_id=%s
                            JOIN core.organizations AS organization
                              ON organization.id=membership.org_id
                           WHERE ((%s='web' AND user_row.auth_user_id=%s)
                                  OR (%s='mcp' AND user_row.id=%s))
                             AND user_row.status='active'
                             AND membership.status='active'
                             AND organization.status='active'
                             AND EXISTS (
                                 SELECT 1 FROM core.access_grants AS access_grant
                                  WHERE access_grant.org_id=membership.org_id
                                    AND access_grant.membership_id=membership.id
                                    AND access_grant.status='active'
                                    AND access_grant.valid_from_at<=transaction_timestamp()
                                    AND (access_grant.expires_at IS NULL
                                         OR access_grant.expires_at>transaction_timestamp())
                             )
                           ORDER BY user_row.id,membership.id
                           LIMIT 2
                          """,
                          (
                              DEMO_ORG_ID,
                              authority_scope,
                              auth_user_id,
                              authority_scope,
                              subject_user_id,
                          ),
                      )
                      bindings = cursor.fetchall()
                      if len(bindings) != 1:
                          raise SystemExit(
                              "reviewed user identity lacks one active canonical membership authority"
                          )
                      resolved_user_id, membership_id = bindings[0]
                      cursor.execute(
                          """
                          SELECT subject_membership_id::text,client_id,
                                 client_display_name,branch_id IS NULL,
                                 authorization_mode,consent_version,
                                 encode(consent_text_hash,'hex'),
                                 consented_by_membership_id::text,status,
                                 expires_at>transaction_timestamp()
                            FROM automation.agent_grants
                           WHERE org_id=%s AND id=%s
                          """,
                          (DEMO_ORG_ID, grant_id),
                      )
                      existing_grant = cursor.fetchone()
                      expected_grant = (
                          membership_id,
                          target_client_id,
                          target_client_name,
                          True,
                          "self_consent",
                          consent_version,
                          consent_text_sha256,
                          membership_id,
                          "active",
                          True,
                      )
                      expected_capabilities = sorted(capability_rows)
                      if existing_grant is not None:
                          if existing_grant != expected_grant:
                              raise SystemExit(
                                  "existing consent receipt differs from the reviewed grant"
                              )
                          cursor.execute(
                              """
                              SELECT capability_code,operation_mode,risk_class,
                                     approval_policy,maximum_amount::text,currency_code,
                                     allow_sensitive_read
                                FROM automation.agent_grant_capabilities
                               WHERE org_id=%s AND agent_grant_id=%s AND status='active'
                               ORDER BY capability_code
                              """,
                              (DEMO_ORG_ID, grant_id),
                          )
                          if cursor.fetchall() != expected_capabilities:
                              raise SystemExit(
                                  "existing consent receipt capability envelope differs"
                              )
                          reconciliation_outcome = "unchanged"
                      else:
                          reconciliation_outcome = "created"
                          cursor.execute(
                              """
                              UPDATE automation.agent_grants
                                 SET status='suspended',row_version=row_version+1,
                                     updated_by_membership_id=%s
                               WHERE org_id=%s AND subject_membership_id=%s
                                 AND client_id=%s AND status='active'
                              """,
                              (
                                  REVIEWER_MEMBERSHIP_ID,
                                  DEMO_ORG_ID,
                                  membership_id,
                                  target_client_id,
                              ),
                          )
                          cursor.execute(
                              """
                              INSERT INTO automation.agent_grants (
                                  org_id,id,subject_membership_id,client_id,client_display_name,
                                  branch_id,authorization_mode,consent_version,consent_text_hash,
                                  consented_by_membership_id,consented_at,granted_by_membership_id,
                                  granted_at,expires_at,status,created_by_membership_id,
                                  updated_by_membership_id
                              ) VALUES (
                                  %s,%s,%s,%s,%s,NULL,'self_consent',%s,
                                  extensions.digest(%s,'sha256'),
                                  %s,transaction_timestamp(),%s,transaction_timestamp(),
                                  transaction_timestamp()+interval '30 days','active',%s,%s
                              ) ON CONFLICT (org_id,id) DO NOTHING
                              """,
                              (
                                  DEMO_ORG_ID,grant_id,membership_id,target_client_id,
                                  target_client_name,consent_version,consent_text,
                                  membership_id,REVIEWER_MEMBERSHIP_ID,
                                  REVIEWER_MEMBERSHIP_ID,REVIEWER_MEMBERSHIP_ID,
                              ),
                          )
                          cursor.executemany(
                              """
                              INSERT INTO automation.agent_grant_capabilities (
                                  org_id,agent_grant_id,capability_code,operation_mode,
                                  risk_class,approval_policy,maximum_amount,currency_code,
                                  allow_sensitive_read,status,created_by_membership_id
                              ) VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,'active',%s)
                              ON CONFLICT (org_id,agent_grant_id,capability_code) DO NOTHING
                              """,
                              [
                                  (
                                      DEMO_ORG_ID,grant_id,capability,mode,risk,approval,
                                      maximum_amount,currency,allow_sensitive,
                                      REVIEWER_MEMBERSHIP_ID,
                                  )
                                  for capability,mode,risk,approval,maximum_amount,currency,
                                      allow_sensitive
                                  in capability_rows
                              ],
                          )
                      cursor.execute(
                          """
                          SELECT grant_row.id::text,capability.capability_code,
                                 capability.operation_mode,capability.risk_class,
                                 capability.approval_policy,
                                 capability.maximum_amount::text,capability.currency_code,
                                 capability.allow_sensitive_read
                            FROM automation.agent_grants AS grant_row
                            JOIN automation.agent_grant_capabilities AS capability
                              ON capability.org_id=grant_row.org_id
                             AND capability.agent_grant_id=grant_row.id
                           WHERE grant_row.org_id=%s
                             AND grant_row.subject_membership_id=%s
                             AND grant_row.client_id=%s
                             AND grant_row.status='active'
                             AND grant_row.expires_at>transaction_timestamp()
                             AND grant_row.consented_by_membership_id=%s
                             AND capability.status='active'
                           ORDER BY capability.capability_code
                          """,
                          (DEMO_ORG_ID, membership_id, target_client_id, membership_id),
                      )
                      readback = cursor.fetchall()
                      expected = sorted(
                          (
                              grant_id,capability,mode,risk,approval,
                              maximum_amount,currency,allow_sensitive,
                          )
                          for capability,mode,risk,approval,maximum_amount,currency,
                              allow_sensitive
                          in capability_rows
                      )
                      if readback != expected:
                          raise SystemExit("reviewed user authority did not reconcile exactly")
                      cursor.execute(
                          """
                          SELECT consent_version,encode(consent_text_hash,'hex'),
                                 expires_at::text,status
                            FROM automation.agent_grants
                           WHERE org_id=%s AND id=%s
                          """,
                          (DEMO_ORG_ID, grant_id),
                      )
                      grant_receipt = cursor.fetchone()
                      if grant_receipt is None or grant_receipt[3] != "active":
                          raise SystemExit("reviewed user authority receipt is unavailable")
                  except BaseException:
                      # Roll back grant changes and temporary role membership before
                      # propagating the root error; cleanup SQL cannot run in an
                      # aborted transaction.
                      connection.rollback()
                      raise
                  else:
                      _leave_migration_owner(cursor, supports_membership_options)
          print(json.dumps({
              "status": "ready",
              "commit_sha": value["expected_sha"],
              "authority_scope": authority_scope,
              "client_id": target_client_id,
              "subject_user_id": resolved_user_id,
              "mcp_commit_sha": value["mcp_reviewed_sha"] or None,
              "grant_id": grant_id,
              "reconciliation_outcome": reconciliation_outcome,
              "capability_count": len(capability_rows),
              "consent_version": grant_receipt[0],
              "consent_text_sha256": grant_receipt[1],
              "expires_at": grant_receipt[2],
              "expires_in_days": 30,
          }, sort_keys=True))
          ''')
          PY
          )
          railway ssh \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_API_SERVICE" \
            --deployment-instance "$RAILWAY_API_DEPLOYMENT_INSTANCE_ID" \
            --identity-file "$SSH_PRIVATE_KEY" \
            -- python -c "$remote_code" < "$request" > "$response"
          test "$(jq -r .status "$response")" = ready
          test "$(jq -r .commit_sha "$response")" = "$REVIEWED_SHA"
          test "$(jq -r .authority_scope "$response")" = "$AUTHORITY_SCOPE"
          if test "$AUTHORITY_SCOPE" = mcp; then
            test "$(jq -r .client_id "$response")" = "$MCP_CLIENT_ID"
            test "$(jq -r .subject_user_id "$response")" = "$SUBJECT_USER_ID"
            test "$(jq -r .mcp_commit_sha "$response")" = "$MCP_REVIEWED_SHA"
            test "$(jq -r .capability_count "$response")" = 28
          else
            test "$(jq -r .client_id "$response")" = aasopharma-erp-web
            test "$(jq -r .capability_count "$response")" = 11
          fi
          jq '{status,commit_sha,mcp_commit_sha,authority_scope,client_id,subject_user_id,
               grant_id,reconciliation_outcome,capability_count,consent_version,
               consent_text_sha256,expires_at}' "$response" > "$AUTHORITY_RECEIPT_PATH"
          test "$(wc -c < "$AUTHORITY_RECEIPT_PATH")" -le 4096

      - name: Upload the secret-free authority receipt
        uses: actions/upload-artifact@v4
        with:
          name: canonical-user-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AUTHORITY_RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Always remove the run-scoped Railway SSH key
        if: always()
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          if test -s "$SSH_FINGERPRINT_PATH"; then
            fingerprint=$(<"$SSH_FINGERPRINT_PATH")
            railway ssh keys remove "$fingerprint" >/dev/null 2>&1 || true
          fi
          ssh-add -D >/dev/null 2>&1 || true
          if test -n "${SSH_AGENT_PID:-}"; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -f "$SSH_PRIVATE_KEY" "$SSH_PRIVATE_KEY.pub" "$SSH_FINGERPRINT_PATH" \
            "$AUTHORITY_RECEIPT_PATH"
