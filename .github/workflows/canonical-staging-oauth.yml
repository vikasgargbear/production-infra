name: Canonical staging OAuth

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-staging-oauth
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: canonical-staging
    env:
      CANONICAL_STAGING_PROJECT_REF: ${{ vars.CANONICAL_STAGING_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      ERP_FRONTEND_URL: https://aasopharma-erp-pilot.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Refuse every project except canonical free staging
        run: |
          set -euo pipefail
          test "$CANONICAL_STAGING_PROJECT_REF" = rgihahbmkrmhitjdjvev
          test "$SUPABASE_URL" = https://rgihahbmkrmhitjdjvev.supabase.co
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Enable the reviewed hosted OAuth server boundary
        run: |
          set -euo pipefail
          payload=$(jq -cn --arg site_url "$ERP_FRONTEND_URL" '{
            site_url: $site_url,
            oauth_server_enabled: true,
            oauth_server_allow_dynamic_registration: false,
            oauth_server_authorization_path: "/oauth/consent"
          }')
          response=$(curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF/config/auth")
          jq -e --arg site_url "$ERP_FRONTEND_URL" '
            .site_url == $site_url and
            .oauth_server_enabled == true and
            .oauth_server_allow_dynamic_registration == false and
            .oauth_server_authorization_path == "/oauth/consent"
          ' <<<"$response" >/dev/null

      - name: Verify OAuth discovery and hosted consent route
        run: |
          set -euo pipefail
          discovery_url="$SUPABASE_URL/.well-known/oauth-authorization-server/auth/v1"
          discovery=''
          for attempt in 1 2 3 4 5; do
            if discovery=$(curl --fail --silent --show-error --max-time 15 "$discovery_url"); then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'OAuth discovery did not become available after five bounded checks' >&2
              exit 1
            fi
            sleep 3
          done
          jq -e --arg issuer "$SUPABASE_URL/auth/v1" '
            .issuer == $issuer and
            .authorization_endpoint == ($issuer + "/oauth/authorize") and
            .token_endpoint == ($issuer + "/oauth/token") and
            (.code_challenge_methods_supported | index("S256")) != null
          ' <<<"$discovery" >/dev/null
          curl --fail --silent --show-error --max-time 15 \
            "$ERP_FRONTEND_URL/oauth/consent?authorization_id=invalid_contract_probe" \
            >/dev/null
          mkdir -p staging-evidence
          jq -n \
            --arg project_ref "$CANONICAL_STAGING_PROJECT_REF" \
            --arg site_url "$ERP_FRONTEND_URL" \
            --arg discovery_url "$discovery_url" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              project_ref: $project_ref,
              site_url: $site_url,
              authorization_path: "/oauth/consent",
              dynamic_client_registration: false,
              discovery_url: $discovery_url,
              discovery_verified: true,
              hosted_consent_route_verified: true,
              commit_sha: $commit_sha,
              verified_at: $verified_at
            }' > staging-evidence/canonical-staging-oauth.json

      - uses: actions/upload-artifact@v4
        with:
          name: canonical-staging-oauth-${{ github.run_id }}
          path: staging-evidence/canonical-staging-oauth.json
          if-no-files-found: error
          retention-days: 30
