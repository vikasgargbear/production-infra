name: Canonical free staging baseline

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_FREE_CANONICAL_STAGING
        required: true
        type: string
      rotate_role_passwords:
        description: Explicitly rotate isolated database role passwords
        required: false
        default: false
        type: boolean
      provision_demo_data:
        description: Provision and exercise the disposable synthetic demo organization
        required: false
        default: false
        type: boolean
      reset_disposable_data:
        description: Reset only canonical schemas and roles on the pinned disposable project
        required: false
        default: false
        type: boolean
      restart_staging_database:
        description: Restart the pinned free staging project before database verification
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      confirmation:
        description: Exact free-staging deployment confirmation
        required: true
        type: string
      rotate_role_passwords:
        description: Explicit isolated-role credential rotation
        required: false
        default: false
        type: boolean
      provision_demo_data:
        description: Provision and exercise the disposable synthetic demo organization
        required: false
        default: false
        type: boolean
      reset_disposable_data:
        description: Reset only canonical schemas and roles on the pinned disposable project
        required: false
        default: false
        type: boolean
      restart_staging_database:
        description: Restart the pinned free staging project before database verification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: canonical-free-staging
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    environment: canonical-staging
    env:
      CANONICAL_BASELINE_APPROVED_SHA256: ${{ vars.CANONICAL_BASELINE_APPROVED_SHA256 }}
      CANONICAL_STAGING_PROJECT_REF: ${{ vars.CANONICAL_STAGING_PROJECT_REF }}
      CANONICAL_PRODUCTION_PROJECT_REFS: ${{ vars.CANONICAL_PRODUCTION_PROJECT_REFS }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ERP_RUNTIME_PASSWORD: ${{ secrets.ERP_RUNTIME_PASSWORD }}
      ERP_CALCULATOR_PASSWORD: ${{ secrets.ERP_CALCULATOR_PASSWORD }}
      ERP_TAX_PROVIDER_PASSWORD: ${{ secrets.ERP_TAX_PROVIDER_PASSWORD }}
      ERP_REGULATORY_IMPORTER_PASSWORD: ${{ secrets.ERP_REGULATORY_IMPORTER_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      MCP_INTERNAL_SERVICE_TOKEN: ${{ secrets.MCP_INTERNAL_SERVICE_TOKEN }}
      MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS: ${{ vars.MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_OAUTH_ISSUER: ${{ vars.SUPABASE_OAUTH_ISSUER }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      TAX_PROVIDER_INTERNAL_HMAC_SECRET: ${{ secrets.TAX_PROVIDER_INTERNAL_HMAC_SECRET }}
      TAX_PROVIDER_INTERNAL_SERVICE_TOKEN: ${{ secrets.TAX_PROVIDER_INTERNAL_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Refuse any target except the reviewed free staging project
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = DEPLOY_FREE_CANONICAL_STAGING
          test -n "$CANONICAL_STAGING_PROJECT_REF"
          test -n "$CANONICAL_PRODUCTION_PROJECT_REFS"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          case ",$CANONICAL_PRODUCTION_PROJECT_REFS," in
            *",$CANONICAL_STAGING_PROJECT_REF,"*)
              echo "staging project appears in the production denylist" >&2
              exit 2
              ;;
          esac

          project_json=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF")
          test "$(jq -r .id <<<"$project_json")" = "$CANONICAL_STAGING_PROJECT_REF"
          test "$(jq -r .status <<<"$project_json")" = ACTIVE_HEALTHY
          test "$(jq -r .region <<<"$project_json")" = ap-south-1

          pooler_json=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF/config/database/pooler")
          pooler_url=$(jq -er \
            '.[] | select(.database_type == "PRIMARY") | .connection_string' \
            <<<"$pooler_json")
          pooler_host=$(sed -E 's#^postgresql://[^@]+@([^:]+):([0-9]+)/.*#\1#' <<<"$pooler_url")
          pooler_port=$(sed -E 's#^postgresql://[^@]+@([^:]+):([0-9]+)/.*#\2#' <<<"$pooler_url")
          test "$pooler_host" = aws-0-ap-south-1.pooler.supabase.com
          test "$pooler_port" = 6543
          echo "SUPABASE_POOLER_HOST=$pooler_host" >> "$GITHUB_ENV"
          echo "SUPABASE_POOLER_PORT=$pooler_port" >> "$GITHUB_ENV"
          echo "SUPABASE_SESSION_POOLER_PORT=5432" >> "$GITHUB_ENV"

      - name: Restart the pinned free staging database
        if: inputs.restart_staging_database == true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF/restart" \
            >/dev/null
          for attempt in $(seq 1 60); do
            status=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF" \
              | jq -er .status)
            if [ "$status" = ACTIVE_HEALTHY ]; then
              sleep 20
              break
            fi
            test "$attempt" -lt 60
            sleep 10
          done

      - name: Install the reviewed migration toolchain
        run: pip install -r backend/requirements.txt

      - name: Verify generated authority before network writes
        run: |
          python3 backend/scripts/check_canonical_artifacts.py
          python3 backend/scripts/package_canonical_baseline_migration.py
          python3 backend/scripts/generate_canonical_data_dictionary.py \
            --check docs/architecture/canonical-field-dictionary.json
          python3 backend/scripts/validate_canonical_model.py
          python3 database/canonical/domains/validate_domain_catalog.py

      - name: Build and mask the staging bootstrap connection
        run: |
          set -euo pipefail
          encoded_password=$(jq -nr --arg value "$SUPABASE_DB_PASSWORD" '$value|@uri')
          psycopg_database_url="postgresql://postgres.${CANONICAL_STAGING_PROJECT_REF}:${encoded_password}@${SUPABASE_POOLER_HOST}:${SUPABASE_POOLER_PORT}/postgres?sslmode=require&connect_timeout=15&application_name=canonical_staging_ci"
          database_url="postgresql+psycopg2://${psycopg_database_url#postgresql://}"
          echo "::add-mask::$database_url"
          echo "::add-mask::$psycopg_database_url"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          echo "PSYCOPG_DATABASE_URL=$psycopg_database_url" >> "$GITHUB_ENV"

      - name: Reset canonical data on the pinned disposable project
        if: inputs.reset_disposable_data == true
        run: |
          set -euo pipefail
          reset_log=$(mktemp)
          if ! psql -X --echo-errors -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" >"$reset_log" 2>&1 <<'SQL'
          DO $quiesce_canonical_logins$
          DECLARE
            role_name text;
          BEGIN
            FOREACH role_name IN ARRAY ARRAY[
              'erp_runtime', 'erp_calculator', 'erp_regulatory_importer',
              'erp_tax_provider'
            ] LOOP
              IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = role_name) THEN
                EXECUTE pg_catalog.format('ALTER ROLE %I NOLOGIN', role_name);
              END IF;
            END LOOP;
          END
          $quiesce_canonical_logins$;
          SELECT pg_catalog.pg_terminate_backend(activity.pid)
            FROM pg_catalog.pg_stat_activity AS activity
           WHERE activity.pid <> pg_catalog.pg_backend_pid()
             AND activity.usename IN (
               'erp_runtime', 'erp_calculator', 'erp_regulatory_importer',
               'erp_tax_provider'
             );
          SQL
          then
            python3 - "$reset_log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Canonical login quiesce failure::{text}")
          PY
            exit 1
          fi
          if ! psql -X --echo-errors -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" >"$reset_log" 2>&1 <<'SQL'
          BEGIN;
          DO $adopt_canonical_roles$
          DECLARE
            role_name text;
          BEGIN
            FOREACH role_name IN ARRAY ARRAY[
              'erp_runtime', 'erp_calculator', 'erp_regulatory_importer',
              'erp_tax_provider', 'erp_app', 'erp_migration_owner'
            ] LOOP
              IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = role_name) THEN
                EXECUTE pg_catalog.format('GRANT %I TO %I', role_name, SESSION_USER);
              END IF;
            END LOOP;
          END
          $adopt_canonical_roles$;
          DROP SCHEMA IF EXISTS
            erp_plumbing,
            erp_tax_provider_commands,
            erp_trade_commands_v2,
            erp_trade_commands,
            erp_trade_invariants,
            erp_commercial_commands,
            erp_finance_invariants,
            erp_finance_commands,
            erp_regulatory_commands,
            erp_core_commands,
            erp_compliance_commands,
            erp_calculation_authority,
            erp_invariants_agent,
            erp_stable_invariants,
            erp_automation_commands,
            erp_security,
            calculation,
            automation,
            hr,
            compliance,
            tax,
            finance,
            procurement,
            sales,
            inventory,
            catalog,
            parties,
            core
          CASCADE;
          DROP EXTENSION IF EXISTS btree_gist;
          DROP TABLE IF EXISTS public.alembic_version;
          DO $reset_canonical_roles$
          DECLARE
            role_name text;
          BEGIN
            FOREACH role_name IN ARRAY ARRAY[
              'erp_runtime', 'erp_calculator', 'erp_regulatory_importer',
              'erp_tax_provider', 'erp_app', 'erp_migration_owner'
            ] LOOP
              IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = role_name) THEN
                EXECUTE pg_catalog.format('DROP OWNED BY %I CASCADE', role_name);
              END IF;
            END LOOP;
          END
          $reset_canonical_roles$;
          DROP ROLE IF EXISTS erp_runtime;
          DROP ROLE IF EXISTS erp_calculator;
          DROP ROLE IF EXISTS erp_regulatory_importer;
          DROP ROLE IF EXISTS erp_tax_provider;
          DROP ROLE IF EXISTS erp_app;
          DROP ROLE IF EXISTS erp_migration_owner;
          COMMIT;
          SQL
          then
            python3 - "$reset_log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Disposable canonical reset failure::{text}")
          PY
            exit 1
          fi
          cat "$reset_log"
          test "$(psql -X -Atqc "SELECT to_regclass('auth.users') IS NOT NULL" "$PSYCOPG_DATABASE_URL")" = t
          test "$(psql -X -Atqc "SELECT to_regclass('public.alembic_version') IS NULL" "$PSYCOPG_DATABASE_URL")" = t
          test "$(psql -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname IN ('core','sales','erp_security')" "$PSYCOPG_DATABASE_URL")" = 0

      - name: Apply or verify the approved baseline
        run: |
          set -euo pipefail
          export PGOPTIONS='-c statement_timeout=120000 -c lock_timeout=15000'
          package_hash=$(python3 backend/scripts/package_canonical_baseline_migration.py --print-sha256)
          test "$package_hash" = "$CANONICAL_BASELINE_APPROVED_SHA256"
          log_file=$(mktemp)
          baseline_applied=false
          baseline_state=$(mktemp)
          baseline_query=$(cat <<'SQL'
          SELECT revision.version_num,
                 (SELECT count(*)::integer
                    FROM information_schema.tables
                   WHERE table_schema IN (
                     'core','parties','catalog','hr','inventory','sales',
                     'procurement','finance','tax','compliance','automation','calculation'
                   ) AND table_type='BASE TABLE') AS table_count,
                 (SELECT count(*)::integer FROM pg_catalog.pg_roles
                   WHERE rolname IN (
                     'erp_runtime','erp_calculator','erp_tax_provider',
                     'erp_regulatory_importer'
                   )) AS isolated_role_count,
                 (SELECT count(*)::integer FROM pg_catalog.pg_roles
                   WHERE rolname IN (
                     'erp_runtime','erp_calculator','erp_tax_provider',
                     'erp_regulatory_importer'
                   ) AND (rolsuper OR rolcreaterole OR rolbypassrls OR NOT rolcanlogin)
                 ) AS unsafe_role_count
            FROM public.alembic_version AS revision
           WHERE revision.version_num='20260820_0001'
          SQL
          )
          if curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg query "$baseline_query" '{query:$query}')" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF/database/query/read-only" \
            >"$baseline_state" \
            && jq -e '.. | objects | select(.version_num? == "20260820_0001" and ((.table_count? // "") | tostring) == "110" and ((.isolated_role_count? // "") | tostring) == "4" and ((.unsafe_role_count? // "") | tostring) == "0")' \
              "$baseline_state" >/dev/null; then
            echo "Control plane verified exact canonical revision and topology; Alembic is already current"
            baseline_applied=true
          fi
          if [ "$baseline_applied" != true ]; then
            for attempt in $(seq 1 30); do
              if (
                cd backend
                alembic -c alembic.ini upgrade head
                alembic -c alembic.ini upgrade head
              ) >"$log_file" 2>&1; then
                baseline_applied=true
                cat "$log_file"
                break
              fi
              cat "$log_file"
              if ! grep -Eqi \
                'OperationalError|econnrefused|connection refused|server closed the connection unexpectedly|canceling statement due to (lock|statement) timeout' \
                "$log_file"; then
                break
              fi
              if [ "$attempt" -lt 30 ]; then
                echo "Supabase pooler unavailable; retrying baseline connection ($attempt/30)"
                sleep 20
              fi
            done
          fi
          if [ "$baseline_applied" != true ]; then
            {
              echo
              echo "--- rollback-safe psql statement diagnostic ---"
              psql -X --echo-errors -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
                -f backend/alembic/sql/20260820_0001_canonical_v1.sql
            } >> "$log_file" 2>&1 || true
            python3 - "$log_file" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Canonical free staging baseline failure::{text}")
          PY
            exit 1
          fi

      - name: Reconcile reviewed document sequence allocator on existing staging
        run: |
          set -euo pipefail
          cleanup_reconcile_membership() {
            psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
              -c 'REVOKE erp_migration_owner FROM postgres' \
              >/dev/null 2>&1 || true
          }
          trap cleanup_reconcile_membership EXIT
          psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
            -c 'GRANT erp_migration_owner TO postgres' >/dev/null
          python3 - <<'PY'
          import json
          import pathlib

          mapping = json.loads(pathlib.Path(
              "database/canonical/commands_core/baseline-core-command-enforcements.json"
          ).read_text())
          statements = [
              statement
              for enforcement in mapping["enforcements"]
              for statement in enforcement["statements"]
              if statement.startswith(
                  'CREATE FUNCTION "erp_core_commands"."allocate_document_number"'
              )
          ]
          if len(statements) != 1:
              raise SystemExit("reviewed document allocator definition is not exact")
          definition = statements[0]
          if "pg_catalog.greatest(sequence.padding::integer" not in definition:
              raise SystemExit("reviewed document allocator lacks the PostgreSQL type correction")
          upgrade = definition.replace("CREATE FUNCTION", "CREATE OR REPLACE FUNCTION", 1)
          pathlib.Path("/tmp/reconcile_document_allocator.sql").write_text(
              "BEGIN;\nSET LOCAL ROLE erp_migration_owner;\n"
              + upgrade
              + ";\nCOMMIT;\n"
          )
          PY
          psql -X --echo-errors -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
            -f /tmp/reconcile_document_allocator.sql
          cleanup_reconcile_membership
          trap - EXIT

      - name: Provision isolated staging login credentials
        if: inputs.rotate_role_passwords == true || inputs.reset_disposable_data == true || inputs.provision_demo_data == true
        run: |
          python3 - <<'PY'
          import os
          import psycopg2
          from psycopg2 import sql

          roles = {
              "erp_runtime": os.environ["ERP_RUNTIME_PASSWORD"],
              "erp_calculator": os.environ["ERP_CALCULATOR_PASSWORD"],
              "erp_tax_provider": os.environ["ERP_TAX_PROVIDER_PASSWORD"],
              "erp_regulatory_importer": os.environ["ERP_REGULATORY_IMPORTER_PASSWORD"],
          }
          with psycopg2.connect(os.environ["PSYCOPG_DATABASE_URL"]) as connection:
              connection.autocommit = True
              with connection.cursor() as cursor:
                  for role, password in roles.items():
                      cursor.execute(
                          sql.SQL("ALTER ROLE {} LOGIN PASSWORD %s").format(sql.Identifier(role)),
                          (password,),
                      )
          PY

      - name: Verify baseline topology and isolated role posture
        run: |
          python3 - <<'PY'
          import os
          import sys
          import time
          from urllib.parse import quote

          import psycopg2

          expected_roles = {
              "erp_runtime": os.environ["ERP_RUNTIME_PASSWORD"],
              "erp_calculator": os.environ["ERP_CALCULATOR_PASSWORD"],
              "erp_tax_provider": os.environ["ERP_TAX_PROVIDER_PASSWORD"],
              "erp_regulatory_importer": os.environ["ERP_REGULATORY_IMPORTER_PASSWORD"],
          }
          ref = os.environ["CANONICAL_STAGING_PROJECT_REF"]
          host = os.environ["SUPABASE_POOLER_HOST"]
          port = os.environ["SUPABASE_SESSION_POOLER_PORT"]
          for role, password in expected_roles.items():
              url = (
                  f"postgresql://{role}.{ref}:{quote(password, safe='')}"
                  f"@{host}:{port}/postgres?sslmode=require&connect_timeout=15&application_name=canonical_staging_verify"
              )
              last_error = None
              for attempt in range(1, 19):
                  try:
                      with psycopg2.connect(url) as connection:
                          with connection.cursor() as cursor:
                              cursor.execute(
                                  "SELECT current_user, rolsuper, rolbypassrls "
                                  "FROM pg_catalog.pg_roles WHERE rolname = current_user"
                              )
                              posture = cursor.fetchone()
                              assert posture == (role, False, False), posture
                      last_error = None
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt < 18:
                          time.sleep(5)
              if last_error is not None:
                  message = str(last_error).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(
                      f"::error title=Canonical staging role verification failed::{role}: {message}",
                      file=sys.stderr,
                  )
                  raise last_error
          PY

      - name: Run canonical rollback fixtures on live free staging
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=15
          export PGOPTIONS='-c statement_timeout=120000 -c lock_timeout=15000'
          cleanup_role_membership() {
            psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
              -c 'REVOKE erp_migration_owner, erp_runtime FROM postgres' \
              >/dev/null 2>&1 || true
          }
          trap cleanup_role_membership EXIT
          psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
            -c 'GRANT erp_migration_owner, erp_runtime TO postgres' >/dev/null

          fixture_count=0
          while IFS= read -r fixture; do
            if ! grep -q '^BEGIN;' "$fixture"; then
              test "$fixture" = \
                database/canonical/invariants_finance/test_finance_invariants.sql
            else
              grep -q '^ROLLBACK;' "$fixture"
            fi
            echo "running live rollback fixture: $fixture"
            fixture_log=$(mktemp)
            if ! psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
              -f "$fixture" >"$fixture_log" 2>&1; then
              cat "$fixture_log"
              python3 - "$fixture" "$fixture_log" <<'PY'
          import pathlib
          import sys

          fixture = sys.argv[1]
          detail = pathlib.Path(sys.argv[2]).read_text(errors="replace")[-3000:]
          detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Live canonical fixture failed::{fixture}: {detail}")
          PY
              exit 1
            fi
            cat "$fixture_log"
            fixture_count=$((fixture_count + 1))
          done < <(find database/canonical -type f -name 'test_*.sql' | LC_ALL=C sort)
          test "$fixture_count" = 14

          cleanup_role_membership
          trap - EXIT
          mkdir -p staging-evidence
          jq -n \
            --argjson fixture_count "$fixture_count" \
            --arg database_engine "Supabase PostgreSQL 17" \
            '{
              fixture_count: $fixture_count,
              database_engine: $database_engine,
              mutation_boundary: "BEGIN_ROLLBACK_or_read_only",
              result: "all_canonical_sql_fixtures_passed"
            }' > staging-evidence/canonical-staging-sql-fixtures.json

      - name: Build and mask isolated service connections
        run: |
          set -euo pipefail
          host="$SUPABASE_POOLER_HOST"
          port="$SUPABASE_SESSION_POOLER_PORT"
          runtime_password=$(jq -nr --arg value "$ERP_RUNTIME_PASSWORD" '$value|@uri')
          calculator_password=$(jq -nr --arg value "$ERP_CALCULATOR_PASSWORD" '$value|@uri')
          provider_password=$(jq -nr --arg value "$ERP_TAX_PROVIDER_PASSWORD" '$value|@uri')
          runtime_url="postgresql://erp_runtime.${CANONICAL_STAGING_PROJECT_REF}:${runtime_password}@${host}:${port}/postgres?sslmode=require&connect_timeout=15&application_name=aasopharma_api_pilot"
          calculator_url="postgresql://erp_calculator.${CANONICAL_STAGING_PROJECT_REF}:${calculator_password}@${host}:${port}/postgres?sslmode=require&connect_timeout=15&application_name=aasopharma_calculator_pilot"
          provider_url="postgresql://erp_tax_provider.${CANONICAL_STAGING_PROJECT_REF}:${provider_password}@${host}:${port}/postgres?sslmode=require&connect_timeout=15&application_name=aasopharma_tax_provider_pilot"
          echo "::add-mask::$runtime_url"
          echo "::add-mask::$calculator_url"
          echo "::add-mask::$provider_url"
          echo "DATABASE_URL=$runtime_url" >> "$GITHUB_ENV"
          echo "ERP_CALCULATOR_DATABASE_URL=$calculator_url" >> "$GITHUB_ENV"
          echo "TAX_PROVIDER_DATABASE_URL=$provider_url" >> "$GITHUB_ENV"

      - name: Reconcile and deploy the free Render pilot
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$JWT_SECRET_KEY"
          test -n "$SUPABASE_ANON_KEY"
          test "$MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS" = disabled-unissued-canonical-staging
          mkdir -p staging-evidence
          python3 backend/scripts/provision_render_pilot.py \
            --apply \
            --deploy \
            --branch "$GITHUB_REF_NAME" \
            > staging-evidence/render-pilot.json

      - name: Wait for free service smoke readiness
        run: |
          set -euo pipefail
          api_url=$(jq -er '.services["aasopharma-api-pilot"].url' staging-evidence/render-pilot.json)
          frontend_url=$(jq -er '.services["aasopharma-erp-pilot"].url' staging-evidence/render-pilot.json)
          mcp_url=$(jq -er '.services["aasopharma-mcp-pilot"].url' staging-evidence/render-pilot.json)
          for url in "$api_url" "$frontend_url" "$mcp_url"; do
            echo "::add-mask::$url"
          done

          api_ready=false
          frontend_ready=false
          mcp_healthy=false
          for _attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 20 "$api_url/health" >/dev/null \
              && curl --fail --silent --show-error --max-time 20 "$api_url/ready" >/dev/null; then
              api_ready=true
            fi
            if curl --fail --silent --show-error --max-time 20 "$frontend_url/" >/dev/null; then
              frontend_ready=true
            fi
            if curl --fail --silent --show-error --max-time 20 "$mcp_url/health" >/dev/null; then
              mcp_healthy=true
            fi
            if [ "$api_ready" = true ] && [ "$frontend_ready" = true ] \
              && [ "$mcp_healthy" = true ]; then
              break
            fi
            sleep 10
          done
          test "$api_ready" = true
          test "$frontend_ready" = true
          test "$mcp_healthy" = true

          mcp_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 20 "$mcp_url/ready" || true)
          jq --arg api "$api_url" \
             --arg frontend "$frontend_url" \
             --arg mcp "$mcp_url" \
             --arg mcp_status "$mcp_status" \
             '. + {
               smoke: {
                 api_url: $api,
                 api_ready: true,
                 frontend_url: $frontend,
                 frontend_ready: true,
                 mcp_url: $mcp,
                 mcp_healthy: true,
                 mcp_readiness_http_status: $mcp_status,
                 mcp_advertised: false
               }
             }' staging-evidence/render-pilot.json \
             > staging-evidence/render-pilot-smoke.json

      - name: Provision and exercise the disposable demo organization
        if: inputs.provision_demo_data == true
        env:
          CANONICAL_DEMO_WRITE_ACK: PROVISION_DISPOSABLE_DEMO
          CANONICAL_DEMO_EVIDENCE_DIR: staging-evidence
        run: |
          set -euo pipefail
          test -n "$ERP_REGULATORY_IMPORTER_PASSWORD"
          cleanup_demo_role_membership() {
            psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
              -c 'REVOKE erp_migration_owner FROM postgres' \
              >/dev/null 2>&1 || true
          }
          trap cleanup_demo_role_membership EXIT
          psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
            -c 'GRANT erp_migration_owner TO postgres' >/dev/null

          importer_password=$(jq -nr --arg value "$ERP_REGULATORY_IMPORTER_PASSWORD" '$value|@uri')
          importer_url="postgresql://erp_regulatory_importer.${CANONICAL_STAGING_PROJECT_REF}:${importer_password}@${SUPABASE_POOLER_HOST}:${SUPABASE_SESSION_POOLER_PORT}/postgres?sslmode=require&connect_timeout=15&application_name=canonical_demo_importer"
          echo "::add-mask::$importer_url"
          export ERP_REGULATORY_IMPORTER_DATABASE_URL="$importer_url"

          runtime_password=$(jq -nr --arg value "$ERP_RUNTIME_PASSWORD" '$value|@uri')
          runtime_url="postgresql://erp_runtime.${CANONICAL_STAGING_PROJECT_REF}:${runtime_password}@${SUPABASE_POOLER_HOST}:${SUPABASE_SESSION_POOLER_PORT}/postgres?sslmode=require&connect_timeout=15&application_name=canonical_demo_runtime"
          echo "::add-mask::$runtime_url"
          export ERP_RUNTIME_DATABASE_URL="$runtime_url"
          export CANONICAL_DEMO_API_URL
          CANONICAL_DEMO_API_URL=$(jq -er '.services["aasopharma-api-pilot"].url' staging-evidence/render-pilot.json)

          demo_log=$(mktemp)
          if ! python3 backend/scripts/provision_canonical_demo.py 2>&1 | tee "$demo_log"; then
            python3 - "$demo_log" <<'PY'
          import pathlib
          import sys

          detail = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Canonical demo provisioning failed::{detail}")
          PY
            exit 1
          fi
          cleanup_demo_role_membership
          trap - EXIT

      - name: Publish staging baseline evidence
        run: |
          mkdir -p staging-evidence
          jq -n \
            --arg project_ref "$CANONICAL_STAGING_PROJECT_REF" \
            --arg revision "20260820_0001" \
            --arg approved_sha256 "$CANONICAL_BASELINE_APPROVED_SHA256" \
            --arg commit_sha "$GITHUB_SHA" \
            '{
              project_ref: $project_ref,
              revision: $revision,
              approved_sha256: $approved_sha256,
              commit_sha: $commit_sha,
              canonical_table_count: 110,
              result: "baseline_and_isolated_roles_verified"
            }' > staging-evidence/canonical-staging-baseline.json

      - uses: actions/upload-artifact@v4
        with:
          name: canonical-staging-baseline-${{ github.run_id }}
          path: staging-evidence/*
          if-no-files-found: error
          retention-days: 14
