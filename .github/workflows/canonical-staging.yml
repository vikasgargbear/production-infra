name: Canonical free staging baseline

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_FREE_CANONICAL_STAGING
        required: true
        type: string
      rotate_role_passwords:
        description: Explicitly rotate isolated database role passwords
        required: false
        default: false
        type: boolean
      refresh_pooler_configuration:
        description: Reapply the reviewed free-tier Supavisor configuration
        required: false
        default: false
        type: boolean
      provision_demo_data:
        description: Provision and exercise the disposable synthetic demo organization
        required: false
        default: false
        type: boolean
      deploy_render_pilot:
        description: Deploy and verify the reviewed application SHA on all three Render pilot services
        required: false
        default: true
        type: boolean
      reset_disposable_data:
        description: Reset only canonical schemas and roles on the pinned disposable project
        required: false
        default: false
        type: boolean
      restart_staging_database:
        description: Restart the pinned free staging project before database verification
        required: false
        default: false
        type: boolean
      render_deploy_sha:
        description: Reviewed application commit to deploy; defaults to this workflow commit
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      confirmation:
        description: Exact free-staging deployment confirmation
        required: true
        type: string
      rotate_role_passwords:
        description: Explicit isolated-role credential rotation
        required: false
        default: false
        type: boolean
      refresh_pooler_configuration:
        description: Reapply the reviewed free-tier Supavisor configuration
        required: false
        default: false
        type: boolean
      provision_demo_data:
        description: Provision and exercise the disposable synthetic demo organization
        required: false
        default: false
        type: boolean
      deploy_render_pilot:
        description: Deploy and verify the reviewed application SHA on all three Render pilot services
        required: false
        default: false
        type: boolean
      reset_disposable_data:
        description: Reset only canonical schemas and roles on the pinned disposable project
        required: false
        default: false
        type: boolean
      restart_staging_database:
        description: Restart the pinned free staging project before database verification
        required: false
        default: false
        type: boolean
      render_deploy_sha:
        description: Reviewed application commit to deploy; defaults to this workflow commit
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: canonical-free-staging
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    environment: canonical-staging
    env:
      CANONICAL_BASELINE_APPROVED_SHA256: ${{ vars.CANONICAL_BASELINE_APPROVED_SHA256 }}
      CANONICAL_STAGING_PROJECT_REF: ${{ vars.CANONICAL_STAGING_PROJECT_REF }}
      CANONICAL_PRODUCTION_PROJECT_REFS: ${{ vars.CANONICAL_PRODUCTION_PROJECT_REFS }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ERP_RUNTIME_PASSWORD: ${{ secrets.ERP_RUNTIME_PASSWORD }}
      ERP_CALCULATOR_PASSWORD: ${{ secrets.ERP_CALCULATOR_PASSWORD }}
      ERP_TAX_PROVIDER_PASSWORD: ${{ secrets.ERP_TAX_PROVIDER_PASSWORD }}
      ERP_REGULATORY_IMPORTER_PASSWORD: ${{ secrets.ERP_REGULATORY_IMPORTER_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      MCP_INTERNAL_SERVICE_TOKEN: ${{ secrets.MCP_INTERNAL_SERVICE_TOKEN }}
      MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS: ${{ vars.MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS }}
      MCP_ALLOWED_ORIGINS: ${{ vars.MCP_ALLOWED_ORIGINS }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_OAUTH_ISSUER: ${{ vars.SUPABASE_OAUTH_ISSUER }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID: ${{ vars.CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID }}
      TAX_PROVIDER_INTERNAL_HMAC_SECRET: ${{ secrets.TAX_PROVIDER_INTERNAL_HMAC_SECRET }}
      TAX_PROVIDER_INTERNAL_SERVICE_TOKEN: ${{ secrets.TAX_PROVIDER_INTERNAL_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Refuse any target except the reviewed free staging project
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = DEPLOY_FREE_CANONICAL_STAGING
          test -n "$CANONICAL_STAGING_PROJECT_REF"
          test -n "$CANONICAL_PRODUCTION_PROJECT_REFS"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID"
          test -n "$SUPABASE_DB_PASSWORD"
          case ",$CANONICAL_PRODUCTION_PROJECT_REFS," in
            *",$CANONICAL_STAGING_PROJECT_REF,"*)
              echo "staging project appears in the production denylist" >&2
              exit 2
              ;;
          esac

          project_json=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF")
          test "$(jq -r .id <<<"$project_json")" = "$CANONICAL_STAGING_PROJECT_REF"
          test "$(jq -r .status <<<"$project_json")" = ACTIVE_HEALTHY
          test "$(jq -r .region <<<"$project_json")" = ap-south-1

          pooler_json=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF/config/database/pooler")
          pooler_url=$(jq -er \
            '.[] | select(.database_type == "PRIMARY") | .connection_string' \
            <<<"$pooler_json")
          pooler_host=$(sed -E 's#^postgresql://[^@]+@([^:]+):([0-9]+)/.*#\1#' <<<"$pooler_url")
          pooler_port=$(sed -E 's#^postgresql://[^@]+@([^:]+):([0-9]+)/.*#\2#' <<<"$pooler_url")
          test "$pooler_host" = aws-0-ap-south-1.pooler.supabase.com
          test "$pooler_port" = 6543
          echo "SUPABASE_POOLER_HOST=$pooler_host" >> "$GITHUB_ENV"
          echo "SUPABASE_POOLER_PORT=$pooler_port" >> "$GITHUB_ENV"
          echo "SUPABASE_SESSION_POOLER_PORT=5432" >> "$GITHUB_ENV"

      - name: Restart the pinned free staging database
        if: inputs.restart_staging_database == true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF/restart" \
            >/dev/null
          for attempt in $(seq 1 5); do
            status=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF" \
              | jq -er .status)
            if [ "$status" = ACTIVE_HEALTHY ]; then
              # Supavisor can retain a failed auth-query circuit for up to two minutes.
              sleep 125
              break
            fi
            test "$attempt" -lt 5
            sleep 15
          done

      - name: Install the reviewed migration toolchain
        run: pip install -r backend/requirements.txt

      - name: Verify generated authority before network writes
        run: |
          python3 backend/scripts/check_canonical_artifacts.py
          python3 backend/scripts/package_canonical_baseline_migration.py
          python3 backend/scripts/generate_canonical_data_dictionary.py \
            --check docs/architecture/canonical-field-dictionary.json
          python3 backend/scripts/validate_canonical_model.py
          python3 database/canonical/domains/validate_domain_catalog.py

      - name: Build and mask the staging bootstrap connection
        run: |
          set -euo pipefail
          encoded_password=$(jq -nr --arg value "$SUPABASE_DB_PASSWORD" '$value|@uri')
          # Canonical migrations, role DDL, and rollback fixtures require a persistent
          # PostgreSQL session. Supabase reserves 6543 transaction mode for short-lived
          # serverless traffic; the IPv4 session pooler is exposed on 5432.
          psycopg_database_url="postgresql://postgres.${CANONICAL_STAGING_PROJECT_REF}:${encoded_password}@${SUPABASE_POOLER_HOST}:${SUPABASE_SESSION_POOLER_PORT}/postgres?sslmode=require&gssencmode=disable&connect_timeout=15&application_name=canonical_staging_ci"
          database_url="postgresql+psycopg2://${psycopg_database_url#postgresql://}"
          echo "::add-mask::$database_url"
          echo "::add-mask::$psycopg_database_url"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          echo "PSYCOPG_DATABASE_URL=$psycopg_database_url" >> "$GITHUB_ENV"
          echo "CANONICAL_ACTIVE_POOLER_PORT=$SUPABASE_SESSION_POOLER_PORT" >> "$GITHUB_ENV"
          echo "CANONICAL_ACTIVE_POOLER_MODE=session" >> "$GITHUB_ENV"

      - name: Refresh the reviewed free-tier Supavisor configuration
        if: inputs.refresh_pooler_configuration == true
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"default_pool_size":5,"pool_mode":"transaction"}' \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF/config/database/pooler")
          test "$(jq -r .default_pool_size <<<"$response")" = 5
          test "$(jq -r .pool_mode <<<"$response")" = transaction
          sleep 125

      - name: Reset canonical data on the pinned disposable project
        if: inputs.reset_disposable_data == true
        run: |
          set -euo pipefail
          reset_log=$(mktemp)
          if ! psql -X --echo-errors -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" >"$reset_log" 2>&1 <<'SQL'
          DO $quiesce_canonical_logins$
          DECLARE
            role_name text;
          BEGIN
            FOREACH role_name IN ARRAY ARRAY[
              'erp_runtime', 'erp_calculator', 'erp_regulatory_importer',
              'erp_tax_provider'
            ] LOOP
              IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = role_name) THEN
                EXECUTE pg_catalog.format('ALTER ROLE %I NOLOGIN', role_name);
              END IF;
            END LOOP;
          END
          $quiesce_canonical_logins$;
          SELECT pg_catalog.pg_terminate_backend(activity.pid)
            FROM pg_catalog.pg_stat_activity AS activity
           WHERE activity.pid <> pg_catalog.pg_backend_pid()
             AND activity.usename IN (
               'erp_runtime', 'erp_calculator', 'erp_regulatory_importer',
               'erp_tax_provider'
             );
          SQL
          then
            python3 - "$reset_log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Canonical login quiesce failure::{text}")
          PY
            exit 1
          fi
          if ! psql -X --echo-errors -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" >"$reset_log" 2>&1 <<'SQL'
          BEGIN;
          DO $adopt_canonical_roles$
          DECLARE
            role_name text;
          BEGIN
            FOREACH role_name IN ARRAY ARRAY[
              'erp_runtime', 'erp_calculator', 'erp_regulatory_importer',
              'erp_tax_provider', 'erp_app', 'erp_migration_owner'
            ] LOOP
              IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = role_name) THEN
                EXECUTE pg_catalog.format('GRANT %I TO %I', role_name, SESSION_USER);
              END IF;
            END LOOP;
          END
          $adopt_canonical_roles$;
          DROP SCHEMA IF EXISTS
            erp_plumbing,
            erp_tax_provider_commands,
            erp_trade_commands_v2,
            erp_trade_commands,
            erp_trade_invariants,
            erp_commercial_commands,
            erp_finance_invariants,
            erp_finance_commands,
            erp_regulatory_commands,
            erp_core_commands,
            erp_compliance_commands,
            erp_calculation_authority,
            erp_invariants_agent,
            erp_stable_invariants,
            erp_automation_commands,
            erp_security,
            calculation,
            automation,
            hr,
            compliance,
            tax,
            finance,
            procurement,
            sales,
            inventory,
            catalog,
            parties,
            core
          CASCADE;
          DROP EXTENSION IF EXISTS btree_gist;
          DROP TABLE IF EXISTS public.alembic_version;
          DO $reset_canonical_roles$
          DECLARE
            role_name text;
          BEGIN
            FOREACH role_name IN ARRAY ARRAY[
              'erp_runtime', 'erp_calculator', 'erp_regulatory_importer',
              'erp_tax_provider', 'erp_app', 'erp_migration_owner'
            ] LOOP
              IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = role_name) THEN
                EXECUTE pg_catalog.format('DROP OWNED BY %I CASCADE', role_name);
              END IF;
            END LOOP;
          END
          $reset_canonical_roles$;
          DROP ROLE IF EXISTS erp_runtime;
          DROP ROLE IF EXISTS erp_calculator;
          DROP ROLE IF EXISTS erp_regulatory_importer;
          DROP ROLE IF EXISTS erp_tax_provider;
          DROP ROLE IF EXISTS erp_app;
          DROP ROLE IF EXISTS erp_migration_owner;
          COMMIT;
          SQL
          then
            python3 - "$reset_log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Disposable canonical reset failure::{text}")
          PY
            exit 1
          fi
          cat "$reset_log"
          test "$(psql -X -Atqc "SELECT to_regclass('auth.users') IS NOT NULL" "$PSYCOPG_DATABASE_URL")" = t
          test "$(psql -X -Atqc "SELECT to_regclass('public.alembic_version') IS NULL" "$PSYCOPG_DATABASE_URL")" = t
          test "$(psql -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname IN ('core','sales','erp_security')" "$PSYCOPG_DATABASE_URL")" = 0

      - name: Apply or verify the approved canonical migration head
        run: |
          set -euo pipefail
          export PGOPTIONS='-c statement_timeout=120000 -c lock_timeout=15000'
          package_hash=$(python3 backend/scripts/package_canonical_baseline_migration.py --print-sha256)
          test "$package_hash" = "$CANONICAL_BASELINE_APPROVED_SHA256"
          log_file=$(mktemp)
          baseline_applied=false
          baseline_state=$(mktemp)
          baseline_query=$(cat <<'SQL'
          SELECT revision.version_num,
                 (SELECT count(*)::integer
                    FROM information_schema.tables
                   WHERE table_schema IN (
                     'core','parties','catalog','hr','inventory','sales',
                     'procurement','finance','tax','compliance','automation','calculation'
                   ) AND table_type='BASE TABLE') AS table_count,
                 (SELECT count(*)::integer FROM pg_catalog.pg_roles
                   WHERE rolname IN (
                     'erp_runtime','erp_calculator','erp_tax_provider',
                     'erp_regulatory_importer'
                   )) AS isolated_role_count,
                 (SELECT count(*)::integer FROM pg_catalog.pg_roles
                   WHERE rolname IN (
                     'erp_runtime','erp_calculator','erp_tax_provider',
                     'erp_regulatory_importer'
                   ) AND (rolsuper OR rolcreaterole OR rolbypassrls)
                 ) AS unsafe_role_count
            FROM public.alembic_version AS revision
           WHERE revision.version_num='20260825_0005'
          SQL
          )
          if curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg query "$baseline_query" '{query:$query}')" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF/database/query/read-only" \
            >"$baseline_state" \
            && jq -e '.. | objects | select(.version_num? == "20260825_0005" and ((.table_count? // "") | tostring) == "111" and ((.isolated_role_count? // "") | tostring) == "4" and ((.unsafe_role_count? // "") | tostring) == "0")' \
              "$baseline_state" >/dev/null; then
            echo "Control plane verified exact canonical revision and topology; Alembic is already current"
            baseline_applied=true
          fi
          if [ "$baseline_applied" != true ]; then
            cleanup_alembic_membership() {
              psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
                -c 'GRANT erp_migration_owner TO postgres WITH SET FALSE' \
                >/dev/null 2>&1 || true
            }
            trap cleanup_alembic_membership EXIT
            for attempt in $(seq 1 3); do
              if (
                cd backend
                alembic -c alembic.ini upgrade 20260820_0001
                cd ..
                psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
                  -c 'GRANT erp_migration_owner TO postgres WITH SET TRUE' >/dev/null
                cd backend
                alembic -c alembic.ini upgrade head
                alembic -c alembic.ini upgrade head
              ) >"$log_file" 2>&1; then
                baseline_applied=true
                cat "$log_file"
                break
              fi
              cat "$log_file"
              if ! grep -Eqi \
                'OperationalError|econnrefused|connection refused|server closed the connection unexpectedly|server didn.t return client encoding|EAUTHQUERY|auth_query secret check timed out|canceling statement due to (lock|statement) timeout' \
                "$log_file"; then
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Supabase pooler unavailable; retrying baseline connection ($attempt/3)"
                sleep 20
              fi
            done
            cleanup_alembic_membership
            trap - EXIT
          fi
          if [ "$baseline_applied" != true ]; then
            python3 - "$log_file" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Canonical free staging migration failure::{text}")
          PY
            exit 1
          fi

      - name: Provision isolated staging login credentials
        if: inputs.rotate_role_passwords == true || inputs.reset_disposable_data == true
        run: |
          python3 - <<'PY'
          import os
          import psycopg2
          import re
          import sys
          import time
          from psycopg2 import sql

          roles = {
              "erp_runtime": os.environ["ERP_RUNTIME_PASSWORD"],
              "erp_calculator": os.environ["ERP_CALCULATOR_PASSWORD"],
              "erp_tax_provider": os.environ["ERP_TAX_PROVIDER_PASSWORD"],
              "erp_regulatory_importer": os.environ["ERP_REGULATORY_IMPORTER_PASSWORD"],
          }
          for role, password in roles.items():
              if not re.fullmatch(r"[A-Za-z0-9_-]{48,96}", password):
                  raise RuntimeError(f"{role} secret is not a valid generated staging credential")

          session_url = os.environ["PSYCOPG_DATABASE_URL"]
          transaction_url = session_url.replace(
              f":{os.environ['SUPABASE_SESSION_POOLER_PORT']}/postgres",
              f":{os.environ['SUPABASE_POOLER_PORT']}/postgres",
              1,
          )
          if transaction_url == session_url:
              raise RuntimeError("could not derive the transaction-pooler bootstrap URL")

          last_error = None
          for attempt in range(1, 3):
              for pooler_mode, database_url in (
                  ("session", session_url),
                  ("transaction", transaction_url),
              ):
                  try:
                      with psycopg2.connect(database_url, connect_timeout=10) as connection:
                          with connection.cursor() as cursor:
                              for role, password in roles.items():
                                  cursor.execute(
                                      "SELECT rolcanlogin FROM pg_catalog.pg_roles WHERE rolname=%s",
                                      (role,),
                                  )
                                  posture = cursor.fetchone()
                                  if posture is None:
                                      raise RuntimeError(f"reviewed staging role is missing: {role}")
                                  cursor.execute(
                                      sql.SQL("ALTER ROLE {} LOGIN PASSWORD %s").format(
                                          sql.Identifier(role)
                                      ),
                                      (password,),
                                  )
                      print(f"Rotated isolated roles through {pooler_mode} pooler")
                      last_error = None
                      break
                  except Exception as exc:
                      last_error = exc
              if last_error is None:
                  break
              if attempt < 2:
                  time.sleep(5)
          if last_error is not None:
              message = str(last_error).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(
                  f"::error title=Canonical staging role restoration failed::{message}",
                  file=sys.stderr,
              )
              raise last_error
          PY

      - name: Allow rotated credentials to propagate through Supavisor
        if: inputs.rotate_role_passwords == true || inputs.reset_disposable_data == true
        run: sleep 125

      - name: Reconcile reviewed command definitions on pre-cutover staging
        run: |
          set -euo pipefail
          definition_state=$(mktemp)
          definition_query=$(cat <<'SQL'
          SELECT position('pg_catalog.greatest(' IN pg_catalog.pg_get_functiondef('erp_core_commands.allocate_document_number(uuid,uuid,bytea,timestamptz)'::regprocedure))=0 AS core_current,
                 position('pg_catalog.least(' IN pg_catalog.pg_get_functiondef('erp_automation_commands.execute_approved_command(uuid,uuid)'::regprocedure))=0
                   AND position('exact_execute_aggregate_bindings_v2' IN pg_catalog.pg_get_functiondef('erp_automation_commands.execute_approved_command(uuid,uuid)'::regprocedure))>0
                   AND position('''purchase_order'',purchase_order.id,purchase_order.row_version' IN pg_catalog.pg_get_functiondef('erp_automation_commands.execute_approved_command(uuid,uuid)'::regprocedure))>0
                   AND position('''supplier_invoice'',supplier_invoice.id,supplier_invoice.row_version' IN pg_catalog.pg_get_functiondef('erp_automation_commands.execute_approved_command(uuid,uuid)'::regprocedure))>0
                   AND position('''sales_invoice'',sales_invoice.id,sales_invoice.row_version' IN pg_catalog.pg_get_functiondef('erp_automation_commands.execute_approved_command(uuid,uuid)'::regprocedure))>0
                   AND position('''sales_return'',sales_return.id,sales_return.row_version' IN pg_catalog.pg_get_functiondef('erp_automation_commands.execute_approved_command(uuid,uuid)'::regprocedure))>0
                   AND position('''purchase_return'',purchase_return.id,purchase_return.row_version' IN pg_catalog.pg_get_functiondef('erp_automation_commands.execute_approved_command(uuid,uuid)'::regprocedure))>0 AS automation_current,
                 position('terminal_response_body' IN pg_catalog.pg_get_functiondef('erp_trade_commands.finish_claim(uuid,uuid,character varying,uuid)'::regprocedure))>0 AS trade_current,
                 position('v_purchase_order_id' IN pg_catalog.pg_get_functiondef('erp_trade_commands.post_goods_receipt(uuid,uuid,uuid,uuid,bytea,bytea,timestamptz)'::regprocedure))>0 AS goods_receipt_post_current,
                 position('supplier_invoice_lines tax_line JOIN' IN pg_catalog.pg_get_functiondef('erp_commercial_commands.post_supplier_invoice(uuid,uuid,uuid,uuid,uuid,uuid,uuid,uuid,character varying,uuid,uuid,uuid,bytea,bytea,bytea,bytea,timestamp with time zone)'::regprocedure))>0 AS commercial_supplier_post_current,
                 position('sales.invoice_lines tax_line JOIN' IN pg_catalog.pg_get_functiondef('erp_commercial_commands.post_sales_invoice(uuid,uuid,uuid,uuid,uuid,uuid,uuid,uuid,character varying,uuid,uuid,uuid,bytea,bytea,timestamp with time zone)'::regprocedure))>0
                   AND position('sales.invoice_lines invoice_product_line' IN pg_catalog.pg_get_functiondef('erp_commercial_commands.post_sales_invoice(uuid,uuid,uuid,uuid,uuid,uuid,uuid,uuid,character varying,uuid,uuid,uuid,bytea,bytea,timestamp with time zone)'::regprocedure))>0 AS commercial_sales_post_current,
                 (SELECT count(*)=2 AND pg_catalog.bool_and(position('round(' IN pg_catalog.pg_get_constraintdef(constraint_row.oid))=0)
                    FROM pg_catalog.pg_constraint AS constraint_row
                   WHERE constraint_row.conname IN ('ck_sales_returns_rounding_policy','ck_procurement_purchase_returns_rounding_policy')) AS return_rounding_current,
                 position('header.status=''posted'' THEN header.row_version-1' IN pg_catalog.pg_get_functiondef('erp_commercial_commands.assert_sales_invoice_artifact(uuid,uuid,jsonb,jsonb)'::regprocedure))>0
