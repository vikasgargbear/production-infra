      - name: Verify baseline topology and isolated role posture
        env:
          ROLE_POSTURE_QUERY: |
            SELECT role.rolname,
                   role.rolcanlogin,
                   role.rolpassword IS NOT NULL AS password_present,
                   role.rolvaliduntil IS NULL OR role.rolvaliduntil > now() AS password_unexpired,
                   pg_has_role(role.oid,'erp_app','MEMBER') AS erp_app_member
              FROM pg_catalog.pg_roles AS role
             WHERE role.rolname IN (
               'erp_runtime','erp_calculator','erp_tax_provider',
               'erp_regulatory_importer'
             )
             ORDER BY role.rolname
        run: |
          set -euo pipefail
          posture_response=$(mktemp)
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg query "$ROLE_POSTURE_QUERY" '{query:$query}')" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF/database/query/read-only" \
            >"$posture_response"
          jq -e '[.. | objects | select(.rolname?)] | length == 4' "$posture_response" >/dev/null
          jq -e '[.. | objects | select(.rolname?)] | all(
            .rolcanlogin == true and .password_present == true and .password_unexpired == true and
            ((.rolname == "erp_runtime" and .erp_app_member == true) or
             (.rolname != "erp_runtime" and .erp_app_member == false)))' \
            "$posture_response" >/dev/null
          posture=$(jq -c '[.. | objects | select(.rolname?)]' "$posture_response")
          posture=${posture//'%'/'%25'}
          posture=${posture//$'\r'/'%0D'}
          posture=${posture//$'\n'/'%0A'}
          echo "::notice title=Canonical isolated role posture::$posture"

          bans_response=$(mktemp)
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF/network-bans/retrieve" \
            >"$bans_response"
          ban_count=$(jq '.banned_ipv4_addresses | length' "$bans_response")
          echo "::notice title=Canonical staging network-ban count::$ban_count"

          python3 - <<'PY'
          import os
          import sys
          import time
          from urllib.parse import quote

          import psycopg2

          expected_roles = {
              "erp_runtime": os.environ["ERP_RUNTIME_PASSWORD"],
              "erp_calculator": os.environ["ERP_CALCULATOR_PASSWORD"],
              "erp_tax_provider": os.environ["ERP_TAX_PROVIDER_PASSWORD"],
              "erp_regulatory_importer": os.environ["ERP_REGULATORY_IMPORTER_PASSWORD"],
          }
          ref = os.environ["CANONICAL_STAGING_PROJECT_REF"]
          host = os.environ["SUPABASE_POOLER_HOST"]
          def verify_role(role, password, port):
              url = (
                  f"postgresql://{role}.{ref}:{quote(password, safe='')}"
                  f"@{host}:{port}/postgres?sslmode=require&gssencmode=disable&connect_timeout=5&application_name=canonical_staging_verify"
              )
              with psycopg2.connect(url, connect_timeout=5) as connection:
                  with connection.cursor() as cursor:
                      cursor.execute(
                          "SELECT current_user, rolsuper, rolbypassrls "
                          "FROM pg_catalog.pg_roles WHERE rolname = current_user"
                      )
                      posture = cursor.fetchone()
                      assert posture == (role, False, False), posture

          def verify_role_with_retry(role, password, port):
              last_error = None
              for attempt in range(1, 3):
                  try:
                      verify_role(role, password, port)
                      return
                  except Exception as error:
                      last_error = error
                      if attempt < 2:
                          time.sleep(5)
              raise last_error

          session_port = os.environ["SUPABASE_SESSION_POOLER_PORT"]
          transaction_port = os.environ["SUPABASE_POOLER_PORT"]
          canary_role = "erp_runtime"
          canary_password = expected_roles.pop(canary_role)
          active_port = session_port
          active_mode = "session"
          try:
              verify_role_with_retry(canary_role, canary_password, session_port)
          except Exception:
              active_port = transaction_port
              active_mode = "transaction"
              try:
                  verify_role_with_retry(canary_role, canary_password, transaction_port)
              except Exception as last_error:
                  message = str(last_error).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(
                      f"::error title=Canonical staging role verification failed::{canary_role}: {message}",
                      file=sys.stderr,
                  )
                  raise

          if active_mode == "transaction":
              admin_password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
              psycopg_url = (
                  f"postgresql://postgres.{ref}:{admin_password}@{host}:{active_port}"
                  "/postgres?sslmode=require&gssencmode=disable&connect_timeout=15&application_name=canonical_staging_ci"
              )
              sqlalchemy_url = "postgresql+psycopg2://" + psycopg_url.removeprefix(
                  "postgresql://"
              )
              print(f"::add-mask::{psycopg_url}")
              print(f"::add-mask::{sqlalchemy_url}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"PSYCOPG_DATABASE_URL={psycopg_url}\n")
                  env_file.write(f"DATABASE_URL={sqlalchemy_url}\n")
                  env_file.write(f"CANONICAL_ACTIVE_POOLER_PORT={active_port}\n")
                  env_file.write("CANONICAL_ACTIVE_POOLER_MODE=transaction\n")
              print("Transaction pooler selected after session-mode canary failed")

          for role, password in expected_roles.items():
              try:
                  verify_role_with_retry(role, password, active_port)
              except Exception as last_error:
                  message = str(last_error).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(
                      f"::error title=Canonical staging role verification failed::{role}: {message}",
                      file=sys.stderr,
                  )
                  raise
          PY

      - name: Diagnose bounded Supavisor role verification failure
        if: failure()
        run: |
          set -euo pipefail
          query=$(cat <<'SQL'
          SELECT
            countIf(positionCaseInsensitive(event_message, 'EAUTHQUERY') > 0) AS eauthquery_count,
            countIf(positionCaseInsensitive(event_message, 'ECIRCUITBREAKER') > 0) AS circuit_breaker_count,
            countIf(positionCaseInsensitive(event_message, 'worker_not_found') > 0) AS worker_not_found_count,
            countIf(positionCaseInsensitive(event_message, 'authentication') > 0) AS authentication_count,
            count(*) AS supavisor_event_count
          FROM logs
          WHERE source = 'supavisor_logs'
            AND timestamp >= now() - INTERVAL 10 MINUTE
          SQL
          )
          response=$(mktemp)
          if curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$query" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF/analytics/endpoints/logs" \
            >"$response"; then
            summary=$(jq -c '{result,error}' "$response")
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\r'/'%0D'}
            summary=${summary//$'\n'/'%0A'}
            echo "::notice title=Bounded Supavisor diagnostic::$summary"
          else
            echo "::warning title=Bounded Supavisor diagnostic unavailable::Management API log query failed"
          fi

      - name: Run canonical rollback fixtures on live free staging
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=15
          export PGOPTIONS='-c statement_timeout=120000 -c lock_timeout=15000'
          cleanup_role_membership() {
            psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
              -c 'GRANT erp_migration_owner, erp_runtime TO postgres WITH SET FALSE' \
              >/dev/null 2>&1 || true
          }
          trap cleanup_role_membership EXIT
          psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
            -c 'GRANT erp_migration_owner, erp_runtime TO postgres WITH SET TRUE' \
            >/dev/null

          fixture_count=0
          while IFS= read -r fixture; do
            if ! grep -q '^BEGIN;' "$fixture"; then
              test "$fixture" = \
                database/canonical/invariants_finance/test_finance_invariants.sql
            else
              grep -q '^ROLLBACK;' "$fixture"
            fi
            echo "running live rollback fixture: $fixture"
            fixture_log=$(mktemp)
            if ! psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
              -f "$fixture" >"$fixture_log" 2>&1; then
              cat "$fixture_log"
              python3 - "$fixture" "$fixture_log" <<'PY'
          import pathlib
          import sys

          fixture = sys.argv[1]
          detail = pathlib.Path(sys.argv[2]).read_text(errors="replace")[-3000:]
          detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Live canonical fixture failed::{fixture}: {detail}")
          PY
              exit 1
            fi
            cat "$fixture_log"
            fixture_count=$((fixture_count + 1))
          done < <(
            find database/canonical -type f \
              \( -name 'test_*.sql' -o -name 'head_test_*.sql' \) \
              | LC_ALL=C sort
          )
          test "$fixture_count" = 16

          cleanup_role_membership
          trap - EXIT
          mkdir -p staging-evidence
          jq -n \
            --argjson fixture_count "$fixture_count" \
            --arg database_engine "Supabase PostgreSQL 17" \
            '{
              fixture_count: $fixture_count,
              database_engine: $database_engine,
              mutation_boundary: "BEGIN_ROLLBACK_or_read_only",
              result: "all_canonical_sql_fixtures_passed"
            }' > staging-evidence/canonical-staging-sql-fixtures.json

