      - name: Bind live18 to one reviewed staging provider
        env:
          RAILWAY_APP_ORIGIN: ${{ vars.RAILWAY_FRONTEND_URL }}
          RAILWAY_API_ORIGIN: ${{ vars.RAILWAY_API_URL }}
          RAILWAY_MCP_ORIGIN: ${{ vars.RAILWAY_MCP_URL }}
        run: |
          set -euo pipefail
          test '${{ inputs.deploy_canonical_staging }}' = true
          test '${{ inputs.provision_canonical_demo }}' = true
          case "$LIVE18_PROVIDER" in
            render)
              test '${{ needs.canonical-free-staging.result }}' = success
              test '${{ needs.railway-canonical-staging.result }}' = skipped
              app_origin=https://aasopharma-erp-pilot.onrender.com
              api_origin=https://aasopharma-api-pilot.onrender.com
              mcp_origin=https://aasopharma-mcp-pilot.onrender.com
              ;;
            railway)
              test '${{ needs.canonical-free-staging.result }}' = skipped
              test '${{ needs.railway-canonical-staging.result }}' = success
              app_origin=$RAILWAY_APP_ORIGIN
              api_origin=$RAILWAY_API_ORIGIN
              mcp_origin=$RAILWAY_MCP_ORIGIN
              test -n "$RAILWAY_API_DEPLOYMENT_ID"
              ;;
            *) exit 2 ;;
          esac
          for origin in "$app_origin" "$api_origin" "$mcp_origin"; do
            case "$origin" in
              https://*/*|*localhost*|*127.0.0.1*|http://*|'') exit 2 ;;
            esac
          done
          metadata_urls=$(jq -cn --arg app "$app_origin" --arg api "$api_origin" --arg mcp "$mcp_origin" \
            '[$app+"/build-metadata.json",$api+"/health",$mcp+"/health"]')
          {
            echo "LIVE18_APP_ORIGIN=$app_origin"
            echo "LIVE18_API_ORIGIN=$api_origin"
            echo "LIVE18_MCP_ORIGIN=$mcp_origin"
            echo "PHARMA_CANONICAL_LIVE_API_BASE_URL=$api_origin"
            echo "PHARMA_CANONICAL_MCP_URL=$mcp_origin/mcp"
            echo "LIVE18_METADATA_URLS_JSON=$metadata_urls"
          } >> "$GITHUB_ENV"

      - name: Bind live18 to the exact reviewed deployed SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_DEPLOY_SHA"
          test "${#REVIEWED_DEPLOY_SHA}" = 40
          readiness_mode=()
          if test "$LIVE18_PROVIDER" = railway; then
            readiness_mode=(--provenance-only)
          fi
          PYTHONPATH=backend python3 backend/scripts/verify_live18_deployment_sha.py \
            --provider "$LIVE18_PROVIDER" \
            --commit-sha "$REVIEWED_DEPLOY_SHA" \
            --frontend-origin "$LIVE18_APP_ORIGIN" \
            --api-origin "$LIVE18_API_ORIGIN" \
            --mcp-origin "$LIVE18_MCP_ORIGIN" \
            "${readiness_mode[@]}" \
            > "$RUNNER_TEMP/live18-deployed-sha.json"
          echo "LIVE18_DEPLOYMENT_BOUND=true" >> "$GITHUB_ENV"
      - name: Extract and verify the same-run Render demo receipt
        if: env.LIVE18_PROVIDER == 'render'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/live18-render-baseline.zip"
          trap 'rm -f "$archive"' EXIT
          artifact_name="canonical-staging-baseline-${GITHUB_RUN_ID}"
          artifact_id=$(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              | jq -ser --arg name "$artifact_name" '
                  [.[].artifacts[] | select(.name == $name and .expired == false)]
                  | if length == 1 then .[0].id
                    else error("expected exactly one same-run staging artifact") end
                '
          )
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$archive"
          python3 - "$archive" "$LIVE18_DEMO_EVIDENCE_PATH" \
            "$LIVE18_EVIDENCE_IDENTITY_PREPARE_PATH" <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          import sys
          from zipfile import ZipFile

          archive = Path(sys.argv[1])
          with ZipFile(archive) as bundle:
              for filename, target in (
                  ("live18-render-demo-receipt.json", Path(sys.argv[2])),
                  ("canonical-evidence-storage-identity.json", Path(sys.argv[3])),
              ):
                  matches = [
                      row for row in bundle.infolist()
                      if not row.is_dir()
                      and PurePosixPath(row.filename).name == filename
                  ]
                  if len(matches) != 1 or matches[0].file_size > 65536:
                      raise SystemExit(
                          f"same-run {filename} is missing or ambiguous"
                      )
                  payload = bundle.read(matches[0])
                  descriptor = os.open(
                      target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600
                  )
                  with os.fdopen(descriptor, "wb") as handle:
                      handle.write(payload)
          PY
          PYTHONPATH=backend python3 - "$LIVE18_DEMO_EVIDENCE_PATH" \
            "$RUNNER_TEMP/live18-deployed-sha.json" <<'PY'
          from pathlib import Path
          import os
          import sys
          from scripts.build_live18_artifact_manifest import (
              _demo_summary,
              _deployment_summary,
          )

          _demo_summary(
              Path(sys.argv[1]),
              deployment=_deployment_summary(Path(sys.argv[2])),
              run_id=os.environ["GITHUB_RUN_ID"],
              run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
          )
          PY
      - name: Refuse any target except canonical disposable staging
        run: |
          set -euo pipefail
          if [ '${{ inputs.provision_canonical_demo }}' != true ]; then
            echo 'live18 requires a same-run canonical demo provision for run-scoped business lineage' >&2
            exit 2
          fi
          test "$CANONICAL_STAGING_PROJECT_REF" = rgihahbmkrmhitjdjvev
          test "$SUPABASE_URL" = https://rgihahbmkrmhitjdjvev.supabase.co
          case "$LIVE18_APP_ORIGIN|$LIVE18_API_ORIGIN|$LIVE18_MCP_ORIGIN" in
            *localhost*|*127.0.0.1*|*http://*) exit 2 ;;
          esac
      - name: Install pinned live18 dependencies
        run: |
          python3 -m pip install -r backend/requirements.txt
          python3 -m pip install psycopg2-binary==2.9.9 requests==2.34.2
          if [ "$LIVE18_PROVIDER" = railway ]; then
            npm install --global @railway/cli@5.43.4
          fi
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium ffmpeg
      - name: Register one run-scoped Railway SSH key
        if: env.LIVE18_PROVIDER == 'railway'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RAILWAY_API_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"
          test "$RAILWAY_API_SERVICE" = aasopharma-api-pilot
          railway whoami >/dev/null
          umask 077
          mkdir -p "$HOME/.ssh" "$HOME/.railway"
          chmod 700 "$HOME/.ssh" "$HOME/.railway"
          printf '%s\n' \
            'Host ssh.railway.com' \
            "    UserKnownHostsFile $HOME/.railway/known_hosts_relay" \
            '    StrictHostKeyChecking accept-new' \
            '    BatchMode yes' \
            '    IdentitiesOnly yes' \
            '    ConnectTimeout 10' \
            '    ServerAliveInterval 15' \
            '    ServerAliveCountMax 2' \
            > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh-keygen -q -t ed25519 -N '' \
            -C "live18-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f "$LIVE18_RAILWAY_SSH_PRIVATE_KEY"
          fingerprint=$(ssh-keygen -E sha256 -lf \
            "$LIVE18_RAILWAY_SSH_PRIVATE_KEY.pub" | awk '{print $2}')
          case "$fingerprint" in SHA256:*) ;; *) exit 2 ;; esac
          printf '%s\n' "$fingerprint" > "$LIVE18_RAILWAY_SSH_FINGERPRINT_PATH"
          eval "$(ssh-agent -s)"
          case "$SSH_AUTH_SOCK" in /*) ;; *) exit 2 ;; esac
          [[ "$SSH_AGENT_PID" =~ ^[1-9][0-9]*$ ]]
          {
            printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK"
            printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"
          touch "$LIVE18_RAILWAY_SSH_AGENT_STARTED_PATH"
          ssh-add "$LIVE18_RAILWAY_SSH_PRIVATE_KEY" >/dev/null
          test "$(ssh-add -l | awk 'NR==1 {print $2}')" = "$fingerprint"
          test "$(ssh-add -l | wc -l)" -eq 1
          request_nonce=$(openssl rand -hex 32)
          [[ "$request_nonce" =~ ^[0-9a-f]{64}$ ]]
          echo "LIVE18_RAILWAY_REQUEST_NONCE=$request_nonce" >> "$GITHUB_ENV"
          key_name="live18-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          railway ssh keys add \
            --key "$fingerprint" \
            --name "$key_name" >/dev/null
          touch "$LIVE18_RAILWAY_SSH_REGISTERED_PATH"
          railway ssh keys list > "$RUNNER_TEMP/live18-railway-ssh-keys.txt"
          grep -F -- "$fingerprint" "$RUNNER_TEMP/live18-railway-ssh-keys.txt" >/dev/null
          grep -F -- "$key_name" "$RUNNER_TEMP/live18-railway-ssh-keys.txt" >/dev/null
      - name: Resolve the one running instance of the exact Railway API deployment
        if: env.LIVE18_PROVIDER == 'railway'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/live18-railway-status.json"
          probe_nonce=$(openssl rand -hex 32)
          [[ "$probe_nonce" =~ ^[0-9a-f]{64}$ ]]
          ssh_ready=false
          for attempt in $(seq 1 12); do
            if curl --fail-with-body --silent --show-error --max-time 30 \
              "$LIVE18_API_ORIGIN/health" >/dev/null && \
              railway status \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "$RAILWAY_ENVIRONMENT_ID" \
                --json > "$status"; then
              instance_id=$(jq -er \
                --arg environment "$RAILWAY_ENVIRONMENT_ID" \
                --arg service "$RAILWAY_API_SERVICE" \
                --arg deployment "$RAILWAY_API_DEPLOYMENT_ID" '
                  [.environments.edges[].node
                   | select(.id == $environment)
                   | .serviceInstances.edges[].node
                   | select(.serviceName == $service)
                   | .activeDeployments[]
                   | select(.id == $deployment and .status == "SUCCESS" and .deploymentStopped == false)
                   | .instances[]
                   | select(.status == "RUNNING")
                   | .id]
                  | if length == 1 then .[0] else error("expected one exact running API instance") end
                ' "$status" 2>/dev/null || true)
              if test -n "$instance_id"; then
                probe_rc=0
                # Expansion belongs to the remote shell.
                # shellcheck disable=SC2016
                probe=$(timeout --signal=TERM 20s railway ssh \
                  --project "$RAILWAY_PROJECT_ID" \
                  --environment "$RAILWAY_ENVIRONMENT_ID" \
                  --service "$RAILWAY_API_SERVICE" \
                  --deployment-instance "$instance_id" \
                  --identity-file "$LIVE18_RAILWAY_SSH_PRIVATE_KEY" \
                  -- /bin/sh -c 'printf "%s|%s" "$1" "$RAILWAY_GIT_COMMIT_SHA"' \
                    sh "$probe_nonce" \
                  2>"$RUNNER_TEMP/live18-railway-ssh-probe.err") || probe_rc=$?
                if test "$probe" = "$probe_nonce|$REVIEWED_DEPLOY_SHA" && test "$probe_rc" -eq 0; then
                  ssh_ready=true
                  break
                fi
                if test -n "$probe"; then
                  echo 'Exact Railway API SSH probe returned unexpected provenance' >&2
                  exit 1
                fi
                case "$probe_rc" in
                  0|124|255) ;;
                  *) echo "Exact Railway API SSH probe failed with non-transport status $probe_rc" >&2; exit 1 ;;
                esac
              fi
            fi
            echo "Exact Railway API instance or run-scoped SSH key is not ready (attempt $attempt/12)" >&2
            sleep 5
          done
          if test "$ssh_ready" != true; then
            echo 'Exact Railway API instance did not become SSH-ready after 12 attempts' >&2
            exit 1
          fi
          echo "RAILWAY_API_DEPLOYMENT_INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"
          rm -f "$status"
      - name: Write compact externally reviewed scalar choices outside the repository
        env:
          LIVE18_REVIEWED_SCALARS_JSON: ${{ secrets.LIVE18_REVIEWED_SCALARS_JSON }}
          CANONICAL_DEMO_EXPENSE_RECEIPT_BASE64: ${{ secrets.CANONICAL_DEMO_EXPENSE_RECEIPT_BASE64 }}
          CANONICAL_DEMO_EXPENSE_RECEIPT_SHA256: ${{ secrets.CANONICAL_DEMO_EXPENSE_RECEIPT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$LIVE18_REVIEWED_SCALARS_JSON"
          test -n "$CANONICAL_DEMO_EXPENSE_RECEIPT_BASE64"
          [[ "$CANONICAL_DEMO_EXPENSE_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          printf '%s' "$LIVE18_REVIEWED_SCALARS_JSON" > "$LIVE18_REVIEWED_SCALARS_INPUT_PATH"
          python3 -m json.tool "$LIVE18_REVIEWED_SCALARS_INPUT_PATH" >/dev/null
          test "$(jq -r 'has("values") and (.values|type=="object") and (.values|has("expense_receipt_pdf_path")|not)' "$LIVE18_REVIEWED_SCALARS_INPUT_PATH")" = true
          printf '%s' "$CANONICAL_DEMO_EXPENSE_RECEIPT_BASE64" | base64 --decode > "$LIVE18_EXPENSE_RECEIPT_PATH"
          test -s "$LIVE18_EXPENSE_RECEIPT_PATH"
          test "$(wc -c < "$LIVE18_EXPENSE_RECEIPT_PATH")" -le 10485760
          test "$(sha256sum "$LIVE18_EXPENSE_RECEIPT_PATH" | cut -d' ' -f1)" = "$CANONICAL_DEMO_EXPENSE_RECEIPT_SHA256"
          jq --arg path "$LIVE18_EXPENSE_RECEIPT_PATH" '.values.expense_receipt_pdf_path=$path' \
            "$LIVE18_REVIEWED_SCALARS_INPUT_PATH" > "$LIVE18_REVIEWED_SCALARS_PATH"
          test "$(wc -c < "$LIVE18_REVIEWED_SCALARS_PATH")" -le 32768
          case "$LIVE18_REVIEWED_SCALARS_PATH" in "$GITHUB_WORKSPACE"/*) exit 2 ;; esac
      - name: Recover stale Railway-direct identities before demo provisioning
        if: env.LIVE18_PROVIDER == 'railway'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/live18-railway-recovery-request.json"
          response="$RUNNER_TEMP/live18-railway-recovery-response.json"
          umask 077
          python3 - "$request" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          value = {
              "schema": "aasopharma.live18.railway-database-phase.v1",
              "expected_sha": os.environ["REVIEWED_DEPLOY_SHA"],
              "project_ref": os.environ["CANONICAL_STAGING_PROJECT_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "request_nonce": os.environ["LIVE18_RAILWAY_REQUEST_NONCE"],
              "deployment_id": os.environ["RAILWAY_API_DEPLOYMENT_ID"],
              "deployment_instance_id": os.environ["RAILWAY_API_DEPLOYMENT_INSTANCE_ID"],
              "supabase_url": os.environ["SUPABASE_URL"],
              "secrets": {
                  name: os.environ[name]
                  for name in (
                      "SUPABASE_ACCESS_TOKEN",
                      "SUPABASE_DB_PASSWORD",
                      "SUPABASE_ANON_KEY",
                  )
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(value), encoding="utf-8")
          PY
          trap 'rm -f "$request" "$response"' EXIT
          # Keep this marker until the always-clean boundary succeeds. If this
          # SSH call fails, final cleanup must retry durable orphan recovery.
          touch "$LIVE18_RAILWAY_PRE_DEMO_RECOVERY_ATTEMPTED_PATH"
          railway ssh \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_API_SERVICE" \
            --deployment-instance "$RAILWAY_API_DEPLOYMENT_INSTANCE_ID" \
            --identity-file "$LIVE18_RAILWAY_SSH_PRIVATE_KEY" \
            -- python scripts/live18_railway_database_phase.py recover-identities-before-demo \
              --input - --output - \
            < "$request" > "$response"
          PYTHONPATH=backend python3 - "$response" "$request" <<'PY'
          import json
          from pathlib import Path
          import sys
          from scripts.live18_railway_database_phase import _verify_response

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          request = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          request["response"] = response
          _verify_response(request)
          if response.get("action") != "recover-identities-before-demo" or response.get("cleaned") is not True:
              raise SystemExit("Railway pre-demo identity recovery was not attested")
          reconciliation = response.get("orphan_reconciliation")
          if not isinstance(reconciliation, dict):
              raise SystemExit("Railway pre-demo orphan reconciliation was not attested")
          if any(
              reconciliation.get(key) != 0
              for key in (
                  "remaining_auth_identity_count",
                  "remaining_active_temporary_grant_count",
                  "remaining_active_mcp_grant_count",
                  "remaining_denial_role_count",
                  "remaining_active_denial_authority_count",
                  "remaining_denial_auth_binding_count",
              )
          ):
              raise SystemExit("Railway pre-demo recovery left disposable authority behind")
          recovered = reconciliation.get("recovered_auth_identity_count")
          if not isinstance(recovered, int) or isinstance(recovered, bool) or recovered < 0:
              raise SystemExit("Railway pre-demo recovery count is invalid")
          recovered_mcp = reconciliation.get("recovered_active_mcp_grant_count")
          if not isinstance(recovered_mcp, int) or isinstance(recovered_mcp, bool) or recovered_mcp < 0:
              raise SystemExit("Railway pre-demo MCP recovery count is invalid")
          PY
          rm -f "$LIVE18_RAILWAY_PRE_DEMO_RECOVERY_ATTEMPTED_PATH"
      - name: Verify exact migration head and provision same-run demo over Railway direct IPv6
        if: env.LIVE18_PROVIDER == 'railway'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ERP_REGULATORY_IMPORTER_PASSWORD: ${{ secrets.ERP_REGULATORY_IMPORTER_PASSWORD }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/live18-railway-demo-request.json"
          umask 077
          python3 - "$request" <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import sys

          receipt_path = Path(os.environ["LIVE18_EXPENSE_RECEIPT_PATH"])
          scalar_path = Path(os.environ["LIVE18_REVIEWED_SCALARS_INPUT_PATH"])
          scalar_bytes = scalar_path.read_bytes()
          if not scalar_bytes or len(scalar_bytes) > 32768:
              raise SystemExit("reviewed scalar transport is missing or oversized")
          reviewed_scalars = json.loads(scalar_bytes)
          if not isinstance(reviewed_scalars, dict):
              raise SystemExit("reviewed scalar transport must be one JSON object")
          request = {
              "schema": "aasopharma.live18.railway-database-phase.v1",
              "expected_sha": os.environ["REVIEWED_DEPLOY_SHA"],
              "project_ref": os.environ["CANONICAL_STAGING_PROJECT_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "request_nonce": os.environ["LIVE18_RAILWAY_REQUEST_NONCE"],
              "deployment_id": os.environ["RAILWAY_API_DEPLOYMENT_ID"],
              "deployment_instance_id": os.environ["RAILWAY_API_DEPLOYMENT_INSTANCE_ID"],
              "api_origin": os.environ["LIVE18_API_ORIGIN"],
              "production_project_refs": os.environ["PHARMA_CANONICAL_PRODUCTION_PROJECT_REFS"],
              "reviewed_web_auth_user_id": os.environ["CANONICAL_STAGING_WEB_TEST_AUTH_USER_ID"],
              "expense_receipt_sha256": __import__("hashlib").sha256(
                  receipt_path.read_bytes()
              ).hexdigest(),
              "expense_receipt_base64": base64.b64encode(
                  receipt_path.read_bytes()
              ).decode("ascii"),
              "reviewed_scalars": reviewed_scalars,
              "secrets": {
                  "SUPABASE_DB_PASSWORD": os.environ["SUPABASE_DB_PASSWORD"],
                  "ERP_REGULATORY_IMPORTER_PASSWORD": os.environ[
                      "ERP_REGULATORY_IMPORTER_PASSWORD"
                  ],
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(request), encoding="utf-8")
          PY
          trap 'rm -f "$request"' EXIT
          railway ssh \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_API_SERVICE" \
            --deployment-instance "$RAILWAY_API_DEPLOYMENT_INSTANCE_ID" \
            --identity-file "$LIVE18_RAILWAY_SSH_PRIVATE_KEY" \
            -- python scripts/live18_railway_database_phase.py provision-demo \
              --input - --output - \
            < "$request" > "$LIVE18_DEMO_EVIDENCE_PATH"
          PYTHONPATH=backend python3 - "$LIVE18_DEMO_EVIDENCE_PATH" "$request" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          from scripts.live18_railway_database_phase import _verify_response

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          request = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          request["response"] = response
          _verify_response(request)
          if response.get("action") != "provision-demo":
              raise SystemExit("Railway direct demo response has the wrong action")
          if response.get("transport") != "supabase_direct_ipv6_from_railway":
              raise SystemExit("Railway direct demo response has the wrong transport")
          if response.get("temporary_owner_delegation_removed") is not True:
              raise SystemExit("Railway direct demo retained temporary owner delegation")
          write_fence = response.get("write_fence")
          if not isinstance(write_fence, dict) or not (
              write_fence.get("state") == "open"
              and write_fence.get("commit_sha") == os.environ["REVIEWED_DEPLOY_SHA"]
          ):
              raise SystemExit(
                  "Railway direct demo did not open exact-SHA canonical session authority"
              )
          PY
          ready_evidence="$RUNNER_TEMP/live18-deployed-sha-ready.json"
          for attempt in $(seq 1 30); do
            if PYTHONPATH=backend python3 backend/scripts/verify_live18_deployment_sha.py \
              --provider railway \
              --commit-sha "$REVIEWED_DEPLOY_SHA" \
              --frontend-origin "$LIVE18_APP_ORIGIN" \
              --api-origin "$LIVE18_API_ORIGIN" \
              --mcp-origin "$LIVE18_MCP_ORIGIN" \
              > "$ready_evidence"; then
              mv "$ready_evidence" "$RUNNER_TEMP/live18-deployed-sha.json"
              break
            fi
            rm -f "$ready_evidence"
