name: Production readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_erp:
        description: Run credential-gated live API and Supabase write tests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  mcp-sdk-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/mcp_runtime/requirements-dev.txt
      - name: Install official MCP SDK in an isolated compatibility environment
        run: pip install -r backend/mcp_runtime/requirements-dev.txt
      - name: Verify SDK ASGI surface, dependency boundary, and read-only registry
        run: python backend/scripts/mcp_runtime_gate.py --probe-sdk
      - name: Run isolated MCP auth, grant, and transport tests without network
        run: |
          set -o pipefail
          log_file=$(mktemp)
          PYTHONPATH=backend/mcp_runtime pytest -q backend/mcp_runtime/tests 2>&1 | tee "$log_file" || {
            python - "$log_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-50000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=MCP compatibility failure::{text}")
          PY
            exit 1
          }

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Audit backend runtime dependencies
        run: |
          set -o pipefail
          log_file=$(mktemp)
          pip-audit -r backend/requirements.txt 2>&1 | tee "$log_file" || {
            python - "$log_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-50000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Backend dependency audit failure::{text}")
          PY
            exit 1
          }
      - run: PYTHONPATH=backend pytest -q backend/tests/unit
      - name: Validate the canonical topology, column catalog, and app ownership map
        run: |
          python backend/scripts/validate_canonical_model.py
          python database/canonical/domains/validate_domain_catalog.py
          python backend/scripts/check_canonical_artifacts.py
          python backend/scripts/package_canonical_baseline_migration.py
          python backend/scripts/generate_canonical_data_dictionary.py --check docs/architecture/canonical-field-dictionary.json
          python backend/scripts/audit/runtime_environment_contract.py
          python backend/scripts/audit/mcp_operator_action_contract.py
          python database/canonical/security/generate_security_contract.py --check
          python database/canonical/platform/generate_platform_contract.py --check
          python backend/scripts/audit/app_data_contract_gate.py --contract-only
          PYTHONPATH=backend pytest -q database/canonical/domains/test_domain_catalog.py
      - run: python backend/scripts/schema_readiness.py --validate-claim

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:critical
      - run: npm run test:ci -- --runInBand
      - run: CI=false npm run build
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: "true"

  frontend-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  frontend-toolchain-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Reject high or critical build and test dependency advisories
        run: |
          set -o pipefail
          log_file=$(mktemp)
          npm audit --audit-level=high 2>&1 | tee "$log_file" || {
            python - "$log_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-50000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Frontend toolchain audit failure::{text}")
          PY
            exit 1
          }

  deploy-render-pilot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-unit
      - canonical-postgres15
      - canonical-alembic-postgres15
      - frontend
      - frontend-dependency-audit
      - frontend-toolchain-dependency-audit
      - mcp-sdk-compatibility
      - production-blockers
    runs-on: ubuntu-latest
    env:
      RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      RENDER_MCP_SERVICE_ID: ${{ vars.RENDER_MCP_SERVICE_ID }}
      RENDER_FRONTEND_SERVICE_ID: ${{ vars.RENDER_FRONTEND_SERVICE_ID }}
      RENDER_API_URL: ${{ vars.RENDER_API_URL }}
      RENDER_MCP_URL: ${{ vars.RENDER_MCP_URL }}
      RENDER_FRONTEND_URL: ${{ vars.RENDER_FRONTEND_URL }}
    steps:
      - name: Refuse incomplete Render configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_API_SERVICE_ID"
          test -n "$RENDER_MCP_SERVICE_ID"
          test -n "$RENDER_FRONTEND_SERVICE_ID"
          test -n "$RENDER_API_URL"
          test -n "$RENDER_MCP_URL"
          test -n "$RENDER_FRONTEND_URL"

      - name: Deploy API and wait for readiness
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          deploy_id=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_API_SERVICE_ID/deploys" \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"$GITHUB_SHA\"}" \
            | jq -er '.id')
          for attempt in $(seq 1 60); do
            status=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_API_SERVICE_ID/deploys/$deploy_id" \
              | jq -er '.status')
            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            test "$attempt" -lt 60
            sleep 10
          done
          curl --fail --silent --show-error "$RENDER_API_URL/health" >/dev/null
          curl --fail --silent --show-error "$RENDER_API_URL/ready" >/dev/null

      - name: Deploy MCP and wait for delegated-action readiness
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          deploy_id=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_MCP_SERVICE_ID/deploys" \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"$GITHUB_SHA\"}" \
            | jq -er '.id')
          for attempt in $(seq 1 60); do
            status=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_MCP_SERVICE_ID/deploys/$deploy_id" \
              | jq -er '.status')
            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            test "$attempt" -lt 60
            sleep 10
          done
          curl --fail --silent --show-error "$RENDER_MCP_URL/health" >/dev/null
          curl --fail --silent --show-error "$RENDER_MCP_URL/ready" >/dev/null

      - name: Deploy frontend and verify the SPA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          deploy_id=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_FRONTEND_SERVICE_ID/deploys" \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"$GITHUB_SHA\"}" \
            | jq -er '.id')
          for attempt in $(seq 1 60); do
            status=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_FRONTEND_SERVICE_ID/deploys/$deploy_id" \
              | jq -er '.status')
            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            test "$attempt" -lt 60
            sleep 10
          done
          curl --fail --silent --show-error "$RENDER_FRONTEND_URL/" \
            | grep -F '<div id="root"></div>' >/dev/null

  production-blockers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require one classified canonical database migration authority
        run: python backend/scripts/schema_readiness.py --validate-authority
      - name: Require canonical topology and application ownership contracts
        if: always()
        run: |
          python backend/scripts/validate_canonical_model.py
          python backend/scripts/check_canonical_artifacts.py
          python backend/scripts/package_canonical_baseline_migration.py
          python backend/scripts/audit/app_data_contract_gate.py --contract-only
          python backend/scripts/audit/mcp_operator_action_contract.py
          python backend/scripts/audit/runtime_environment_contract.py
      - name: Require executable canonical constraints and RLS before reset baseline
        if: always()
        run: >-
          python backend/scripts/generate_canonical_baseline.py
          --enforcement-root database/canonical
      - name: Require canonical live cutover and operator promotion evidence
        if: always()
        run: python backend/scripts/audit/canonical_promotion_readiness.py
      - name: Require reviewed tax-provider operational evidence
        if: always()
        run: python backend/scripts/audit/tax_provider_operational_readiness.py
      - name: Reject placeholder critical-path integration tests
        if: always()
        run: python backend/scripts/audit/test_implementation_audit.py

  canonical-postgres15:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: canonical_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: canonical_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d canonical_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANONICAL_CI_ALLOW_DISPOSABLE: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: canonical_ci
      PGUSER: postgres
      PGPASSWORD: canonical_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify deterministic platform and security contracts
        run: |
          python database/canonical/security/generate_security_contract.py --check
          python database/canonical/platform/generate_platform_contract.py --check
      - name: Generate only a fully reviewed baseline, apply it, and run negative fixtures
        run: |
          set -o pipefail
          log_file=$(mktemp)
          bash database/canonical/ci/run_postgres15_gate.sh 2>&1 | tee "$log_file" || {
            python - "$log_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-50000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Canonical PostgreSQL 15 failure::{text}")
          PY
            exit 1
          }

  canonical-alembic-postgres15:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: canonical_alembic_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: canonical_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d canonical_alembic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANONICAL_CI_ALLOW_DISPOSABLE: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: canonical_alembic_ci
      PGUSER: postgres
      PGPASSWORD: canonical_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Apply the hash-bound Alembic baseline twice and run every fixture
        run: |
          set -o pipefail
          log_file=$(mktemp)
          bash database/canonical/ci/run_alembic_postgres15_gate.sh 2>&1 | tee "$log_file" || {
            python - "$log_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-50000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Canonical Alembic PostgreSQL 15 failure::{text}")
          PY
            exit 1
          }

  live-erp:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_erp
    runs-on: ubuntu-latest
    environment: live-erp-test
    env:
      PHARMA_LIVE_API_BASE_URL: ${{ secrets.PHARMA_LIVE_API_BASE_URL }}
      PHARMA_LIVE_DATABASE_URL: ${{ secrets.PHARMA_LIVE_DATABASE_URL }}
      PHARMA_LIVE_ACCESS_TOKEN: ${{ secrets.PHARMA_LIVE_ACCESS_TOKEN }}
      PHARMA_LIVE_TEST_ORG_ID: ${{ secrets.PHARMA_LIVE_TEST_ORG_ID }}
      PHARMA_LIVE_TEST_BRANCH_ID: ${{ secrets.PHARMA_LIVE_TEST_BRANCH_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Refuse an incompletely configured live run
        run: |
          test -n "$PHARMA_LIVE_API_BASE_URL"
          test -n "$PHARMA_LIVE_DATABASE_URL"
          test -n "$PHARMA_LIVE_ACCESS_TOKEN"
          test -n "$PHARMA_LIVE_TEST_ORG_ID"
          test -n "$PHARMA_LIVE_TEST_BRANCH_ID"
      - run: PYTHONPATH=backend pytest -q backend/tests/live_erp
