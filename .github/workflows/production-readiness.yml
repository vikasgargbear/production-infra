        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/live18-upload/live18-evidence-manifest.json"
          python3 backend/scripts/build_live18_artifact_manifest.py \
            --deployed-sha "$RUNNER_TEMP/live18-deployed-sha.json" \
            --evidence-dir "$LIVE18_EVIDENCE_DIR" \
            --database-evidence "$LIVE18_DATABASE_EVIDENCE_PATH" \
            --demo-evidence "$LIVE18_DEMO_EVIDENCE_PATH" \
            --reconciliation-evidence "$LIVE18_RECONCILIATION_EVIDENCE_PATH" \
            --operation-matrix backend/tests/live_acceptance/operation_matrix.json \
            --browser-outcome "${LIVE18_BROWSER_OUTCOME:-skipped}" \
            --screenshot-dir "$LIVE18_PLAYWRIGHT_ARTIFACT_DIR/screenshots" \
            --output "$output"
          test "$(find "$RUNNER_TEMP/live18-upload" -type f | wc -l | tr -d ' ')" = 1
      - name: Upload scrubbed allowlisted live18 evidence only
        if: always() && env.LIVE18_DEPLOYMENT_BOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-live18-acceptance-evidence
          path: ${{ runner.temp }}/live18-upload/live18-evidence-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded evidence credential cutover receipt
        if: always() && steps.evidence_credential_retirement.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-evidence-credential-cutover-${{ github.run_id }}
          path: ${{ runner.temp }}/live18-evidence-credential-retirement.json
          if-no-files-found: error
          retention-days: 30
