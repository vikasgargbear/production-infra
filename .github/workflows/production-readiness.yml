          python database/canonical/platform/generate_platform_contract.py --check
      - name: Generate only a fully reviewed baseline, apply it, and run negative fixtures
        run: |
          set -o pipefail
          log_file=$(mktemp)
          bash database/canonical/ci/run_postgres15_gate.sh 2>&1 | tee "$log_file" || {
            python - "$log_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Canonical PostgreSQL 15 failure::{text}")
          PY
            exit 1
          }

