          import json
          import os
          from pathlib import Path
          import sys

          temporary = Path(os.environ["RUNNER_TEMP"])
          def optional_json(name):
              path = temporary / name
              return json.loads(path.read_text(encoding="utf-8")) if path.is_file() else None

          value = {
              "schema": "aasopharma.live18.railway-database-phase.v1",
              "expected_sha": os.environ["REVIEWED_DEPLOY_SHA"],
              "project_ref": os.environ["CANONICAL_STAGING_PROJECT_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "request_nonce": os.environ["LIVE18_RAILWAY_REQUEST_NONCE"],
              "deployment_id": os.environ["RAILWAY_API_DEPLOYMENT_ID"],
              "deployment_instance_id": os.environ["RAILWAY_API_DEPLOYMENT_INSTANCE_ID"],
              "supabase_url": os.environ["SUPABASE_URL"],
              "browser_state": optional_json("live18-browser-identities.json"),
              "mcp_state": optional_json("live18-mcp-identities.json"),
              "secrets": {
                  name: os.environ[name]
                  for name in (
                      "SUPABASE_ACCESS_TOKEN",
                      "SUPABASE_DB_PASSWORD",
                      "SUPABASE_ANON_KEY",
                  )
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(value), encoding="utf-8")
          PY
          response="$RUNNER_TEMP/live18-railway-cleanup-response.json"
          trap 'rm -f "$request" "$response"' EXIT
          railway ssh \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_API_SERVICE" \
            --deployment-instance "$RAILWAY_API_DEPLOYMENT_INSTANCE_ID" \
            --identity-file "$LIVE18_RAILWAY_SSH_PRIVATE_KEY" \
            -- python scripts/live18_railway_database_phase.py "$cleanup_action" \
              --input - --output - \
            < "$request" > "$response"
          PYTHONPATH=backend python3 - "$response" "$request" "$cleanup_action" <<'PY'
          import json
          from pathlib import Path
          import sys
          from scripts.live18_railway_database_phase import _verify_response

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          request = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          request["response"] = response
          _verify_response(request)
          if response.get("action") != sys.argv[3] or response.get("cleaned") is not True:
              raise SystemExit("Railway identity cleanup was not attested")
          reconciliation = response.get("orphan_reconciliation")
          if not isinstance(reconciliation, dict):
              raise SystemExit("Railway orphan reconciliation was not attested")
          if any(
              reconciliation.get(key) != 0
              for key in (
                  "remaining_auth_identity_count",
                  "remaining_active_temporary_grant_count",
                  "remaining_active_mcp_grant_count",
                  "remaining_denial_role_count",
                  "remaining_active_denial_authority_count",
                  "remaining_denial_auth_binding_count",
              )
          ):
              raise SystemExit("Railway cleanup left disposable authority behind")
          recovered = reconciliation.get("recovered_auth_identity_count")
          if not isinstance(recovered, int) or isinstance(recovered, bool) or recovered < 0:
              raise SystemExit("Railway cleanup recovery count is invalid")
          recovered_mcp = reconciliation.get("recovered_active_mcp_grant_count")
          if not isinstance(recovered_mcp, int) or isinstance(recovered_mcp, bool) or recovered_mcp < 0:
              raise SystemExit("Railway MCP cleanup recovery count is invalid")
          PY
          rm -f "$LIVE18_RAILWAY_IDENTITY_ATTEMPTED_PATH" \
            "$LIVE18_RAILWAY_PRE_DEMO_RECOVERY_ATTEMPTED_PATH"
      - name: Always remove the run-scoped Railway SSH key
        if: always() && env.LIVE18_PROVIDER == 'railway'
        env:
