          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 backend/scripts/provision_ephemeral_browser_identities.py \
            provision --profile live18 \
            --state "$RUNNER_TEMP/live18-browser-identities.json"
      - name: Provision disposable identities and MCP authority over Railway direct IPv6
