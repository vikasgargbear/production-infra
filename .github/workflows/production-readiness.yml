name: Production readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_erp:
        description: Run credential-gated live API and Supabase write tests
        required: true
        default: false
        type: boolean
      run_live_erp_two_user_approvals:
        description: Run destructive disposable-org maker/checker browser approval tests
        required: true
        default: false
        type: boolean
      run_live18:
        description: Run the reviewed exact-SHA disposable 17-ready-operation UI/REST/MCP/PostgreSQL certification
        required: true
        default: false
        type: boolean
      live18_provider:
        description: Exact-SHA staging application provider to certify
        required: true
        default: railway
        type: choice
        options:
          - render
          - railway
      deploy_canonical_staging:
        description: Apply and verify the canonical baseline on the pinned free staging project
        required: true
        default: false
        type: boolean
      provision_canonical_demo:
        description: Provision and exercise the disposable free-staging demo organization
        required: true
        default: false
        type: boolean
      reset_canonical_staging:
        description: Reset canonical data on the pinned disposable free-staging project
        required: true
        default: false
        type: boolean
      restart_canonical_staging:
        description: Restart the pinned free-staging database before verification
        required: true
        default: false
        type: boolean
      rotate_canonical_staging_roles:
        description: Rotate the isolated canonical database role credentials
        required: true
        default: false
        type: boolean
      canonical_staging_deploy_sha:
        description: Reviewed application SHA for the selected staging provider
        required: false
        default: ""
        type: string
      recover_canonical_render_suspension:
        description: Explicitly adopt a reviewed pre-existing Render suspension after a failed certification run
        required: true
        default: false
        type: boolean
      capture_canonical_promotion_evidence:
        description: Capture read-only exact-SHA application promotion evidence
        required: true
        default: false
        type: boolean
      canonical_promotion_reviewed_sha:
        description: Exact deployed SHA to bind into promotion evidence
        required: false
        default: ""
        type: string
      canonical_promotion_deployment_run_id:
        description: Exact completed Production readiness run containing one reviewed deploy and Live18 artifacts
        required: false
        default: 0
        type: number
      canonical_promotion_source_disposition:
        description: Repository path to the reviewed reset disposition JSON
        required: false
        default: docs/architecture/promotion-evidence/source-disposition.template.json
        type: string
      canonical_promotion_rollback_plan:
        description: Repository path to the reviewed rollback plan JSON
        required: false
        default: docs/architecture/promotion-evidence/rollback-plan.template.json
        type: string
      canonical_promotion_decommission_plan:
        description: Repository path to the reviewed retired-project decommission plan JSON
        required: false
        default: docs/architecture/promotion-evidence/decommission-plan.template.json
        type: string
      run_conversion_preflight:
        description: Run aggregate-only read-only diagnostics against the production legacy source
        required: true
        default: false
        type: boolean
      diagnose_render_pilot:
        description: Read sanitized status and startup logs for the free Render pilot
        required: true
        default: false
        type: boolean
      deploy_render_api_hotfix:
        description: Deploy one reviewed commit to only the free Render API service
        required: true
        default: false
        type: boolean
      render_api_hotfix_sha:
        description: Reviewed application SHA for the API-only Render deployment
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  canonical-conversion-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_conversion_preflight
    uses: ./.github/workflows/canonical-conversion-preflight.yml
    secrets: inherit

  canonical-free-staging:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.deploy_canonical_staging || inputs.provision_canonical_demo ||
       inputs.reset_canonical_staging) &&
      inputs.live18_provider == 'render'
    uses: ./.github/workflows/canonical-staging.yml
    with:
      confirmation: DEPLOY_FREE_CANONICAL_STAGING
      deploy_render_pilot: ${{ inputs.deploy_canonical_staging && inputs.live18_provider == 'render' }}
      provision_demo_data: ${{ inputs.provision_canonical_demo }}
      reset_disposable_data: ${{ inputs.reset_canonical_staging }}
      restart_staging_database: ${{ inputs.restart_canonical_staging }}
      rotate_role_passwords: ${{ inputs.rotate_canonical_staging_roles }}
      render_deploy_sha: ${{ inputs.canonical_staging_deploy_sha }}
      recover_render_suspension: ${{ inputs.recover_canonical_render_suspension }}
    secrets: inherit

  railway-canonical-staging:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.deploy_canonical_staging || inputs.reset_canonical_staging) &&
      inputs.live18_provider == 'railway' &&
      vars.DEPLOY_RAILWAY_PILOT == 'true'
    uses: ./.github/workflows/railway-canonical-staging.yml
    with:
      reviewed_sha: ${{ inputs.canonical_staging_deploy_sha }}
      reset_disposable_data: ${{ inputs.reset_canonical_staging }}
      defer_write_fence_open: ${{ inputs.reset_canonical_staging && inputs.provision_canonical_demo }}
    secrets: inherit

  canonical-application-promotion-evidence:
    needs: [canonical-free-staging]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      inputs.capture_canonical_promotion_evidence &&
      (!(inputs.deploy_canonical_staging || inputs.provision_canonical_demo) ||
       needs.canonical-free-staging.result == 'success')
    uses: ./.github/workflows/canonical-application-promotion-evidence.yml
    with:
      confirmation: CAPTURE_CANONICAL_PROMOTION_EVIDENCE
      reviewed_sha: ${{ inputs.canonical_promotion_reviewed_sha }}
      deployment_workflow_run_id: ${{ inputs.canonical_promotion_deployment_run_id }}
      source_disposition: ${{ inputs.canonical_promotion_source_disposition }}
      rollback_plan: ${{ inputs.canonical_promotion_rollback_plan }}
      decommission_plan: ${{ inputs.canonical_promotion_decommission_plan }}
    secrets: inherit

  render-pilot-diagnostics:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.diagnose_render_pilot
    runs-on: ubuntu-latest
    environment: canonical-staging
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Read metadata-only deployment diagnostics
        env:
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_MCP_SERVICE_ID: ${{ vars.RENDER_MCP_SERVICE_ID }}
          RENDER_FRONTEND_SERVICE_ID: ${{ vars.RENDER_FRONTEND_SERVICE_ID }}
        run: |
          PYTHONPATH=backend python3 - <<'PY'
          import json
          import os
          from scripts.provision_render_pilot import RenderClient
          from scripts.verify_render_pilot_sha import select_latest_deploy

          client = RenderClient(os.environ["RENDER_API_KEY"])

          diagnostic_targets = (
              ("aasopharma-api-pilot", os.environ["RENDER_API_SERVICE_ID"]),
              ("aasopharma-mcp-pilot", os.environ["RENDER_MCP_SERVICE_ID"]),
              ("aasopharma-erp-pilot", os.environ["RENDER_FRONTEND_SERVICE_ID"]),
          )

          for name, service_id in diagnostic_targets:
              if not service_id:
                  raise SystemExit(f"{name}: service ID is required")
              deploy_rows = client.request(
                  "GET",
                  f"/services/{service_id}/deploys",
                  query={"limit": 20},
              )
              deploy = select_latest_deploy(deploy_rows)
              print(json.dumps({
                  "service": name,
                  "service_id": service_id,
                  "deploy": {
                      "id": deploy.get("id"),
                      "status": deploy.get("status"),
                      "commit": (deploy.get("commit") or {}).get("id"),
                      "created_at": deploy.get("createdAt"),
                      "finished_at": deploy.get("finishedAt"),
                  },
              }, sort_keys=True))
          PY

  render-api-hotfix:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_render_api_hotfix
    runs-on: ubuntu-latest
    environment: canonical-staging
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: tea-da2nh58ae00c73ciaqog
      REVIEWED_DEPLOY_SHA: ${{ inputs.render_api_hotfix_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the reviewed API-only commit
        run: |
          set -euo pipefail
          test "${#REVIEWED_DEPLOY_SHA}" = 40
          case "$REVIEWED_DEPLOY_SHA" in
            *[!0-9a-f]*) echo "Deploy SHA must be lowercase hexadecimal" >&2; exit 2 ;;
          esac
          git cat-file -e "$REVIEWED_DEPLOY_SHA^{commit}"
          git merge-base --is-ancestor "$REVIEWED_DEPLOY_SHA" "$GITHUB_SHA"
      - name: Deploy and verify only the free Render API
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          api_key = os.environ["RENDER_API_KEY"]
          owner_id = os.environ["RENDER_OWNER_ID"]
          commit_id = os.environ["REVIEWED_DEPLOY_SHA"]

          def request(method, path, payload=None, query=None, timeout=30):
              url = "https://api.render.com/v1" + path
              if query:
                  url += "?" + urlencode(query, doseq=True)
              data = None if payload is None else json.dumps(payload).encode()
              headers = {
                  "Accept": "application/json",
                  "Authorization": f"Bearer {api_key}",
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"
              with urlopen(Request(url, data=data, method=method, headers=headers), timeout=timeout) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          rows = request(
              "GET",
              "/services",
              query={
                  "ownerId": owner_id,
                  "name": "aasopharma-api-pilot",
                  "includePreviews": "false",
                  "limit": 20,
              },
          )
          matches = [row.get("service", row) for row in rows if row.get("service", row).get("name") == "aasopharma-api-pilot"]
          if len(matches) != 1:
              raise SystemExit(f"expected one API service, found {len(matches)}")
          service = matches[0]
          service_id = service["id"]
          service_url = service.get("url") or service.get("serviceDetails", {}).get("url")
          if not service_url and service.get("slug"):
              service_url = f"https://{service['slug']}.onrender.com"
          if not service_url:
              raise SystemExit("API service has no public URL")
          deploy = request(
              "POST",
              f"/services/{service_id}/deploys",
              {"clearCache": "do_not_clear", "commitId": commit_id},
          )
          deploy_id = deploy["id"]
          print(f"API deploy {deploy_id} requested for {commit_id}")
          terminal_failures = {
              "build_failed", "update_failed", "pre_deploy_failed",
              "canceled", "deactivated",
          }
          for attempt in range(1, 11):
              current = request("GET", f"/services/{service_id}/deploys/{deploy_id}")
              status = current.get("status")
              print(f"check {attempt}/10: {status}")
              if status == "live":
                  break
              if status in terminal_failures:
                  raise SystemExit(f"API deploy ended as {status}")
              if attempt == 10:
                  raise SystemExit("API deploy did not become live within 15 minutes")
              time.sleep(90)
          for path in ("/health", "/ready"):
              with urlopen(service_url.rstrip("/") + path, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f"{path} returned HTTP {response.status}")
          print("API-only deployment is live and ready")
          PY

  mcp-sdk-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/mcp_runtime/requirements-dev.txt
      - name: Install official MCP SDK in an isolated compatibility environment
        run: pip install -r backend/mcp_runtime/requirements-dev.txt
      - name: Verify SDK ASGI surface, dependency boundary, and read-only registry
        run: python backend/scripts/mcp_runtime_gate.py --probe-sdk
      - name: Run isolated MCP auth, grant, and transport tests without network
        run: |
          set -o pipefail
          log_file=$(mktemp)
          PYTHONPATH=backend/mcp_runtime pytest -q backend/mcp_runtime/tests 2>&1 | tee "$log_file" || {
            python - "$log_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=MCP compatibility failure::{text}")
          PY
            exit 1
          }

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Audit backend runtime dependencies
        run: |
          set -o pipefail
          log_file=$(mktemp)
          pip-audit -r backend/requirements.txt 2>&1 | tee "$log_file" || {
            python - "$log_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Backend dependency audit failure::{text}")
          PY
            exit 1
          }
      - name: Run backend unit tests
        run: |
          set -o pipefail
          log_file=$(mktemp)
          PYTHONPATH=backend pytest -q backend/tests/unit 2>&1 | tee "$log_file" || {
            python - "$log_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Backend unit test failure::{text}")
          PY
            exit 1
          }
      - name: Validate the canonical topology, column catalog, and app ownership map
        run: |
          python backend/scripts/validate_canonical_model.py
          python database/canonical/domains/validate_domain_catalog.py
          python backend/scripts/check_canonical_artifacts.py
          python backend/scripts/package_canonical_baseline_migration.py
          python backend/scripts/generate_canonical_data_dictionary.py --check docs/architecture/canonical-field-dictionary.json
          python backend/scripts/audit/runtime_environment_contract.py
          python backend/scripts/audit/mcp_operator_action_contract.py
          python database/canonical/security/generate_security_contract.py --check
          python database/canonical/platform/generate_platform_contract.py --check
          python backend/scripts/audit/app_data_contract_gate.py --contract-only
          PYTHONPATH=backend pytest -q database/canonical/domains/test_domain_catalog.py
      - run: python backend/scripts/schema_readiness.py --validate-claim

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:critical
      - run: npm run test:ci -- --runInBand
      - run: CI=false npm run build
      - name: Install Playwright video support
        run: npx playwright install ffmpeg
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: "true"
      - name: Upload browser traces, screenshots, videos, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  frontend-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  frontend-toolchain-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Reject high or critical build and test dependency advisories
        run: |
          set -o pipefail
          log_file=$(mktemp)
          npm audit --audit-level=high 2>&1 | tee "$log_file" || {
            python - "$log_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Frontend toolchain audit failure::{text}")
          PY
            exit 1
          }

  deploy-render-pilot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-unit
      - canonical-postgres15
      - canonical-alembic-postgres15
      - frontend
      - frontend-dependency-audit
      - frontend-toolchain-dependency-audit
      - mcp-sdk-compatibility
      - production-blockers
    runs-on: ubuntu-latest
    env:
      RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      RENDER_MCP_SERVICE_ID: ${{ vars.RENDER_MCP_SERVICE_ID }}
      RENDER_FRONTEND_SERVICE_ID: ${{ vars.RENDER_FRONTEND_SERVICE_ID }}
      RENDER_API_URL: ${{ vars.RENDER_API_URL }}
      RENDER_MCP_URL: ${{ vars.RENDER_MCP_URL }}
      RENDER_FRONTEND_URL: ${{ vars.RENDER_FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deployment control-plane validator
        run: pip install jsonschema==4.23.0

      - name: Diagnose Render configuration before mutation
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python backend/scripts/deployment_control.py preflight \
            --expected-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --require-env RENDER_API_KEY \
            --require-env RENDER_API_SERVICE_ID \
            --require-env RENDER_MCP_SERVICE_ID \
            --require-env RENDER_FRONTEND_SERVICE_ID \
            --require-env RENDER_API_URL \
            --require-env RENDER_MCP_URL \
            --require-env RENDER_FRONTEND_URL

      - name: Refuse incomplete Render configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_API_SERVICE_ID"
          test -n "$RENDER_MCP_SERVICE_ID"
          test -n "$RENDER_FRONTEND_SERVICE_ID"
          test -n "$RENDER_API_URL"
          test -n "$RENDER_MCP_URL"
          test -n "$RENDER_FRONTEND_URL"

      - name: Deploy API and wait for readiness
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          deploy_id=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_API_SERVICE_ID/deploys" \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"$GITHUB_SHA\"}" \
            | jq -er '.id')
          for attempt in $(seq 1 60); do
            status=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_API_SERVICE_ID/deploys/$deploy_id" \
              | jq -er '.status')
            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            test "$attempt" -lt 60
            sleep 10
          done
          curl --fail --silent --show-error "$RENDER_API_URL/health" >/dev/null
          curl --fail --silent --show-error "$RENDER_API_URL/ready" >/dev/null

      - name: Deploy MCP and wait for delegated-action readiness
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          deploy_id=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_MCP_SERVICE_ID/deploys" \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"$GITHUB_SHA\"}" \
            | jq -er '.id')
          for attempt in $(seq 1 60); do
            status=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_MCP_SERVICE_ID/deploys/$deploy_id" \
              | jq -er '.status')
            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            test "$attempt" -lt 60
            sleep 10
          done
          curl --fail --silent --show-error "$RENDER_MCP_URL/health" >/dev/null
          curl --fail --silent --show-error "$RENDER_MCP_URL/ready" >/dev/null

      - name: Deploy frontend and verify the SPA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          deploy_id=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_FRONTEND_SERVICE_ID/deploys" \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"$GITHUB_SHA\"}" \
            | jq -er '.id')
          for attempt in $(seq 1 60); do
            status=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_FRONTEND_SERVICE_ID/deploys/$deploy_id" \
              | jq -er '.status')
            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            test "$attempt" -lt 60
            sleep 10
          done
          curl --fail --silent --show-error "$RENDER_FRONTEND_URL/" \
            | grep -F '<div id="root"></div>' >/dev/null

  production-blockers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies for mounted-route authority analysis
        run: pip install -r backend/requirements.txt
      - name: Require one classified canonical database migration authority
        run: python backend/scripts/schema_readiness.py --validate-authority
      - name: Require canonical topology and application ownership contracts
        if: always()
        run: |
          python backend/scripts/validate_canonical_model.py
          python backend/scripts/check_canonical_artifacts.py
          python backend/scripts/package_canonical_baseline_migration.py
          python backend/scripts/audit/app_data_contract_gate.py --contract-only
          python backend/scripts/audit/mcp_operator_action_contract.py
          python backend/scripts/audit/runtime_environment_contract.py
      - name: Require complete read-only legacy conversion plan
        if: always()
        run: >-
          python backend/scripts/compile_legacy_conversion_plan.py
          --target-project-ref rgihahbmkrmhitjdjvev
          --output /tmp/canonical-conversion-plan.json
      - name: Require executable canonical constraints and RLS before reset baseline
        if: always()
        run: >-
          python backend/scripts/generate_canonical_baseline.py
          --enforcement-root database/canonical
