              echo "Railway did not become ready after canonical session authority opened" >&2
              exit 1
            fi
            sleep 2
          done
      - name: Build the masked exact erp_runtime connection
        if: env.LIVE18_PROVIDER == 'render'
        env:
          ERP_RUNTIME_PASSWORD: ${{ secrets.ERP_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          encoded_password=$(jq -nr --arg value "$ERP_RUNTIME_PASSWORD" '$value|@uri')
          runtime_url="postgresql://erp_runtime:${encoded_password}@db.${CANONICAL_STAGING_PROJECT_REF}.supabase.co:5432/postgres?sslmode=require&gssencmode=disable&connect_timeout=15&application_name=canonical_live18"
          echo "::add-mask::$runtime_url"
          echo "PHARMA_CANONICAL_LIVE_DATABASE_URL=$runtime_url" >> "$GITHUB_ENV"
          echo "LIVE18_DIRECT_DATABASE_EVIDENCE_OUTPUT_PATH=$LIVE18_DATABASE_EVIDENCE_PATH" >> "$GITHUB_ENV"
