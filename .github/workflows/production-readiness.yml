            echo "LIVE18_PLAYWRIGHT_ARTIFACT_DIR=$RUNNER_TEMP/live18-playwright"
            echo "LIVE18_DATABASE_EVIDENCE_PATH=$RUNNER_TEMP/live18-database-evidence.json"
            echo "LIVE18_RECONCILIATION_EVIDENCE_PATH=$RUNNER_TEMP/live18-reconciliation-attestation.json"
            echo "LIVE18_DEMO_EVIDENCE_PATH=$RUNNER_TEMP/live18-demo-evidence.json"
            echo "LIVE18_EVIDENCE_IDENTITY_PREPARE_PATH=$RUNNER_TEMP/live18-evidence-identity-prepare.json"
            echo "LIVE18_EVIDENCE_CREDENTIAL_RETIREMENT_PATH=$RUNNER_TEMP/live18-evidence-credential-retirement.json"
            echo "LIVE18_RAILWAY_IDENTITY_RESPONSE_PATH=$RUNNER_TEMP/live18-railway-identity-response.json"
            echo "LIVE18_AUTHORITATIVE_FACTS_PATH=$RUNNER_TEMP/live18-authoritative-facts.json"
            echo "LIVE18_RAILWAY_SSH_PRIVATE_KEY=$RUNNER_TEMP/live18-railway-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "LIVE18_RAILWAY_SSH_FINGERPRINT_PATH=$RUNNER_TEMP/live18-railway-ssh-fingerprint"
            echo "LIVE18_RAILWAY_SSH_REGISTERED_PATH=$RUNNER_TEMP/live18-railway-ssh-registered"
            echo "LIVE18_RAILWAY_SSH_AGENT_STARTED_PATH=$RUNNER_TEMP/live18-railway-ssh-agent-started"
            echo "LIVE18_RAILWAY_PRE_DEMO_RECOVERY_ATTEMPTED_PATH=$RUNNER_TEMP/live18-railway-pre-demo-recovery-attempted"
            echo "LIVE18_RAILWAY_IDENTITY_ATTEMPTED_PATH=$RUNNER_TEMP/live18-railway-identity-attempted"
