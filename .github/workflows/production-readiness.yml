          bash database/canonical/ci/run_postgres15_gate.sh 2>&1 | tee "$log_file" || {
            python - "$log_file" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
