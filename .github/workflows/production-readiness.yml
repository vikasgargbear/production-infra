            --commit-sha "$REVIEWED_DEPLOY_SHA" \
            > "$RUNNER_TEMP/live18-render-sha.json"
      - name: Refuse any target except canonical disposable staging
        run: |
          set -euo pipefail
          if [ '${{ inputs.provision_canonical_demo }}' != true ]; then
            echo 'live18 requires a same-run canonical demo provision for run-scoped business lineage' >&2
            exit 2
          fi
          test "$CANONICAL_STAGING_PROJECT_REF" = rgihahbmkrmhitjdjvev
          test "$SUPABASE_URL" = https://rgihahbmkrmhitjdjvev.supabase.co
          case "$LIVE18_APP_ORIGIN|$LIVE18_API_ORIGIN|$LIVE18_MCP_ORIGIN" in
            *localhost*|*127.0.0.1*|*http://*) exit 2 ;;
          esac
      - name: Install pinned live18 dependencies
        run: |
          python3 -m pip install -r backend/requirements.txt
          python3 -m pip install psycopg2-binary==2.9.9 requests==2.34.2
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium ffmpeg
      - name: Write compact externally reviewed scalar choices outside the repository
        env:
          LIVE18_REVIEWED_SCALARS_JSON: ${{ secrets.LIVE18_REVIEWED_SCALARS_JSON }}
        run: |
          set -euo pipefail
          test -n "$LIVE18_REVIEWED_SCALARS_JSON"
          umask 077
          printf '%s' "$LIVE18_REVIEWED_SCALARS_JSON" > "$LIVE18_REVIEWED_SCALARS_PATH"
          python3 -m json.tool "$LIVE18_REVIEWED_SCALARS_PATH" >/dev/null
          test "$(wc -c < "$LIVE18_REVIEWED_SCALARS_PATH")" -le 32768
          case "$LIVE18_REVIEWED_SCALARS_PATH" in "$GITHUB_WORKSPACE"/*) exit 2 ;; esac
      - name: Build the masked exact erp_runtime connection
        env:
          ERP_RUNTIME_PASSWORD: ${{ secrets.ERP_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          encoded_password=$(jq -nr --arg value "$ERP_RUNTIME_PASSWORD" '$value|@uri')
          runtime_url="postgresql://erp_runtime.${CANONICAL_STAGING_PROJECT_REF}:${encoded_password}@aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require&connect_timeout=15&application_name=canonical_live18"
          echo "::add-mask::$runtime_url"
          echo "PHARMA_CANONICAL_LIVE_DATABASE_URL=$runtime_url" >> "$GITHUB_ENV"
      - name: Provision disposable live18 requester, reviewer, and denial identities
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 backend/scripts/provision_ephemeral_browser_identities.py \
            provision --profile live18 \
            --state "$RUNNER_TEMP/live18-browser-identities.json"
      - name: Refuse incomplete or cross-mapped browser identities
        run: |
          set -euo pipefail
          test -n "$LIVE18_REQUESTER_EMAIL"
          test -n "$LIVE18_REVIEWER_EMAIL"
          test -n "$LIVE18_DENIAL_ACCESS_TOKEN"
          test "$LIVE18_EXPECTED_ORG_ID" != "$LIVE18_EXPECTED_DENIAL_ORG_ID"
          echo "PHARMA_CANONICAL_LIVE_TEST_ORG_ID=$LIVE18_EXPECTED_ORG_ID" >> "$GITHUB_ENV"
      - name: Provision short-lived canonical MCP authority and mapping
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 backend/scripts/provision_ephemeral_canonical_live.py provision \
            --state "$RUNNER_TEMP/live18-mcp-identities.json" \
            --browser-state "$RUNNER_TEMP/live18-browser-identities.json"
      - name: Refuse inconsistent REST, MCP, organization, or branch mapping
        run: |
          set -euo pipefail
          test "$PHARMA_CANONICAL_LIVE_TEST_BRANCH_ID" = "$LIVE18_EXPECTED_BRANCH_ID"
          test "$PHARMA_CANONICAL_LIVE_DENIAL_ORG_ID" = "$LIVE18_EXPECTED_DENIAL_ORG_ID"
      - name: Compile browser fixture from canonical facts and reviewed choices
        run: |
          set -euo pipefail
          python3 backend/scripts/compile_live18_browser_fixture.py \
            --identity-evidence "$PHARMA_CANONICAL_LIVE_FIXTURE_IDENTITY_EVIDENCE_PATH" \
            --reviewed-scalars "$LIVE18_REVIEWED_SCALARS_PATH" \
            --matrix backend/tests/live_acceptance/operation_matrix.json \
            --readiness docs/testing/live18-ui-template-readiness.json \
            --templates "$LIVE18_TEMPLATE_DIRECTORY" \
            --output "$LIVE18_FIXTURE_PATH"
          python3 -m json.tool "$LIVE18_FIXTURE_PATH" >/dev/null
          case "$LIVE18_FIXTURE_PATH" in "$GITHUB_WORKSPACE"/*) exit 2 ;; esac
      - name: Discover every template-ready Playwright operation
        working-directory: frontend
        run: |
          set -euo pipefail
          npx playwright test --config e2e/live18/playwright.config.ts --list \
            | tee "$RUNNER_TEMP/live18-playwright-list.txt"
          discovered=$(grep -c 'canonical-live18\.spec\.ts.*UI to REST readback' "$RUNNER_TEMP/live18-playwright-list.txt")
          expected=$(jq -r '.ready_count' ../docs/testing/live18-ui-template-readiness.json)
          test "$discovered" -eq "$expected"
      - name: Run the exact-SHA live18 desktop browser certification
        working-directory: frontend
        run: npx playwright test --config e2e/live18/playwright.config.ts
      - name: Reconcile every template-ready browser resource through MCP and PostgreSQL
        env:
          PHARMA_CANONICAL_LIVE_SERVICE_TOKEN: ${{ secrets.MCP_INTERNAL_SERVICE_TOKEN }}
        run: |
          set -o pipefail
          PYTHONPATH=backend pytest -q \
            backend/tests/live_acceptance/test_browser_evidence_reconciliation.py \
            | tee "$RUNNER_TEMP/live18-reconciliation.txt"
      - name: Always suspend temporary MCP authorities
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python3 backend/scripts/provision_ephemeral_canonical_live.py cleanup \
            --state "$RUNNER_TEMP/live18-mcp-identities.json"
      - name: Always restore seeded bindings and remove all three disposable identities
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python3 backend/scripts/provision_ephemeral_browser_identities.py cleanup \
            --state "$RUNNER_TEMP/live18-browser-identities.json"
      - name: Always remove external reviewed choices and compiled fixture
        if: always()
        run: rm -f "$LIVE18_FIXTURE_PATH" "$LIVE18_REVIEWED_SCALARS_PATH"
      - name: Upload live18 SHA, browser, REST, MCP, and PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-live18-acceptance-evidence
          path: |
            ${{ runner.temp }}/live18-render-sha.json
            ${{ runner.temp }}/live18-fixture-identities.json
            ${{ runner.temp }}/live18-playwright-list.txt
            ${{ runner.temp }}/live18-reconciliation.txt
            ${{ runner.temp }}/live18-evidence
            ${{ runner.temp }}/live18-playwright
          if-no-files-found: error
          retention-days: 30
