          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/live18-railway-identity-request.json"
          umask 077
          python3 - "$request" <<'PY'
          import json
          import os
          import base64
          from pathlib import Path
          import sys

          value = {
              "schema": "aasopharma.live18.railway-database-phase.v1",
              "expected_sha": os.environ["REVIEWED_DEPLOY_SHA"],
              "project_ref": os.environ["CANONICAL_STAGING_PROJECT_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "request_nonce": os.environ["LIVE18_RAILWAY_REQUEST_NONCE"],
              "deployment_id": os.environ["RAILWAY_API_DEPLOYMENT_ID"],
              "deployment_instance_id": os.environ["RAILWAY_API_DEPLOYMENT_INSTANCE_ID"],
              "transport_key_base64": base64.b64encode(os.urandom(32)).decode("ascii"),
              "supabase_url": os.environ["SUPABASE_URL"],
              "api_origin": os.environ["LIVE18_API_ORIGIN"],
              "mcp_url": os.environ["PHARMA_CANONICAL_MCP_URL"],
              "secrets": {
                  name: os.environ[name]
                  for name in (
                      "SUPABASE_ACCESS_TOKEN",
                      "SUPABASE_DB_PASSWORD",
                      "SUPABASE_ANON_KEY",
                  )
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(value), encoding="utf-8")
          PY
          trap 'rm -f "$request" "$LIVE18_RAILWAY_IDENTITY_RESPONSE_PATH"' EXIT
          touch "$LIVE18_RAILWAY_IDENTITY_ATTEMPTED_PATH"
          railway ssh \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_API_SERVICE" \
            --deployment-instance "$RAILWAY_API_DEPLOYMENT_INSTANCE_ID" \
            --identity-file "$LIVE18_RAILWAY_SSH_PRIVATE_KEY" \
            -- python scripts/live18_railway_database_phase.py provision-identities \
              --input - --output - \
            < "$request" > "$LIVE18_RAILWAY_IDENTITY_RESPONSE_PATH"
          PYTHONPATH=backend python3 - "$LIVE18_RAILWAY_IDENTITY_RESPONSE_PATH" "$request" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          from scripts.live18_railway_database_phase import _apply_identity_response

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          request = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          request["response"] = response
          values = _apply_identity_response(
              request,
              Path(os.environ["RUNNER_TEMP"]),
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              for key, value in sorted(values.items()):
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"Refusing multiline remote environment value {key}")
                  print(f"::add-mask::{value}")
                  handle.write(f"{key}={value}\n")
