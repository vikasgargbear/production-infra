        run: |
          set -euo pipefail
          cleanup_failed=0
          if [ -f "$LIVE18_RAILWAY_SSH_FINGERPRINT_PATH" ]; then
            fingerprint=$(<"$LIVE18_RAILWAY_SSH_FINGERPRINT_PATH")
            case "$fingerprint" in SHA256:*) ;; *) exit 2 ;; esac
            railway ssh keys remove "$fingerprint" >/dev/null 2>&1 || true
            ssh-add -d "$LIVE18_RAILWAY_SSH_PRIVATE_KEY" >/dev/null 2>&1 || true
            rm -f "$LIVE18_RAILWAY_SSH_PRIVATE_KEY.pub"
            key_removed=false
            absent_observations=0
            for attempt in $(seq 1 12); do
              if railway ssh keys list > "$RUNNER_TEMP/live18-railway-ssh-keys-after.txt" && \
                 ! grep -F -- "$fingerprint" "$RUNNER_TEMP/live18-railway-ssh-keys-after.txt" >/dev/null; then
                absent_observations=$((absent_observations + 1))
                if test "$absent_observations" -eq 2; then
                  key_removed=true
                  break
                fi
              else
                absent_observations=0
              fi
              echo "Waiting for Railway SSH key removal (attempt $attempt/12)" >&2
              sleep 2
            done
            if test "$key_removed" != true; then
              echo "Run-scoped Railway SSH key remained registered" >&2
              cleanup_failed=1
            fi
          fi
          if [ -f "$LIVE18_RAILWAY_SSH_AGENT_STARTED_PATH" ]; then
            ssh-add -D >/dev/null 2>&1 || true
            ssh-agent -k >/dev/null 2>&1 || cleanup_failed=1
          fi
          rm -f "$LIVE18_RAILWAY_SSH_PRIVATE_KEY" \
            "$LIVE18_RAILWAY_SSH_PRIVATE_KEY.pub" \
            "$LIVE18_RAILWAY_SSH_FINGERPRINT_PATH" \
            "$LIVE18_RAILWAY_SSH_REGISTERED_PATH" \
            "$LIVE18_RAILWAY_SSH_AGENT_STARTED_PATH" \
            "$RUNNER_TEMP/live18-railway-ssh-probe.err" \
            "$RUNNER_TEMP/live18-railway-ssh-keys-before-remove.txt" \
