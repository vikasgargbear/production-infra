name: Canonical manual acceptance authority

on:
  workflow_dispatch:
    inputs:
      action:
        description: Open or close the persistent manual-acceptance authority
        required: true
        default: open
        type: choice
        options:
          - open
          - close
      reviewed_sha:
        description: Exact deployed application SHA to bind to the authority receipt
        required: true
        type: string
      confirmation:
        description: OPEN_CANONICAL_MANUAL_ACCEPTANCE or CLOSE_CANONICAL_MANUAL_ACCEPTANCE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: canonical-staging-live-browser-identities
  cancel-in-progress: false

jobs:
  authority:
    runs-on: ubuntu-latest
    environment: canonical-staging
    timeout-minutes: 20
    env:
      CANONICAL_STAGING_PROJECT_REF: ${{ vars.CANONICAL_STAGING_PROJECT_REF }}
      CANONICAL_PRODUCTION_PROJECT_REFS: ${{ vars.CANONICAL_PRODUCTION_PROJECT_REFS }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
      RAILWAY_API_ORIGIN: https://aasopharma-api-pilot-production.up.railway.app
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      AUTHORITY_ACTION: ${{ inputs.action }}
      AUTHORITY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.reviewed_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bind the action to exact deployed disposable staging without resetting data
        run: |
          set -euo pipefail
          echo "SSH_PRIVATE_KEY=$RUNNER_TEMP/canonical-manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "SSH_FINGERPRINT_PATH=$RUNNER_TEMP/canonical-manual-ssh-fingerprint" >> "$GITHUB_ENV"
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$REVIEWED_SHA" origin/main
          test "$CANONICAL_STAGING_PROJECT_REF" = rgihahbmkrmhitjdjvev
          case ",$CANONICAL_PRODUCTION_PROJECT_REFS," in
            *",$CANONICAL_STAGING_PROJECT_REF,"*)
              echo 'Refusing to operate because staging is classified as production' >&2
              exit 2
              ;;
          esac
          expected="$(printf '%s' "$AUTHORITY_ACTION" | tr '[:lower:]' '[:upper:]')_CANONICAL_MANUAL_ACCEPTANCE"
          test "$AUTHORITY_CONFIRMATION" = "$expected"
          test "$RAILWAY_API_SERVICE" = aasopharma-api-pilot
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"
      - name: Install the pinned Railway CLI
        run: npm install --global @railway/cli@5.43.4
      - name: Register one run-scoped Railway SSH key
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RAILWAY_API_TOKEN"
          railway whoami >/dev/null
          umask 077
          mkdir -p "$HOME/.ssh" "$HOME/.railway"
          chmod 700 "$HOME/.ssh" "$HOME/.railway"
          printf '%s\n' \
            'Host ssh.railway.com' \
            "    UserKnownHostsFile $HOME/.railway/known_hosts_relay" \
            '    StrictHostKeyChecking accept-new' \
            '    BatchMode yes' \
            '    IdentitiesOnly yes' \
            '    ConnectTimeout 10' \
            '    ServerAliveInterval 15' \
            '    ServerAliveCountMax 2' \
            > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh-keygen -q -t ed25519 -N '' \
            -C "canonical-manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f "$SSH_PRIVATE_KEY"
          fingerprint=$(ssh-keygen -E sha256 -lf "$SSH_PRIVATE_KEY.pub" | awk '{print $2}')
          case "$fingerprint" in SHA256:*) ;; *) exit 2 ;; esac
          printf '%s\n' "$fingerprint" > "$SSH_FINGERPRINT_PATH"
          eval "$(ssh-agent -s)"
          {
            printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK"
            printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"
          ssh-add "$SSH_PRIVATE_KEY" >/dev/null
          key_name="canonical-manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          railway ssh keys add --key "$fingerprint" --name "$key_name" >/dev/null
          railway ssh keys list > "$RUNNER_TEMP/canonical-manual-ssh-keys.txt"
          grep -F -- "$fingerprint" "$RUNNER_TEMP/canonical-manual-ssh-keys.txt" >/dev/null
      - name: Resolve and attest the exact active API instance
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/canonical-manual-railway-status.json"
          railway status \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --json > "$status"
          instance_id=$(jq -er \
            --arg environment "$RAILWAY_ENVIRONMENT_ID" \
            --arg service "$RAILWAY_API_SERVICE" '
              [.environments.edges[].node
               | select(.id == $environment)
               | .serviceInstances.edges[].node
               | select(.serviceName == $service)
               | .activeDeployments[]
               | select(.status == "SUCCESS" and .deploymentStopped == false)
               | .instances[]
               | select(.status == "RUNNING")
               | .id]
              | if length == 1 then .[0]
                else error("expected one active Railway API instance") end
            ' "$status")
          observed_sha=$(railway ssh \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_API_SERVICE" \
            --deployment-instance "$instance_id" \
            --identity-file "$SSH_PRIVATE_KEY" \
            -- printenv RAILWAY_GIT_COMMIT_SHA)
          test "$observed_sha" = "$REVIEWED_SHA"
          echo "RAILWAY_API_DEPLOYMENT_INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"
      - name: Apply the reviewed authority state without changing ERP data
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/canonical-manual-authority-request.json"
          response="$RUNNER_TEMP/canonical-manual-authority-response.json"
          trap 'rm -f "$request" "$response"' EXIT
          umask 077
          jq -n \
            --arg action "$AUTHORITY_ACTION" \
            --arg expected_sha "$REVIEWED_SHA" \
            --arg project_ref "$CANONICAL_STAGING_PROJECT_REF" \
            --arg production_refs "$CANONICAL_PRODUCTION_PROJECT_REFS" \
            --arg password "$SUPABASE_DB_PASSWORD" \
            '{action:$action,expected_sha:$expected_sha,project_ref:$project_ref,
              production_project_refs:$production_refs,password:$password}' > "$request"
          remote_code=$(python3 - <<'PY'
          print(r'''
          import json
          import os
          import re
          import sys
          from urllib.parse import quote
          sys.path.insert(0, "/app/backend")
          from scripts.live18_railway_database_phase import _set_session_authority_state
          value = json.load(sys.stdin)
          if value["project_ref"] != "rgihahbmkrmhitjdjvev":
              raise SystemExit("manual authority target is not canonical staging")
          if value["project_ref"] in {item.strip() for item in value["production_project_refs"].split(",")}:
              raise SystemExit("refusing manual authority against production")
          if not re.fullmatch(r"[0-9a-f]{40}", value["expected_sha"]):
              raise SystemExit("reviewed SHA is invalid")
          if os.environ.get("RAILWAY_GIT_COMMIT_SHA") != value["expected_sha"]:
              raise SystemExit("active deployment differs from reviewed SHA")
          action = value["action"]
          if action not in {"open", "close"}:
              raise SystemExit("manual authority action is invalid")
          database_url = (
              "postgresql://postgres:" + quote(value["password"], safe="")
              + "@db." + value["project_ref"]
              + ".supabase.co:5432/postgres?sslmode=require&gssencmode=disable"
              + "&connect_timeout=15&application_name=canonical_manual_acceptance"
          )
          receipt = _set_session_authority_state(
              database_url,
              value["expected_sha"],
              action=action,
              expected_state=action + ("" if action != "close" else "d"),
          )
          print(json.dumps({
              "action": action,
              "commit_sha": receipt["commit_sha"],
              "state": receipt["state"],
              "runtime_inherits_erp_app": receipt["runtime_inherits_erp_app"],
              "runtime_inherits_session_authority": receipt["runtime_inherits_session_authority"],
          }, sort_keys=True))
          ''')
          PY
          )
          railway ssh \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_API_SERVICE" \
            --deployment-instance "$RAILWAY_API_DEPLOYMENT_INSTANCE_ID" \
            --identity-file "$SSH_PRIVATE_KEY" \
            -- python -c "$remote_code" < "$request" > "$response"
          expected_state=$AUTHORITY_ACTION
          test "$AUTHORITY_ACTION" != close || expected_state=closed
          test "$(jq -r .state "$response")" = "$expected_state"
          test "$(jq -r .commit_sha "$response")" = "$REVIEWED_SHA"
      - name: Verify the public readiness state
        run: |
          set -euo pipefail
          expected_status=200
          test "$AUTHORITY_ACTION" != close || expected_status=503
          ready=false
          for attempt in $(seq 1 12); do
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/canonical-manual-ready.json" \
              --write-out '%{http_code}' --max-time 30 "$RAILWAY_API_ORIGIN/ready")
            if test "$status" = "$expected_status"; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          if test "$AUTHORITY_ACTION" = open; then
            test "$(jq -r '.database.command_authority and .database.session_authority' \
              "$RUNNER_TEMP/canonical-manual-ready.json")" = true
          else
            test "$(jq -r '.database.command_authority or .database.session_authority' \
              "$RUNNER_TEMP/canonical-manual-ready.json")" = false
          fi
      - name: Always remove the run-scoped Railway SSH key
        if: always()
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          if test -s "$SSH_FINGERPRINT_PATH"; then
            fingerprint=$(<"$SSH_FINGERPRINT_PATH")
            railway ssh keys remove "$fingerprint" >/dev/null 2>&1 || true
          fi
          ssh-add -D >/dev/null 2>&1 || true
          if test -n "${SSH_AGENT_PID:-}"; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -f "$SSH_PRIVATE_KEY" "$SSH_PRIVATE_KEY.pub" "$SSH_FINGERPRINT_PATH"
