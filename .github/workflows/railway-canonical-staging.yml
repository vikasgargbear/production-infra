name: Railway canonical staging pilot

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed application SHA to upload to all Railway pilot services
        required: true
        type: string
      reset_disposable_data:
        description: Close writes and reset disposable canonical staging before the exact deployment
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      reviewed_sha:
        description: Exact application SHA to upload to all Railway pilot services
        required: true
        type: string
      reset_disposable_data:
        description: Close writes and reset disposable canonical staging before the exact deployment
        required: false
        default: false
        type: boolean
    outputs:
      api_deployment_id:
        description: Exact Railway API deployment created for the reviewed SHA
        value: ${{ jobs.deploy.outputs.api_deployment_id }}
    secrets:
      RAILWAY_API_TOKEN:
        required: true
      ERP_RUNTIME_PASSWORD:
        required: true
      ERP_CALCULATOR_PASSWORD:
        required: true
      ERP_TAX_PROVIDER_PASSWORD:
        required: true
      JWT_SECRET_KEY:
        required: true
      MCP_INTERNAL_SERVICE_TOKEN:
        required: true
      SUPABASE_ANON_KEY:
        required: true
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_DB_PASSWORD:
        required: true
      TAX_PROVIDER_INTERNAL_SERVICE_TOKEN:
        required: true
      TAX_PROVIDER_INTERNAL_HMAC_SECRET:
        required: true

permissions:
  contents: read

concurrency:
  group: railway-canonical-staging-pilot
  cancel-in-progress: false

jobs:
  deploy:
    outputs:
      api_deployment_id: ${{ steps.exact_upload.outputs.api_deployment_id }}
    runs-on: ubuntu-latest
    environment: canonical-staging
    timeout-minutes: 45
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
      RAILWAY_MCP_SERVICE: ${{ vars.RAILWAY_MCP_SERVICE }}
      RAILWAY_FRONTEND_SERVICE: ${{ vars.RAILWAY_FRONTEND_SERVICE }}
      RAILWAY_API_URL: ${{ vars.RAILWAY_API_URL }}
      RAILWAY_MCP_URL: ${{ vars.RAILWAY_MCP_URL }}
      RAILWAY_FRONTEND_URL: ${{ vars.RAILWAY_FRONTEND_URL }}
      CANONICAL_STAGING_PROJECT_REF: ${{ vars.CANONICAL_STAGING_PROJECT_REF }}
      CANONICAL_PRODUCTION_PROJECT_REFS: ${{ vars.CANONICAL_PRODUCTION_PROJECT_REFS }}
      EVIDENCE_STORAGE_EXPECTED_PROJECT_REF: ${{ vars.CANONICAL_STAGING_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_OAUTH_ISSUER: ${{ vars.SUPABASE_OAUTH_ISSUER }}
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.reviewed_sha }}

      - name: Verify the immutable source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          case "$REVIEWED_SHA" in
            *[!0-9a-f]*|'') echo "reviewed_sha must be an exact lowercase commit SHA" >&2; exit 2 ;;
          esac
          test "${#REVIEWED_SHA}" = 40

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load and diagnose the selected provider authority
        run: |
          set -euo pipefail
          python3 -m pip install jsonschema==4.23.0
          python3 backend/scripts/deployment_control.py export-github-env \
            --output "$GITHUB_ENV"

      - name: Fail closed on selected provider configuration drift
        run: |
          set -euo pipefail
          python3 backend/scripts/deployment_control.py preflight \
            --expected-sha "$REVIEWED_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --require-env CANONICAL_APPLICATION_PROVIDER \
            --require-env CANONICAL_APPLICATION_DATABASE_TRANSPORT \
            --require-env CANONICAL_STAGING_PROJECT_REF \
            --require-env SUPABASE_DIRECT_DATABASE_HOST \
            --require-env SUPABASE_DIRECT_DATABASE_PORT \
            --require-env RAILWAY_API_TOKEN \
            --require-env RAILWAY_PROJECT_ID \
            --require-env RAILWAY_ENVIRONMENT_ID \
            --require-env RAILWAY_API_SERVICE \
            --require-env RAILWAY_MCP_SERVICE \
            --require-env RAILWAY_FRONTEND_SERVICE
          python3 backend/scripts/deployment_control.py \
            assert-active-provider railway
          test "$CANONICAL_APPLICATION_DATABASE_TRANSPORT" = supabase_direct_ipv6

      - name: Install the pinned Railway CLI
        run: npm install --global @railway/cli@5.43.4

      - name: Link the reviewed Railway project
        run: |
          set -euo pipefail
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID"
          railway whoami >/dev/null

      - name: Bind the reviewed frontend origin to a live service domain
        run: |
          set -euo pipefail
          frontend_domain=${RAILWAY_FRONTEND_URL#https://}
          test "$frontend_domain" != "$RAILWAY_FRONTEND_URL"
          case "$frontend_domain" in */*|*:*|'') exit 2 ;; esac
          railway domain list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_FRONTEND_SERVICE" \
            --json > "$RUNNER_TEMP/railway-frontend-domains.json"
          jq -e --arg domain "$frontend_domain" '
            [.. | objects | .domain? // empty] | index($domain) != null
          ' "$RUNNER_TEMP/railway-frontend-domains.json" >/dev/null

      - name: Verify manifest-owned API outbound IPv6 and a clean staged boundary
        run: |
          set -euo pipefail
          jq -e '.deploy.ipv6EgressEnabled == true' \
            deploy/railway/api.railway.json >/dev/null
          jq -e '.deploy.ipv6EgressEnabled == false' \
            deploy/railway/mcp.railway.json >/dev/null
          jq -e '.deploy.ipv6EgressEnabled == false' \
            deploy/railway/frontend.railway.json >/dev/null

          railway outbound-network ipv6 status \
            --service "$RAILWAY_API_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --project "$RAILWAY_PROJECT_ID" \
            --json > api-ipv6.json
          jq -e \
            --arg service "$RAILWAY_API_SERVICE" \
            --arg environment "$RAILWAY_ENVIRONMENT_ID" \
            '.service.name == $service and
             .environment.id == $environment and
             (.service.id | type == "string" and length > 0) and
             .ipv6.enabled == true and
             .ipv6.staged == false' \
            api-ipv6.json >/dev/null

          # GraphQL variables are intentionally left for Railway, not the shell.
          # shellcheck disable=SC2016
          railway api \
            'query ExactStaged($environmentId: String!) { environmentStagedChanges(environmentId: $environmentId) { patch } }' \
            --raw-var environmentId="$RAILWAY_ENVIRONMENT_ID" \
            --compact \
            | jq -e '.data.environmentStagedChanges.patch == {}' >/dev/null || {
              echo "Railway has staged configuration outside the reviewed source manifests" >&2
              exit 1
            }

      - name: Fail closed on Railway service configuration drift
        run: |
          set -euo pipefail

          railway status --json > railway-project.json
          railway environment config \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --json \
            | jq '{services: (.services | with_entries(.value |= {source, configFile, build, deploy}))}' \
            > railway-service-config.json

          service_id() {
            local service_name=$1
            jq -er --arg name "$service_name" \
              '[.services.edges[].node | select(.name == $name) | .id] | if length == 1 then .[0] else error("expected exactly one Railway service named " + $name) end' \
              railway-project.json
          }

          service_matches() {
            local service_name=$1
            local config_file=$2
            local id
            local actual_start
            id=$(service_id "$service_name")
            jq -e \
              --arg id "$id" \
              --arg config_file "$config_file" \
              '(.services[$id].source.rootDirectory // "/") == "/" and
               .services[$id].configFile == $config_file and
               .services[$id].deploy.multiRegionConfig == {"asia-southeast1-eqsg3a":{"numReplicas":1}}' \
              railway-service-config.json >/dev/null || return 1
            actual_start=$(jq -r --arg id "$id" '.services[$id].deploy.startCommand // ""' railway-service-config.json)
            test -z "$actual_start"
          }

          if ! service_matches "$RAILWAY_API_SERVICE" /deploy/railway/api.railway.json || \
             ! service_matches "$RAILWAY_MCP_SERVICE" /deploy/railway/mcp.railway.json || \
             ! service_matches "$RAILWAY_FRONTEND_SERVICE" /deploy/railway/frontend.railway.json; then
            echo "::error title=Railway service configuration drift::All services must use repository-root context, their exact /deploy/railway/*.railway.json config file, one Singapore replica, and no dashboard start override. Correct drift separately; this workflow will not trigger an unbound intermediate deployment."
            exit 1
          fi

      - name: Close writes, quiesce sessions, and migrate the Railway reset boundary
        if: inputs.reset_disposable_data == true
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p railway-reset-evidence
          python3 -m pip install \
            psycopg2-binary==2.9.9 \
            sqlalchemy==2.0.23 \
            alembic==1.14.1 \
            httpx==0.25.2 \
            requests==2.34.2
          python3 backend/scripts/railway_canonical_reset.py prepare-reset \
            --expected-sha "$REVIEWED_SHA" \
            --project-ref "$CANONICAL_STAGING_PROJECT_REF" \
            --production-project-refs "$CANONICAL_PRODUCTION_PROJECT_REFS" \
            --receipt railway-reset-evidence/railway-reset-prepared.json
          jq -e \
            --arg sha "$REVIEWED_SHA" \
            --arg project_ref "$CANONICAL_STAGING_PROJECT_REF" \
            '.schema == "aasopharma.railway-canonical-reset.v1" and
             .action == "prepare-reset" and .provider == "railway" and
             .expected_sha == $sha and .project_ref == $project_ref and
             .write_fence.state == "closed" and
             .session_quiescence.remaining_targeted_session_count == 0 and
             (.migration.alembic_head | type) == "string" and
             (.migration.alembic_head | length) > 0 and
             .migration.auth_schema_present == true and
             .migration.storage_schema_present == true and
             .role_cleanup.migration_owner_authority_semantics == "explicit_pg_auth_members_paths" and
             .role_cleanup.postgres_migration_owner_set == false and
             .role_cleanup.postgres_migration_owner_usage == false and
             .transport.selected_ipv4_address == "verified-not-persisted"' \
            railway-reset-evidence/railway-reset-prepared.json >/dev/null

      - name: Build and mask the restricted evidence cleanup connection
        if: inputs.reset_disposable_data == true
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python3 backend/scripts/verify_staging_direct_roles.py --bootstrap-only

      - name: Provision restricted evidence cleanup authority
        if: inputs.reset_disposable_data == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test "$CANONICAL_STAGING_PROJECT_REF" = "$EVIDENCE_STORAGE_EXPECTED_PROJECT_REF"
          test "$SUPABASE_URL" = "https://${CANONICAL_STAGING_PROJECT_REF}.supabase.co"
          hook_exists=$(psql -X -Atqc \
            "SELECT to_regprocedure('erp_security.canonical_evidence_storage_access_token_hook(jsonb)') IS NOT NULL" \
            "$PSYCOPG_DATABASE_URL")
          if [ "$hook_exists" = t ]; then
            python3 backend/scripts/verify_supabase_auth_admin_secret.py \
              --project-ref "$CANONICAL_STAGING_PROJECT_REF" \
              >railway-reset-evidence/railway-auth-admin-preflight.json
            jq -e --arg project_ref "$CANONICAL_STAGING_PROJECT_REF" \
              '.state == "verified"
               and .project_ref == $project_ref
               and .modern_secret_shape_verified == true
               and .list_verified == true
               and .readback_verified == true
               and .mutation_performed == false' \
              railway-reset-evidence/railway-auth-admin-preflight.json >/dev/null
            identity_log=$(mktemp)
            if ! python3 backend/scripts/provision_canonical_evidence_storage_identity.py \
                --phase prepare \
                --project-ref "$CANONICAL_STAGING_PROJECT_REF" \
                --reviewed-sha "$REVIEWED_SHA" \
                --github-env "$GITHUB_ENV" \
                --receipt railway-reset-evidence/railway-evidence-storage-identity.json \
                >railway-reset-evidence/railway-evidence-storage-identity-summary.json \
                2>"$identity_log"; then
              python3 backend/scripts/safe_ci_log_summary.py \
                --label railway-evidence-identity "$identity_log"
              exit 1
            fi
            echo "EVIDENCE_STORAGE_IDENTITY_READY=true" >> "$GITHUB_ENV"
          elif [ "$hook_exists" = f ]; then
            object_count=$(psql -X -Atqc \
              "SELECT CASE WHEN to_regclass('storage.objects') IS NULL THEN 0 ELSE (SELECT count(*) FROM storage.objects WHERE bucket_id='canonical-evidence-private-v1') END" \
              "$PSYCOPG_DATABASE_URL")
            if [ "$object_count" != 0 ]; then
              echo "Evidence exists but the restricted cleanup hook is unavailable" >&2
              exit 1
            fi
            echo "EVIDENCE_STORAGE_IDENTITY_READY=false" >> "$GITHUB_ENV"
          else
            echo "Could not classify the evidence cleanup hook" >&2
            exit 1
          fi

      - name: Reconcile and remove evidence through the restricted Storage API
        if: inputs.reset_disposable_data == true
        run: |
          set -euo pipefail
          cleanup_log=$(mktemp)
          if ! PYTHONPATH=backend python3 backend/scripts/cleanup_staging_evidence_storage.py \
              --project-ref "$CANONICAL_STAGING_PROJECT_REF" \
              --database-url-env PSYCOPG_DATABASE_URL \
              --receipt railway-reset-evidence/railway-evidence-storage-cleanup.json \
              >"$cleanup_log" 2>&1; then
            python3 backend/scripts/safe_ci_log_summary.py \
              --label railway-evidence-cleanup "$cleanup_log"
            exit 1
          fi
          jq -e --arg project_ref "$CANONICAL_STAGING_PROJECT_REF" \
            '.contract_version == "canonical-evidence-reset-cleanup-v2"
             and .state == "empty"
             and .project_ref == $project_ref
             and .bucket == "canonical-evidence-private-v1"
             and .remaining_object_count == 0
             and .deleted_object_count == .reconciled_object_count
             and .legal_hold_count == 0
             and .evidence_writer_membership_open == false
             and .evidence_writer_role_posture_safe == true
             and .evidence_writer_unexpected_member_count == 0
             and .evidence_writer_inherited_role_count == 0
             and ((.evidence_writer_role_installed == true
                   and .evidence_writer_role_absence_verified == false)
                  or (.evidence_writer_role_installed == false
                      and .evidence_writer_role_absence_verified == true))
             and (.observed_authenticator_session_count | type) == "number"
             and .observed_authenticator_session_count >= 0
             and (.terminated_authenticator_session_count | type) == "number"
             and .terminated_authenticator_session_count >= 0
             and .terminated_authenticator_session_count <= .observed_authenticator_session_count
             and .remaining_preclosure_authenticator_session_count == 0
             and (.evidence_writer_closed_at | type) == "string"
             and (.retention_in_force_deleted_count | type) == "number"
             and .retention_in_force_deleted_count >= 0' \
            railway-reset-evidence/railway-evidence-storage-cleanup.json >/dev/null

      - name: Reset disposable Railway data against the cleaned exact head
        if: inputs.reset_disposable_data == true
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          expected_head=$(python3 backend/scripts/canonical_migration_contract.py --print-head)
          python3 backend/scripts/railway_canonical_reset.py reset \
            --expected-sha "$REVIEWED_SHA" \
            --project-ref "$CANONICAL_STAGING_PROJECT_REF" \
            --production-project-refs "$CANONICAL_PRODUCTION_PROJECT_REFS" \
            --evidence-cleanup-receipt railway-reset-evidence/railway-evidence-storage-cleanup.json \
            --receipt railway-canonical-reset.json
          jq -e \
            --arg sha "$REVIEWED_SHA" \
            --arg project_ref "$CANONICAL_STAGING_PROJECT_REF" \
            --arg expected_head "$expected_head" \
            '.schema == "aasopharma.railway-canonical-reset.v1" and
             .action == "reset" and .provider == "railway" and
             .expected_sha == $sha and .project_ref == $project_ref and
             .write_fence.state == "closed" and
             .post_reset_fence_state == "closed" and
             .evidence_cleanup.contract_version == "canonical-evidence-reset-cleanup-v2" and
             .evidence_cleanup.state == "empty" and
             .evidence_cleanup.remaining_object_count == 0 and
             (.evidence_cleanup.receipt_sha256 | test("^[0-9a-f]{64}$")) and
             .session_quiescence.remaining_targeted_session_count == 0 and
             .reset.alembic_head == $expected_head and
             .reset.disposable_row_count_after_reset == 0 and
             .reset.evidence_storage_object_count_after_reset == 0 and
             .role_cleanup.migration_owner_authority_semantics == "explicit_pg_auth_members_paths" and
             .role_cleanup.postgres_migration_owner_set == false and
             .role_cleanup.postgres_migration_owner_usage == false and
             .transport.selected_ipv4_address == "verified-not-persisted"' \
            railway-canonical-reset.json >/dev/null

      - name: Reconcile the reviewed staging MCP OAuth client authority
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CANONICAL_DEMO_EVIDENCE_DIR: ${{ runner.temp }}/railway-oauth-evidence
        run: |
          set -euo pipefail
          python3 -m pip install \
            psycopg2-binary==2.9.9 \
            requests==2.34.2
          python3 backend/scripts/provision_staging_mcp_oauth.py \
            --mode client-authority-only

      - name: Populate canonical service variables without triggering stale deploys
        env:
          ERP_RUNTIME_PASSWORD: ${{ secrets.ERP_RUNTIME_PASSWORD }}
          ERP_CALCULATOR_PASSWORD: ${{ secrets.ERP_CALCULATOR_PASSWORD }}
          ERP_TAX_PROVIDER_PASSWORD: ${{ secrets.ERP_TAX_PROVIDER_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          MCP_INTERNAL_SERVICE_TOKEN: ${{ secrets.MCP_INTERNAL_SERVICE_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TAX_PROVIDER_INTERNAL_SERVICE_TOKEN: ${{ secrets.TAX_PROVIDER_INTERNAL_SERVICE_TOKEN }}
          TAX_PROVIDER_INTERNAL_HMAC_SECRET: ${{ secrets.TAX_PROVIDER_INTERNAL_HMAC_SECRET }}
        run: |
          set -euo pipefail

          test -n "$MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS"
          test "$MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS" != disabled-unissued-canonical-staging
          case "$MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS" in
            *','*|*[[:space:]]*)
              echo "OAuth authority must resolve to exactly one reviewed client ID" >&2
              exit 2
              ;;
          esac
          oauth_evidence="$RUNNER_TEMP/railway-oauth-evidence/canonical-staging-oauth-client.json"
          jq -e \
            --arg sha "$REVIEWED_SHA" \
            --arg project_ref "$CANONICAL_STAGING_PROJECT_REF" \
            --arg client_id "$MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS" \
            '.reviewed_sha == $sha and
             .project_ref == $project_ref and
             .client_id == $client_id and
             .client_type == "public" and
             .token_endpoint_auth_method == "none" and
             .dynamic_client_registration == false and
             .provisioning_mode == "client-authority-only" and
             .test_identity_reconciled == false and
             .demo_grant_bound == false and
             .web_test_grant_bound == false' \
            "$oauth_evidence" >/dev/null
          oauth_evidence_sha256=$(sha256sum "$oauth_evidence" | cut -d' ' -f1)
          test "${#oauth_evidence_sha256}" = 64
          echo "RAILWAY_OAUTH_EVIDENCE_SHA256=$oauth_evidence_sha256" >> "$GITHUB_ENV"

          set_variable() {
            local service=$1
            local key=$2
            local value=$3
            test -n "$value"
            printf '%s' "$value" | railway variable set \
              --service "$service" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --skip-deploys \
              --stdin "$key" >/dev/null
          }

          encode() { jq -nr --arg value "$1" '$value|@uri'; }
          test "$SUPABASE_DIRECT_DATABASE_HOST" = "db.${CANONICAL_STAGING_PROJECT_REF}.supabase.co"
          runtime_url="postgresql://erp_runtime:$(encode "$ERP_RUNTIME_PASSWORD")@${SUPABASE_DIRECT_DATABASE_HOST}:5432/postgres?sslmode=require&gssencmode=disable&connect_timeout=15&application_name=aasopharma_api_railway"
          calculator_url="postgresql://erp_calculator:$(encode "$ERP_CALCULATOR_PASSWORD")@${SUPABASE_DIRECT_DATABASE_HOST}:5432/postgres?sslmode=require&gssencmode=disable&connect_timeout=15&application_name=aasopharma_calculator_railway"
          provider_url="postgresql://erp_tax_provider:$(encode "$ERP_TAX_PROVIDER_PASSWORD")@${SUPABASE_DIRECT_DATABASE_HOST}:5432/postgres?sslmode=require&gssencmode=disable&connect_timeout=15&application_name=aasopharma_tax_provider_railway"
          echo "::add-mask::$runtime_url"
          echo "::add-mask::$calculator_url"
          echo "::add-mask::$provider_url"

          set_variable "$RAILWAY_API_SERVICE" APP_ENV production
          set_variable "$RAILWAY_API_SERVICE" LOG_LEVEL INFO
          set_variable "$RAILWAY_API_SERVICE" LOG_FORMAT json
          set_variable "$RAILWAY_API_SERVICE" DATABASE_URL "$runtime_url"
          set_variable "$RAILWAY_API_SERVICE" ERP_CALCULATOR_DATABASE_URL "$calculator_url"
          set_variable "$RAILWAY_API_SERVICE" TAX_PROVIDER_DATABASE_URL "$provider_url"
          set_variable "$RAILWAY_API_SERVICE" DATABASE_TRANSPORT_REQUIREMENT "$CANONICAL_APPLICATION_DATABASE_TRANSPORT"
          set_variable "$RAILWAY_API_SERVICE" DATABASE_POOL_SIZE 3
          set_variable "$RAILWAY_API_SERVICE" DATABASE_MAX_OVERFLOW 1
          set_variable "$RAILWAY_API_SERVICE" TAX_PROVIDER_INTERNAL_SERVICE_TOKEN "$TAX_PROVIDER_INTERNAL_SERVICE_TOKEN"
          set_variable "$RAILWAY_API_SERVICE" TAX_PROVIDER_INTERNAL_HMAC_SECRET "$TAX_PROVIDER_INTERNAL_HMAC_SECRET"
          set_variable "$RAILWAY_API_SERVICE" JWT_SECRET_KEY "$JWT_SECRET_KEY"
          set_variable "$RAILWAY_API_SERVICE" CORS_ORIGINS "$RAILWAY_FRONTEND_URL"
          set_variable "$RAILWAY_API_SERVICE" APP_URL "$RAILWAY_FRONTEND_URL"
          set_variable "$RAILWAY_API_SERVICE" SUPABASE_URL "$SUPABASE_URL"
          set_variable "$RAILWAY_API_SERVICE" SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          set_variable "$RAILWAY_API_SERVICE" MCP_INTERNAL_SERVICE_TOKEN "$MCP_INTERNAL_SERVICE_TOKEN"
          set_variable "$RAILWAY_API_SERVICE" MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS "$MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS"
          set_variable "$RAILWAY_API_SERVICE" RAILWAY_GIT_COMMIT_SHA "$REVIEWED_SHA"

          # Evidence storage remains scoped to its separately reviewed service
          # identity. The application provider never receives that credential.
          set_variable "$RAILWAY_API_SERVICE" EVIDENCE_STORAGE_ENABLED false

          set_variable "$RAILWAY_MCP_SERVICE" SUPABASE_OAUTH_ISSUER "$SUPABASE_OAUTH_ISSUER"
          set_variable "$RAILWAY_MCP_SERVICE" MCP_RESOURCE_SERVER_URL "$RAILWAY_MCP_URL/mcp"
          set_variable "$RAILWAY_MCP_SERVICE" ERP_API_BASE_URL "$RAILWAY_API_URL"
          set_variable "$RAILWAY_MCP_SERVICE" MCP_INTERNAL_SERVICE_TOKEN "$MCP_INTERNAL_SERVICE_TOKEN"
          set_variable "$RAILWAY_MCP_SERVICE" MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS "$MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS"
          set_variable "$RAILWAY_MCP_SERVICE" MCP_ALLOWED_ORIGINS "$RAILWAY_FRONTEND_URL"
          set_variable "$RAILWAY_MCP_SERVICE" RAILWAY_GIT_COMMIT_SHA "$REVIEWED_SHA"

          set_variable "$RAILWAY_FRONTEND_SERVICE" REACT_APP_API_BASE_URL "$RAILWAY_API_URL"
          set_variable "$RAILWAY_FRONTEND_SERVICE" REACT_APP_SUPABASE_URL "$SUPABASE_URL"
          set_variable "$RAILWAY_FRONTEND_SERVICE" REACT_APP_SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          set_variable "$RAILWAY_FRONTEND_SERVICE" RAILWAY_GIT_COMMIT_SHA "$REVIEWED_SHA"

      - name: Force-upload the exact source tree to all three Railway services
        id: exact_upload
        env:
          DEPLOYMENT_NONCE: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # Railway watch paths compare changed archive paths. These provenance-only
          # markers make an unchanged reviewed commit uploadable without modifying
          # product code or falling back to an older Railway deployment.
          printf '%s\n' "$REVIEWED_SHA:$DEPLOYMENT_NONCE" > deploy/railway/api.force-deploy
          printf '%s\n' "$REVIEWED_SHA:$DEPLOYMENT_NONCE" > deploy/railway/mcp.force-deploy
          printf '%s\n' "$REVIEWED_SHA:$DEPLOYMENT_NONCE" > deploy/railway/frontend.force-deploy

          structured_upload_error() {
            jq -ser '
              def safe_code:
                if . == "UPLOAD_FAILED" or
                   . == "RATELIMITED" or
                   . == "FETCH_ERROR" or
                   . == "UNAUTHORIZED" or
                   . == "INVALID_TOKEN" or
                   . == "GRAPHQL_ERROR"
                then . else "UNCLASSIFIED" end;
              if length == 1 and
                 (.[0] | type) == "object" and
                 (.[0].code | type) == "string"
              then
                [(.[0].code | safe_code),
                 (if .[0].code == "UPLOAD_FAILED" and (.[0].error | type) == "string"
                  then ([.[0].error | capture("^Failed to upload code with status code (?<status>[0-9]{3})( .*)?$"; "i")] | if length == 1 then .[0].status else "NONE" end)
                  else "NONE" end)] | @tsv
              else "NONE\tNONE"
              end' "$1" 2>/dev/null || printf '%s\n' $'NONE\tNONE'
          }

          upload_failure_kind() {
            local stdout_file=$1
            local stderr_file=$2
            local provider_code
            local http_status
            if ! test -s "$stdout_file" && ! test -s "$stderr_file"; then
              printf '%s\n' empty_cli_response
              return 0
            fi
            IFS=$'\t' read -r provider_code http_status < <(structured_upload_error "$stdout_file")
            if test "$provider_code" = RATELIMITED || test "$http_status" = 429 || [[ "$http_status" =~ ^5[0-9]{2}$ ]]; then
              printf '%s\n' transient_transport
              return 0
            fi
            printf '%s\n' non_retryable
          }

          deployment_id_from_payload() {
            jq -ser '
              if length == 1 and
                 (.[0] | type) == "object" and
                 (.[0].deploymentId | type) == "string" and
                 (.[0].deploymentId | test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"))
              then .[0].deploymentId
              else error("expected exactly one Railway deployment UUID document")
              end' "$1"
          }

          report_upload_failure() {
            local label=$1
            local attempt=$2
            local exit_code=$3
            local failure_kind=$4
            local stdout_file=$5
            local stderr_file=$6
            local stdout_bytes
            local stderr_bytes
            local stdout_sha256
            local stderr_sha256
            local stdout_shape
            local provider_code
            local http_status
            stdout_bytes=$(wc -c < "$stdout_file" | tr -d ' ')
            stderr_bytes=$(wc -c < "$stderr_file" | tr -d ' ')
            stdout_sha256=$(sha256sum "$stdout_file" | cut -d' ' -f1)
            stderr_sha256=$(sha256sum "$stderr_file" | cut -d' ' -f1)
            IFS=$'\t' read -r provider_code http_status < <(structured_upload_error "$stdout_file")
            stdout_shape=$(jq -src '
              if length == 1 then
                {documents:1,type:(.[0]|type),deployment_id_present:(if (.[0]|type)=="object" then (.[0]|has("deploymentId")) else false end)}
              else
                {documents:length,type:"multiple_or_empty",deployment_id_present:false}
              end' "$stdout_file" 2>/dev/null || printf '%s' '{"documents":0,"type":"invalid_json","deployment_id_present":false}')
            echo "::error title=Railway source upload failed::service=$label attempt=$attempt exit_code=$exit_code kind=$failure_kind provider_code=$provider_code http_status=$http_status stdout_bytes=$stdout_bytes stdout_sha256=$stdout_sha256 stdout_shape=$stdout_shape stderr_bytes=$stderr_bytes stderr_sha256=$stderr_sha256"
          }

          recover_accepted_upload() {
            local label=$1
            local service=$2
            local message=$3
            local attempt=$4
            local recovered_stdout=$5
            local list_stdout="${label}-deploy.recovery-${attempt}.json"
            local list_stderr="${label}-deploy.recovery-${attempt}.log"
            local list_exit
            local match_count
            local deployment_id
            local recovery_attempt
            for recovery_attempt in $(seq 1 6); do
              list_stdout="${label}-deploy.recovery-${attempt}-${recovery_attempt}.json"
              list_stderr="${label}-deploy.recovery-${attempt}-${recovery_attempt}.log"
              if railway deployment list \
                --service "$service" \
                --environment "$RAILWAY_ENVIRONMENT_ID" \
                --limit 100 \
                --json >"$list_stdout" 2>"$list_stderr"; then
                list_exit=0
              else
                list_exit=$?
                report_upload_failure "$label" "$attempt" "$list_exit" recovery_query_failed "$list_stdout" "$list_stderr"
                return 2
              fi
              if ! jq -se 'length == 1 and (.[0] | type) == "array"' "$list_stdout" >/dev/null; then
                report_upload_failure "$label" "$attempt" "$list_exit" invalid_recovery_payload "$list_stdout" "$list_stderr"
                return 2
              fi
              match_count=$(jq -sr --arg message "$message" '[.[0][] | select(.meta.cliMessage == $message)] | length' "$list_stdout")
              case "$match_count" in
                0)
                  if test "$recovery_attempt" -lt 6; then
                    sleep 5
                    continue
                  fi
                  return 1
                  ;;
                1)
                  deployment_id=$(jq -ser --arg message "$message" '
                    [.[0][] | select(.meta.cliMessage == $message)] | .[0].id |
                    select(type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"))' \
                    "$list_stdout") || {
                      report_upload_failure "$label" "$attempt" "$list_exit" invalid_recovered_deployment_id "$list_stdout" "$list_stderr"
                      return 2
                    }
                  jq -n --arg deployment_id "$deployment_id" '{deploymentId:$deployment_id}' > "$recovered_stdout"
                  return 0
                  ;;
                *)
                  report_upload_failure "$label" "$attempt" "$list_exit" ambiguous_recovered_deployments "$list_stdout" "$list_stderr"
                  return 2
                  ;;
              esac
            done
            return 2
          }

          upload_service() {
            local label=$1
            local service=$2
            local attempt=1
            local max_attempts=2
            local stdout_file
            local stderr_file
            local exit_code
            local failure_kind
            local recovery_status
            local message="canonical staging $REVIEWED_SHA $DEPLOYMENT_NONCE $label"
            printf '%s\n' "$message" > "${label}-deployment-message"
            while test "$attempt" -le "$max_attempts"; do
              stdout_file="${label}-deploy.attempt-${attempt}.json"
              stderr_file="${label}-deploy.attempt-${attempt}.log"
              if railway up --detach --json \
                --service "$service" \
                --environment "$RAILWAY_ENVIRONMENT_ID" \
                --project "$RAILWAY_PROJECT_ID" \
                --message "$message" \
                >"$stdout_file" 2>"$stderr_file"; then
                if deployment_id_from_payload "$stdout_file" >/dev/null 2>&1; then
                  mv "$stdout_file" "${label}-deploy.json"
                  mv "$stderr_file" "${label}-deploy.log"
                  echo "Railway source upload accepted: service=$label attempt=$attempt"
                  return 0
                fi
                exit_code=0
                failure_kind=invalid_success_payload
              else
                exit_code=$?
                failure_kind=$(upload_failure_kind "$stdout_file" "$stderr_file")
              fi

              report_upload_failure "$label" "$attempt" "$exit_code" "$failure_kind" "$stdout_file" "$stderr_file"
              if test "$failure_kind" != transient_transport && test "$failure_kind" != empty_cli_response; then
                return 1
              fi
              if recover_accepted_upload "$label" "$service" "$message" "$attempt" "$stdout_file"; then
                mv "$stdout_file" "${label}-deploy.json"
                mv "$stderr_file" "${label}-deploy.log"
                echo "Railway source upload recovered: service=$label attempt=$attempt"
                return 0
              else
                recovery_status=$?
              fi
              if test "$recovery_status" != 1; then
                return 1
              fi
              if test "$attempt" -eq "$max_attempts"; then
                return 1
              fi
              sleep "$((attempt * 2))"
              attempt=$((attempt + 1))
            done
            return 1
          }

          # The Railway CLI builds an archive in the shared working directory.
          # Serialize uploads so concurrent clients cannot race over that state.
          upload_service api "$RAILWAY_API_SERVICE"
          upload_service mcp "$RAILWAY_MCP_SERVICE"
          upload_service frontend "$RAILWAY_FRONTEND_SERVICE"

          deployment_id_from_payload api-deploy.json > api-deployment-id
          deployment_id_from_payload mcp-deploy.json > mcp-deployment-id
          deployment_id_from_payload frontend-deploy.json > frontend-deployment-id
          echo "api_deployment_id=$(<api-deployment-id)" >> "$GITHUB_OUTPUT"

      - name: Require each exact upload to become the active deployment
        run: |
          set -euo pipefail

          deployment_status() {
            local service=$1
            local deployment_id=$2
            railway deployment list \
              --service "$service" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --limit 100 \
              --json \
              | jq -er --arg id "$deployment_id" \
                  '[.[] | select(.id == $id) | .status] | if length == 1 then .[0] else "NOT_FOUND" end'
          }

          require_deployment_contract() {
            local service=$1
            local deployment_id=$2
            local config_file=$3
            local dockerfile=$4
            local healthcheck=$5
            local expected_start=$6
            local expected_message=$7
            local expected_ipv6=$8
            railway deployment list \
              --service "$service" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --limit 100 \
              --json \
              | jq -e \
                  --arg id "$deployment_id" \
                  --arg config_file "$config_file" \
                  --arg dockerfile "$dockerfile" \
                  --arg healthcheck "$healthcheck" \
                  --arg expected_start "$expected_start" \
                  --arg message "$expected_message" \
                  --argjson expected_ipv6 "$expected_ipv6" \
                  '[.[] | select(.id == $id)] |
                   length == 1 and
                   ((.[0].meta.rootDirectory // "/") == "/") and
                   (.[0].meta.configFile == $config_file) and
                   (.[0].meta.cliMessage == $message) and
                   (.[0].meta.fileServiceManifest.build.builder == "DOCKERFILE") and
                   (.[0].meta.fileServiceManifest.build.dockerfilePath == $dockerfile) and
                   ((.[0].meta.fileServiceManifest.deploy.startCommand // "") == $expected_start) and
                   (.[0].meta.fileServiceManifest.deploy.multiRegionConfig == {"asia-southeast1-eqsg3a":{"numReplicas":1}}) and
                   (.[0].meta.fileServiceManifest.deploy.sleepApplication == true) and
                   (.[0].meta.serviceManifest.build.builder == "DOCKERFILE") and
                   (.[0].meta.serviceManifest.build.dockerfilePath == $dockerfile) and
                   ((.[0].meta.serviceManifest.deploy.startCommand // "") == $expected_start) and
                   (.[0].meta.serviceManifest.deploy.healthcheckPath == $healthcheck) and
                   (.[0].meta.serviceManifest.deploy.ipv6EgressEnabled == $expected_ipv6) and
                   (.[0].meta.serviceManifest.deploy.multiRegionConfig == {"asia-southeast1-eqsg3a":{"numReplicas":1}}) and
                   (.[0].meta.serviceManifest.deploy.sleepApplication == true)' >/dev/null
          }

          api_deployment_id=$(<api-deployment-id)
          mcp_deployment_id=$(<mcp-deployment-id)
          frontend_deployment_id=$(<frontend-deployment-id)
          api_deployment_message=$(<api-deployment-message)
          mcp_deployment_message=$(<mcp-deployment-message)
          frontend_deployment_message=$(<frontend-deployment-message)

          for attempt in $(seq 1 90); do
            api_status=$(deployment_status "$RAILWAY_API_SERVICE" "$api_deployment_id")
            mcp_status=$(deployment_status "$RAILWAY_MCP_SERVICE" "$mcp_deployment_id")
            frontend_status=$(deployment_status "$RAILWAY_FRONTEND_SERVICE" "$frontend_deployment_id")

            if test "$api_status" = SUCCESS && test "$mcp_status" = SUCCESS && test "$frontend_status" = SUCCESS; then
              break
            fi

            for service_status in "$api_status" "$mcp_status" "$frontend_status"; do
              case "$service_status" in
                FAILED|CRASHED|SKIPPED|REMOVED|REMOVING|CANCELLED)
                  echo "An exact Railway upload reached terminal failure state: $service_status" >&2
                  exit 1
                  ;;
              esac
            done

            if test "$attempt" = 90; then
              echo "Exact Railway uploads did not reach SUCCESS before timeout" >&2
              exit 1
            fi
            echo "Waiting for exact Railway uploads (attempt $attempt/90)"
            sleep 10
          done

          mcp_start_command=$(jq -er '.deploy.startCommand | strings | select(length > 0)' deploy/railway/mcp.railway.json)
          require_deployment_contract "$RAILWAY_API_SERVICE" "$api_deployment_id" /deploy/railway/api.railway.json /deploy/railway/api.Dockerfile /ready "" "$api_deployment_message" true
          require_deployment_contract "$RAILWAY_MCP_SERVICE" "$mcp_deployment_id" /deploy/railway/mcp.railway.json /deploy/railway/mcp.Dockerfile /health "$mcp_start_command" "$mcp_deployment_message" false
          require_deployment_contract "$RAILWAY_FRONTEND_SERVICE" "$frontend_deployment_id" /deploy/railway/frontend.railway.json /frontend/Dockerfile /health "" "$frontend_deployment_message" false

      - name: Prove exact Railway authority before reopening reset fence
        if: inputs.reset_disposable_data == true
        run: |
          set -euo pipefail
          python3 backend/scripts/deployment_control.py status \
            --expected-sha "$REVIEWED_SHA" \
            --fence closed

      - name: Verify exact API database isolation before reopening writes
        if: inputs.reset_disposable_data == true
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 15 \
            "$RAILWAY_API_URL/ready" > api-ready-before-fence-open.json
          jq -e '.status == "ready" and
                 .database.transport == "supabase_direct" and
                 .database.principal == "erp_runtime" and
                 .database.principal_isolated == true and
                 .database.migration_owner_member == false and
                 .database.row_security == true and
                 .database.ip_version == 6' \
            api-ready-before-fence-open.json >/dev/null

      - name: Open writes after exact Railway provenance proof
        if: inputs.reset_disposable_data == true
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 backend/scripts/railway_canonical_reset.py open-fence \
            --expected-sha "$REVIEWED_SHA" \
            --project-ref "$CANONICAL_STAGING_PROJECT_REF" \
            --production-project-refs "$CANONICAL_PRODUCTION_PROJECT_REFS" \
            --receipt railway-canonical-fence-open.json
          jq -e \
            --arg sha "$REVIEWED_SHA" \
            --arg project_ref "$CANONICAL_STAGING_PROJECT_REF" \
            '.schema == "aasopharma.railway-canonical-reset.v1" and
             .action == "open-fence" and .provider == "railway" and
             .expected_sha == $sha and .project_ref == $project_ref and
             .write_fence.state == "open" and
             .role_cleanup.migration_owner_authority_semantics == "explicit_pg_auth_members_paths" and
             .role_cleanup.postgres_migration_owner_set == false and
             .role_cleanup.postgres_migration_owner_usage == false and
             .transport.selected_ipv4_address == "verified-not-persisted"' \
            railway-canonical-fence-open.json >/dev/null

      - name: Verify all public services publish the reviewed SHA
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            fetch() {
              curl --fail-with-body --silent --show-error --max-time 15 "$1" > "$2" 2>/dev/null || :
            }
            fetch "$RAILWAY_API_URL/health" api-health.json &
            fetch "$RAILWAY_API_URL/ready" api-ready.json &
            fetch "$RAILWAY_MCP_URL/health" mcp-health.json &
            fetch "$RAILWAY_MCP_URL/ready" mcp-ready.json &
            fetch "$RAILWAY_FRONTEND_URL/health" frontend-health.txt &
            fetch "$RAILWAY_FRONTEND_URL/build-metadata.json" frontend-metadata.json &
            wait

            api_health=$(<api-health.json)
            api_ready=$(<api-ready.json)
            mcp_health=$(<mcp-health.json)
            mcp_ready=$(<mcp-ready.json)
            frontend_health=$(<frontend-health.txt)
            frontend_metadata=$(<frontend-metadata.json)
            if jq -e --arg sha "$REVIEWED_SHA" '.status == "healthy" and .git_commit == $sha' <<<"$api_health" >/dev/null 2>&1 && \
               jq -e '.status == "ready" and .database.transport == "supabase_direct" and .database.principal == "erp_runtime" and .database.principal_isolated == true and .database.migration_owner_member == false and .database.row_security == true and .database.ip_version == 6' <<<"$api_ready" >/dev/null 2>&1 && \
               jq -e --arg sha "$REVIEWED_SHA" '.status == "ok" and .git_commit == $sha' <<<"$mcp_health" >/dev/null 2>&1 && \
               jq -e '.status == "ready"' <<<"$mcp_ready" >/dev/null 2>&1 && \
               test "$frontend_health" = ok && \
               jq -e --arg sha "$REVIEWED_SHA" '.service == "aasopharma-erp" and .git_commit == $sha' <<<"$frontend_metadata" >/dev/null 2>&1; then
              oauth_client_id=$(jq -er '.client_id | select(type == "string" and length > 0)' "$RUNNER_TEMP/railway-oauth-evidence/canonical-staging-oauth-client.json")
              jq -n \
                --arg git_commit "$REVIEWED_SHA" \
                --arg oauth_client_id "$oauth_client_id" \
                --arg oauth_evidence_sha256 "$RAILWAY_OAUTH_EVIDENCE_SHA256" \
                --arg api_deployment_id "$(<api-deployment-id)" \
                --arg mcp_deployment_id "$(<mcp-deployment-id)" \
                --arg frontend_deployment_id "$(<frontend-deployment-id)" \
                --arg api_url "$RAILWAY_API_URL" \
                --arg mcp_url "$RAILWAY_MCP_URL" \
                --arg frontend_url "$RAILWAY_FRONTEND_URL" \
                '{provider:"railway",git_commit:$git_commit,status:"live",oauth:{client_id:$oauth_client_id,client_type:"public",dynamic_registration:false,evidence_sha256:$oauth_evidence_sha256},services:{api:{url:$api_url,deployment_id:$api_deployment_id,health:"healthy",readiness:"ready"},mcp:{url:$mcp_url,deployment_id:$mcp_deployment_id,health:"ok",readiness:"ready"},frontend:{url:$frontend_url,deployment_id:$frontend_deployment_id,health:"ok"}}}' \
                > railway-pilot-evidence.json
              exit 0
            fi
            echo "Waiting for Railway services to publish $REVIEWED_SHA (attempt $attempt/60)"
            sleep 10
          done
          railway deployment list --service "$RAILWAY_API_SERVICE" --environment "$RAILWAY_ENVIRONMENT_ID" --limit 3 --json || true
          railway deployment list --service "$RAILWAY_MCP_SERVICE" --environment "$RAILWAY_ENVIRONMENT_ID" --limit 3 --json || true
          railway deployment list --service "$RAILWAY_FRONTEND_SERVICE" --environment "$RAILWAY_ENVIRONMENT_ID" --limit 3 --json || true
          echo "Railway services did not converge on reviewed SHA $REVIEWED_SHA" >&2
          exit 1

      - name: Prove selected provider authority and inactive standbys
        run: |
          set -euo pipefail
          python3 backend/scripts/deployment_control.py status \
            --expected-sha "$REVIEWED_SHA" \
            --fence open

      - name: Reconcile the exact Railway frontend OAuth redirect
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 backend/scripts/reconcile_supabase_auth_redirect.py \
            --provider railway \
            --project-ref "$CANONICAL_STAGING_PROJECT_REF" \
            --frontend-origin "$RAILWAY_FRONTEND_URL" \
            --reviewed-sha "$REVIEWED_SHA" \
            > railway-supabase-auth-redirect.json

      - uses: actions/upload-artifact@v4
        with:
          name: railway-canonical-staging-${{ inputs.reviewed_sha }}
          path: |
            railway-pilot-evidence.json
            railway-supabase-auth-redirect.json
            railway-canonical-reset.json
            railway-canonical-fence-open.json
            railway-reset-evidence/*.json
            ${{ runner.temp }}/railway-oauth-evidence/canonical-staging-oauth-client.json
          if-no-files-found: error
          retention-days: 14

      - name: Re-close writes after any certification failure
        if: failure() && inputs.reset_disposable_data == true
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 backend/scripts/railway_canonical_reset.py close-fence \
            --expected-sha "$REVIEWED_SHA" \
            --project-ref "$CANONICAL_STAGING_PROJECT_REF" \
            --production-project-refs "$CANONICAL_PRODUCTION_PROJECT_REFS" \
            --receipt railway-canonical-fence-reclosed.json
