name: Railway persistent pilot in-place migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_PERSISTENT_PILOT_IN_PLACE
        required: true
        type: string
      reviewed_sha:
        description: Exact reviewed 40-character commit to migrate to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: railway-persistent-pilot-in-place-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: canonical-staging
    timeout-minutes: 20
    env:
      CANONICAL_STAGING_PROJECT_REF: ${{ vars.CANONICAL_STAGING_PROJECT_REF }}
      CANONICAL_PRODUCTION_PROJECT_REFS: ${{ vars.CANONICAL_PRODUCTION_PROJECT_REFS }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      PGOPTIONS: >-
        -c statement_timeout=120000
        -c lock_timeout=15000
        -c idle_in_transaction_session_timeout=180000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Pin the exact persistent pilot boundary
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = MIGRATE_PERSISTENT_PILOT_IN_PLACE
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$CANONICAL_STAGING_PROJECT_REF" = rgihahbmkrmhitjdjvev
          test "$CANONICAL_STAGING_PROJECT_REF" != jfrairkkzxwkhbtqejnz
          test -n "$CANONICAL_PRODUCTION_PROJECT_REFS"
          case ",$CANONICAL_PRODUCTION_PROJECT_REFS," in
            *",$CANONICAL_STAGING_PROJECT_REF,"*)
              echo "persistent pilot appears in the production project denylist" >&2
              exit 2
              ;;
          esac
          project_json=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$CANONICAL_STAGING_PROJECT_REF")
          test "$(jq -r .id <<<"$project_json")" = "$CANONICAL_STAGING_PROJECT_REF"
          test "$(jq -r .status <<<"$project_json")" = ACTIVE_HEALTHY

      - name: Install migration and PostgreSQL clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          pip install -r backend/requirements.txt

      - name: Build and mask the pilot bootstrap connection
        run: python3 backend/scripts/verify_staging_direct_roles.py --bootstrap-only

      - name: Preflight the reviewed linear migration
        run: |
          set -euo pipefail
          expected_head=$(python3 backend/scripts/canonical_migration_contract.py --print-head)
          current_revision=$(psql -X -Atqc \
            'SELECT version_num FROM public.alembic_version' \
            "$PSYCOPG_DATABASE_URL")
          python3 backend/scripts/canonical_migration_contract.py \
            --validate-current "$current_revision" >/dev/null
          test -n "$expected_head"
          {
            echo "EXPECTED_ALEMBIC_HEAD=$expected_head"
            echo "PREFLIGHT_ALEMBIC_REVISION=$current_revision"
          } >> "$GITHUB_ENV"

      - name: Capture the pre-migration schema boundary
        run: |
          set -euo pipefail
          mkdir -p pilot-migration-evidence
          pg_dump --schema-only --no-owner --no-privileges \
            --schema erp_automation_reads \
            --schema erp_master_commands \
            "$PSYCOPG_DATABASE_URL" \
            > pilot-migration-evidence/pre-migration-functions.sql
          psql -X -Atq "$PSYCOPG_DATABASE_URL" \
            -c 'SELECT version_num FROM public.alembic_version' \
            > pilot-migration-evidence/pre-migration-alembic-version.txt
          test -s pilot-migration-evidence/pre-migration-functions.sql
          test -s pilot-migration-evidence/pre-migration-alembic-version.txt

      - name: Migrate the persistent pilot in place
        run: |
          set -euo pipefail
          cleanup_migration_membership() {
            bash backend/scripts/revoke_staging_postgres_set_roles.sh migration-owner
          }
          cleanup_migration_on_exit() {
            prior_status=$?
            trap - EXIT
            if ! cleanup_migration_membership; then
              echo "temporary migration-owner delegation cleanup failed" >&2
              exit 1
            fi
            exit "$prior_status"
          }
          trap cleanup_migration_on_exit EXIT
          psql -X -v ON_ERROR_STOP=1 "$PSYCOPG_DATABASE_URL" \
            -c 'GRANT erp_migration_owner TO postgres WITH SET TRUE, INHERIT FALSE' \
            >/dev/null
          (
            cd backend
            alembic -c alembic.ini upgrade head
            alembic -c alembic.ini upgrade head
          )
          cleanup_migration_membership
          trap - EXIT

      - name: Verify exact revision and runtime function authority
        run: |
          set -euo pipefail
          test "$(psql -X -Atqc \
            'SELECT version_num FROM public.alembic_version' \
            "$PSYCOPG_DATABASE_URL")" = "$EXPECTED_ALEMBIC_HEAD"
          authority_state=$(psql -X -Atq "$PSYCOPG_DATABASE_URL" <<'SQL'
          SELECT concat_ws('|',
            to_regprocedure(
              'erp_automation_reads.sales_invoice_product_identity(uuid,uuid)'
            ) IS NOT NULL,
            to_regprocedure(
              'erp_master_commands.create_customer(uuid,text,text,text,text,text,text,text,text,text,text,text,text,numeric,integer,bytea,timestamptz)'
            ) IS NOT NULL,
            to_regprocedure(
              'erp_master_commands.create_supplier(uuid,text,text,text,text,text,text,text,text,text,text,text,integer,bytea,timestamptz)'
            ) IS NOT NULL,
            has_function_privilege(
              'erp_runtime',
              'erp_automation_reads.sales_invoice_product_identity(uuid,uuid)',
              'EXECUTE'
            ),
            (
              SELECT owner_role.rolname = 'erp_migration_owner'
                 AND NOT EXISTS (
                   SELECT 1
                     FROM pg_catalog.aclexplode(function_definition.proacl) acl
                    WHERE acl.grantee = 0
                      AND acl.privilege_type = 'EXECUTE'
                 )
                FROM pg_catalog.pg_proc function_definition
                JOIN pg_catalog.pg_roles owner_role
                  ON owner_role.oid = function_definition.proowner
               WHERE function_definition.oid = to_regprocedure(
                 'erp_automation_reads.sales_invoice_product_identity(uuid,uuid)'
               )
            )
          );
          SQL
          )
          test "$authority_state" = 'true|true|true|true|true'
          jq -n \
            --arg reviewed_sha "$REVIEWED_SHA" \
            --arg from_revision "$PREFLIGHT_ALEMBIC_REVISION" \
            --arg to_revision "$EXPECTED_ALEMBIC_HEAD" \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{contract_version:"persistent-pilot-in-place-migration-v1",
              state:"verified", reviewed_sha:$reviewed_sha,
              from_revision:$from_revision, to_revision:$to_revision,
              completed_at:$completed_at, data_reset:false,
              fixtures_loaded:false}' \
            > pilot-migration-evidence/migration-receipt.json

      - name: Upload bounded migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: persistent-pilot-migration-${{ inputs.reviewed_sha }}
          path: pilot-migration-evidence/
          if-no-files-found: error
          retention-days: 14
