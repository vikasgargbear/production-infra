name: Railway persistent pilot in-place migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_PERSISTENT_PILOT_IN_PLACE
        required: true
        type: string
      reviewed_sha:
        description: Exact reviewed 40-character commit to migrate and deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: railway-persistent-pilot-in-place-migration
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          fetch-depth: 0
      - name: Pin the exact reviewed source
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = MIGRATE_PERSISTENT_PILOT_IN_PLACE
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"

  migrate-and-deploy:
    needs: authorize
    uses: ./.github/workflows/railway-canonical-staging.yml
    with:
      reviewed_sha: ${{ inputs.reviewed_sha }}
      purge_organization_id: ""
      purge_organization_confirmation: ""
      purge_organization_plan_token: ""
      github_environment: canonical-staging
      open_persistent_pilot_after_deploy: true
    secrets: inherit
