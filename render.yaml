services:
  - type: web
    name: aasopharma-api-pilot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        sync: false
      - key: ERP_CALCULATOR_DATABASE_URL
        sync: false
      - key: TAX_PROVIDER_DATABASE_URL
        sync: false
      - key: TAX_PROVIDER_INTERNAL_SERVICE_TOKEN
        sync: false
      - key: TAX_PROVIDER_INTERNAL_HMAC_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: EVIDENCE_STORAGE_EXPECTED_PROJECT_REF
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: EVIDENCE_STORAGE_ENABLED
        sync: false
      - key: EVIDENCE_STORAGE_SERVER_JWT
        sync: false
      - key: MCP_INTERNAL_SERVICE_TOKEN
        sync: false
      - key: MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: aasopharma-mcp-pilot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/mcp_runtime/Dockerfile
    dockerContext: ./backend/mcp_runtime
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: SUPABASE_OAUTH_ISSUER
        sync: false
      - key: MCP_RESOURCE_SERVER_URL
        sync: false
      - key: ERP_API_BASE_URL
        sync: false
      - key: MCP_INTERNAL_SERVICE_TOKEN
        sync: false
      - key: MCP_OAUTH_PRE_REGISTERED_CLIENT_IDS
        sync: false
      - key: MCP_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: aasopharma-erp-pilot
    runtime: static
    buildCommand: cd frontend && npm ci && npm run typecheck && npm run lint:critical && npm run test:ci -- --runInBand && CI=false npm run build
    staticPublishPath: ./frontend/build
    autoDeployTrigger: "off"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: REACT_APP_API_BASE_URL
        sync: false
      - key: REACT_APP_SUPABASE_URL
        sync: false
      - key: REACT_APP_SUPABASE_ANON_KEY
        sync: false
