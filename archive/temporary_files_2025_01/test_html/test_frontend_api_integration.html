<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend API Integration Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        pre { background-color: #f8f9fa; padding: 10px; overflow-x: auto; }
        .loading { color: #007bff; }
    </style>
</head>
<body>
    <h1>Frontend API Integration Test</h1>
    <p>Testing InvoiceCalculatorEnterprise integration with backend API</p>

    <div class="test-section">
        <h3>Test 1: Basic API Call</h3>
        <button onclick="testBasicAPI()">Test Basic Calculation API</button>
        <div id="test1-result"></div>
    </div>

    <div class="test-section">
        <h3>Test 2: Complex Free Items Scenario</h3>
        <button onclick="testFreeItemsAPI()">Test Free Items Calculation</button>
        <div id="test2-result"></div>
    </div>

    <div class="test-section">
        <h3>Test 3: Multiple Items with Discounts</h3>
        <button onclick="testMultipleItemsAPI()">Test Multiple Items</button>
        <div id="test3-result"></div>
    </div>

    <div class="test-section">
        <h3>Test 4: Frontend Service Integration</h3>
        <button onclick="testFrontendService()">Test InvoiceCalculatorEnterprise</button>
        <div id="test4-result"></div>
    </div>

    <script>
        // Simulated InvoiceCalculatorEnterprise service
        class InvoiceCalculatorEnterprise {
            static async calculateInvoice(invoiceData) {
                try {
                    const response = await fetch('https://pharma-backend-production-0c09.up.railway.app/api/invoices/calculate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(invoiceData)
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const result = await response.json();
                    
                    if (!result.success) {
                        throw new Error('Calculation failed on backend');
                    }
                    
                    return result;
                } catch (error) {
                    console.error('Invoice calculation API error:', error);
                    throw new Error(`Calculation failed: ${error.message}`);
                }
            }

            static extractTotals(calculationResult) {
                if (!calculationResult || !calculationResult.totals) {
                    return {
                        subtotal: 0,
                        totalDiscount: 0,
                        taxableAmount: 0,
                        gstAmount: 0,
                        cgstAmount: 0,
                        sgstAmount: 0,
                        igstAmount: 0,
                        netAmount: 0,
                        roundOff: 0,
                        finalAmount: 0
                    };
                }
                
                const { totals } = calculationResult;
                
                return {
                    subtotal: totals.gross_amount,
                    totalDiscount: totals.total_discount,
                    taxableAmount: totals.taxable_amount,
                    gstAmount: totals.total_tax,
                    cgstAmount: totals.cgst_amount,
                    sgstAmount: totals.sgst_amount,
                    igstAmount: totals.igst_amount,
                    netAmount: totals.net_amount,
                    roundOff: totals.round_off,
                    finalAmount: totals.final_amount
                };
            }

            static formatCurrency(amount) {
                return new Intl.NumberFormat('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(amount || 0);
            }
        }

        function updateResult(elementId, status, message, data = null) {
            const element = document.getElementById(elementId);
            element.className = `test-section ${status}`;
            element.innerHTML = `
                <strong>${status.toUpperCase()}:</strong> ${message}
                ${data ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : ''}
            `;
        }

        function showLoading(elementId) {
            const element = document.getElementById(elementId);
            element.className = 'test-section';
            element.innerHTML = '<div class="loading">⏳ Testing...</div>';
        }

        async function testBasicAPI() {
            showLoading('test1-result');
            
            try {
                const invoiceData = {
                    items: [{
                        product_id: 1,
                        quantity: 5,
                        base_quantity: 5,
                        free_quantity: 0,
                        unit_price: 100,
                        discount_percent: 0,
                        gst_percent: 18
                    }],
                    gst_type: 'CGST/SGST',
                    delivery_charges: 0,
                    discount_amount: 0
                };

                const result = await InvoiceCalculatorEnterprise.calculateInvoice(invoiceData);
                const totals = InvoiceCalculatorEnterprise.extractTotals(result);
                
                // Expected: 5 × 100 = 500 + 18% GST = 590
                const expected = 590;
                const actual = totals.finalAmount;
                
                if (Math.abs(actual - expected) < 0.01) {
                    updateResult('test1-result', 'success', `✅ Basic API test passed! Expected: ₹${expected}, Got: ₹${actual}`, {
                        api_response: result,
                        extracted_totals: totals
                    });
                } else {
                    updateResult('test1-result', 'error', `❌ Basic API test failed! Expected: ₹${expected}, Got: ₹${actual}`, result);
                }
                
            } catch (error) {
                updateResult('test1-result', 'error', `❌ API Error: ${error.message}`);
            }
        }

        async function testFreeItemsAPI() {
            showLoading('test2-result');
            
            try {
                const invoiceData = {
                    items: [{
                        product_id: 1,
                        quantity: 12,           // Total delivered
                        base_quantity: 1,       // Only 1 billable
                        free_quantity: 11,      // 11 free items
                        unit_price: 100,
                        discount_percent: 0,
                        gst_percent: 18
                    }],
                    gst_type: 'CGST/SGST',
                    delivery_charges: 0,
                    discount_amount: 0
                };

                const result = await InvoiceCalculatorEnterprise.calculateInvoice(invoiceData);
                const totals = InvoiceCalculatorEnterprise.extractTotals(result);
                
                // Expected: 1 × 100 = 100 + 18% GST = 118
                const expected = 118;
                const actual = totals.finalAmount;
                
                if (Math.abs(actual - expected) < 0.01) {
                    updateResult('test2-result', 'success', `✅ Free items test passed! Only charged for base_quantity (1 item, not 12). Expected: ₹${expected}, Got: ₹${actual}`, {
                        api_response: result,
                        extracted_totals: totals
                    });
                } else {
                    updateResult('test2-result', 'error', `❌ Free items test failed! Expected: ₹${expected}, Got: ₹${actual}`, result);
                }
                
            } catch (error) {
                updateResult('test2-result', 'error', `❌ API Error: ${error.message}`);
            }
        }

        async function testMultipleItemsAPI() {
            showLoading('test3-result');
            
            try {
                const invoiceData = {
                    items: [
                        {
                            product_id: 1,
                            quantity: 10,
                            base_quantity: 8,      // 8 billable, 2 free
                            free_quantity: 2,
                            unit_price: 50,
                            discount_percent: 5,    // 5% discount
                            gst_percent: 18
                        },
                        {
                            product_id: 2,
                            quantity: 5,
                            base_quantity: 5,      // All billable
                            free_quantity: 0,
                            unit_price: 200,
                            discount_percent: 0,    // No discount
                            gst_percent: 12
                        }
                    ],
                    gst_type: 'CGST/SGST',
                    delivery_charges: 0,
                    discount_amount: 0
                };

                const result = await InvoiceCalculatorEnterprise.calculateInvoice(invoiceData);
                const totals = InvoiceCalculatorEnterprise.extractTotals(result);
                
                // Expected calculation:
                // Item 1: 8×50 = 400, discount = 20, taxable = 380, tax = 68.40, total = 448.40
                // Item 2: 5×200 = 1000, discount = 0, taxable = 1000, tax = 120, total = 1120
                // Grand total = 448.40 + 1120 = 1568.40
                const expected = 1568.40;
                const actual = totals.finalAmount;
                
                if (Math.abs(actual - expected) < 0.01) {
                    updateResult('test3-result', 'success', `✅ Multiple items test passed! Expected: ₹${expected}, Got: ₹${actual}`, {
                        api_response: result,
                        extracted_totals: totals
                    });
                } else {
                    updateResult('test3-result', 'error', `❌ Multiple items test failed! Expected: ₹${expected}, Got: ₹${actual}`, result);
                }
                
            } catch (error) {
                updateResult('test3-result', 'error', `❌ API Error: ${error.message}`);
            }
        }

        async function testFrontendService() {
            showLoading('test4-result');
            
            try {
                // Test that our service properly extracts and formats data
                const invoiceData = {
                    items: [{
                        product_id: 1,
                        quantity: 3,
                        base_quantity: 1,
                        free_quantity: 2,
                        unit_price: 100,
                        discount_percent: 10,
                        gst_percent: 18
                    }],
                    gst_type: 'CGST/SGST'
                };

                const result = await InvoiceCalculatorEnterprise.calculateInvoice(invoiceData);
                const totals = InvoiceCalculatorEnterprise.extractTotals(result);
                const formatted = InvoiceCalculatorEnterprise.formatCurrency(totals.finalAmount);
                
                // Test all service methods work
                updateResult('test4-result', 'success', `✅ Frontend service integration test passed!`, {
                    service_methods_tested: {
                        calculateInvoice: 'Working ✅',
                        extractTotals: 'Working ✅',
                        formatCurrency: `Working ✅ (${formatted})`
                    },
                    api_result: result,
                    extracted_totals: totals,
                    formatted_amount: formatted
                });
                
            } catch (error) {
                updateResult('test4-result', 'error', `❌ Frontend Service Error: ${error.message}`);
            }
        }

        // Run basic test on page load
        window.onload = function() {
            console.log('Frontend API Integration Test Page Loaded');
            console.log('InvoiceCalculatorEnterprise service ready for testing');
        };
    </script>
</body>
</html>
