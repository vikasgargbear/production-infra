schema_version: 1
snapshot_date: "2026-08-19"
canonical_repository: vikasgargbear/production-infra
authority:
  application_registry: backend/app/api/services/document_number_service.py
  sequence_table: public.document_number_sequences
  checked_schema_root: database
  live_schema_reviewed: false
  policy: No table merge, drop, or new DDL is authorized by this inventory.

document_number_types:
  retain_baselined:
    - {type: invoice, owner: sales, target: sales.invoices.invoice_number}
    - {type: sales_order, owner: sales, target: sales.orders.order_number}
    - {type: delivery_challan, owner: sales, target: sales.delivery_challans.challan_number}
    - {type: sales_return, owner: sales_returns, target: sales.sales_returns.return_number}
    - {type: purchase_order, owner: procurement, target: procurement.purchase_orders.po_number}
    - {type: grn, owner: procurement, target: procurement.goods_receipt_notes.grn_number}
    - {type: supplier_invoice, owner: procurement, target: procurement.supplier_invoices.supplier_invoice_number}
    - {type: purchase_return, owner: purchase_returns, target: procurement.purchase_returns.return_number}
    - {type: payment, owner: finance, target: financial.payments.payment_number}
    - {type: receipt, owner: finance, target: financial.payments.payment_number, discriminator: payment_type=receipt}
    - {type: credit_note, owner: finance, target: financial.credit_notes.credit_note_number}
    - {type: debit_note, owner: finance, target: financial.debit_notes.debit_note_number}
    - {type: journal_entry, owner: finance, target: financial.journal_entries.journal_number}
    - {type: expense_claim, owner: finance, target: financial.expense_claims.claim_number}
    - {type: adjustment, owner: inventory, target: inventory.inventory_movements.reference_number}
    - {type: stock_receipt, owner: inventory, target: inventory.inventory_movements.reference_number}
    - {type: stock_issue, owner: inventory, target: inventory.inventory_movements.reference_number}
    - {type: stock_transfer, owner: inventory, target: inventory.inventory_movements.reference_number}
    - {type: product, owner: master_inventory, target: inventory.products.product_code}
    - {type: batch, owner: master_inventory, target: inventory.batches.batch_number}
    - {type: supplier, owner: master_parties, target: parties.suppliers.supplier_code}
    - {type: branch, owner: master_organization, target: master.org_branches.branch_code}
    - {type: department, owner: master_organization, target: master.departments.department_code}
    - {type: employee, owner: master_organization, target: master.employees.employee_code}

  retain_release_blocked:
    - type: writeoff
      owner: inventory_compliance
      configured_target: inventory.stock_writeoffs.writeoff_number
      caller: backend/app/api/routes/inventory/writeoff/routes.py
      gate: Mounted workflow writes a table absent from the checked baseline; reconcile the live schema before migration.
    - type: payroll_run
      owner: payroll
      configured_target: payroll.payroll_runs.run_number
      caller: backend/app/api/services/payroll/salary_slip_service.py
      gate: Mounted workflow writes a table absent from the checked baseline; reconcile the live schema before migration.
    - type: salary_slip
      owner: payroll
      configured_target: payroll.payroll_slips.slip_number
      caller: backend/app/api/services/payroll/salary_slip_service.py
      gate: Mounted workflow writes a table absent from the checked baseline; reconcile the live schema before migration.
    - type: gst_filing
      owner: compliance
      configured_target: gst.return_filing_status.reference_number
      caller: backend/app/api/routes/compliance/gst.py
      gate: The mounted endpoint is explicitly simulated, does not persist/commit a filing, and the checked table has no reference_number column. Retire the simulation or design the real filing lifecycle after live-schema review.

  retired:
    - {type: purchase, reason: No backend aggregate or table; mounted purchase entries persist purchase_order or supplier_invoice identifiers.}
    - {type: quotation, reason: No mounted quotation workflow or static caller.}
    - {type: stock_adjustment, reason: Duplicate of adjustment; mounted adjustments persist inventory movement references.}
    - {type: stock_count, reason: No number-generation caller; stock_count is a movement subtype, not a separate numbered aggregate.}
    - {type: scheme, reason: Only caller was an unmounted orphan discount module targeting an unbaselined table.}

canonicalization:
  - id: inventory.movement_table_name
    decision: merge_code_reference
    retain: inventory.inventory_movements
    retire: inventory.stock_movements
    evidence: Checked DDL, mounted routes, repositories, triggers, and functions use inventory.inventory_movements.
  - id: finance.receipt_storage
    decision: merge_code_reference
    retain: financial.payments
    retire: financial.receipts
    evidence: Checked DDL and PaymentService use one payments table with payment_type as discriminator.
  - id: inventory.adjustment_type_mapping
    decision: merge_variable
    retain: backend/app/api/schemas/inventory/stock.py::ADJUSTMENT_TYPE_MAPPING
    retire: backend/app/api/routes/inventory/adjustments/routes.py::ADJUSTMENT_TYPE_MAPPING
  - id: procurement.service_boundary
    decision: retire_dead_compatibility
    retain:
      - backend/app/api/services/purchase/order
      - backend/app/api/services/purchase/grn
      - backend/app/api/services/purchase/supplier_invoice/service.py
    retired:
      - backend/app/api/services/purchase/purchase_service.py
      - backend/app/api/services/purchase/grn_service.py
      - backend/app/api/services/purchase/supplier_invoice_service.py
    pending_review:
      - backend/app/api/services/purchase/supplier_invoice/supplier_invoice_service.py
    evidence: Retired modules had no importers beyond compatibility barrels; pending file has concurrent uncommitted work and must be resolved without discarding it.
  - id: sales.promotional_discount_module
    decision: retire_dead_compatibility
    retired: backend/app/api/shared/discounts.py
    evidence: Zero importers, no mounted router, and its only persistence target is absent from the checked baseline.

live_schema_gates:
  required_evidence:
    - Read-only Supabase schema dump including columns, constraints, indexes, policies, triggers, functions, grants, and migration history.
    - Row counts, last-write evidence, and production callers for every merge or retire candidate.
    - Reconciliation queries proving no identifier collisions or orphan references.
    - Approved Alembic baseline and reversible migration plan.
  prohibited_before_review:
    - DROP TABLE or destructive column changes.
    - Creating guessed compatibility tables to satisfy application SQL.
    - Merging payment, inventory, payroll, compliance, or audit histories based only on similar names.
    - Exporting any document-number reservation through the MCP allowlist.
