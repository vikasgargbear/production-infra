<!DOCTYPE html>
<html>
<head>
    <title>PDF Generation Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <h1>PDF Generation Test</h1>
    <button onclick="testPrintFunction()">Test Print Function</button>
    <button onclick="testDownloadFunction()">Test Download Function</button>
    
    <div id="output"></div>
    
    <script>
        // Mock invoice data
        const testInvoiceData = {
            id: 'INV-001',
            invoice_number: 'INV-001',
            invoice_date: '2024-01-15',
            due_date: '2024-02-15',
            customer: {
                name: 'Test Customer',
                address: '123 Test Street',
                city: 'Test City',
                state: 'Test State',
                pincode: '123456',
                phone: '9876543210',
                email: 'test@example.com'
            },
            items: [
                {
                    product_name: 'Test Product 1',
                    quantity: 2,
                    rate: 100,
                    amount: 200,
                    tax_rate: 18,
                    tax_amount: 36,
                    total: 236
                }
            ],
            subtotal: 200,
            total_tax: 36,
            total: 236,
            billing_address: '123 Test Street, Test City, Test State - 123456',
            company: {
                name: 'Test Company',
                address: '456 Company Street',
                city: 'Company City',
                state: 'Company State',
                pincode: '654321',
                phone: '1234567890',
                email: 'company@example.com'
            }
        };

        // Generate invoice HTML function (simplified version)
        function generateInvoiceHTML(invoiceData) {
            return `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Invoice ${invoiceData.invoice_number}</title>
                    <style>
                        @page { 
                            size: A4; 
                            margin: 1.5cm 1cm; 
                        }
                        body { 
                            margin: 0; 
                            padding: 0; 
                            background: white;
                            font-size: 12px;
                            font-family: Arial, sans-serif;
                        }
                        .invoice-container {
                            padding: 20px;
                            max-width: 800px;
                            margin: 0 auto;
                        }
                        .header {
                            text-align: center;
                            margin-bottom: 30px;
                            padding: 20px;
                            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                            color: white;
                            border-radius: 10px;
                        }
                        .header h1 {
                            margin: 0;
                            font-size: 28px;
                            font-weight: bold;
                        }
                        .invoice-details {
                            display: flex;
                            justify-content: space-between;
                            margin-bottom: 30px;
                        }
                        .customer-info, .invoice-info {
                            width: 45%;
                        }
                        .customer-info h3, .invoice-info h3 {
                            color: #667eea;
                            border-bottom: 2px solid #667eea;
                            padding-bottom: 5px;
                        }
                        .items-table {
                            width: 100%;
                            border-collapse: collapse;
                            margin-bottom: 30px;
                        }
                        .items-table th {
                            background: #667eea;
                            color: white;
                            padding: 12px;
                            text-align: left;
                        }
                        .items-table td {
                            padding: 10px;
                            border-bottom: 1px solid #ddd;
                        }
                        .items-table tr:nth-child(even) {
                            background-color: #f8f9fa;
                        }
                        .totals {
                            text-align: right;
                            margin-top: 20px;
                        }
                        .total-row {
                            padding: 5px 0;
                            border-bottom: 1px solid #ddd;
                        }
                        .final-total {
                            font-size: 18px;
                            font-weight: bold;
                            color: #667eea;
                            border-top: 2px solid #667eea;
                            padding-top: 10px;
                        }
                    </style>
                </head>
                <body>
                    <div class="invoice-container">
                        <div class="header">
                            <h1>INVOICE</h1>
                            <p>${invoiceData.company?.name || 'Company Name'}</p>
                        </div>
                        
                        <div class="invoice-details">
                            <div class="customer-info">
                                <h3>Bill To:</h3>
                                <p><strong>${invoiceData.customer?.name || 'Customer Name'}</strong></p>
                                <p>${invoiceData.billing_address || 'Customer Address'}</p>
                                <p>Phone: ${invoiceData.customer?.phone || 'N/A'}</p>
                                <p>Email: ${invoiceData.customer?.email || 'N/A'}</p>
                            </div>
                            
                            <div class="invoice-info">
                                <h3>Invoice Details:</h3>
                                <p><strong>Invoice #:</strong> ${invoiceData.invoice_number}</p>
                                <p><strong>Date:</strong> ${invoiceData.invoice_date}</p>
                                <p><strong>Due Date:</strong> ${invoiceData.due_date}</p>
                            </div>
                        </div>
                        
                        <table class="items-table">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Qty</th>
                                    <th>Rate</th>
                                    <th>Amount</th>
                                    <th>Tax</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${invoiceData.items?.map(item => `
                                    <tr>
                                        <td>${item.product_name}</td>
                                        <td>${item.quantity}</td>
                                        <td>₹${item.rate}</td>
                                        <td>₹${item.amount}</td>
                                        <td>₹${item.tax_amount}</td>
                                        <td>₹${item.total}</td>
                                    </tr>
                                `).join('') || ''}
                            </tbody>
                        </table>
                        
                        <div class="totals">
                            <div class="total-row">
                                <strong>Subtotal: ₹${invoiceData.subtotal || 0}</strong>
                            </div>
                            <div class="total-row">
                                <strong>Total Tax: ₹${invoiceData.total_tax || 0}</strong>
                            </div>
                            <div class="total-row final-total">
                                <strong>Total: ₹${invoiceData.total || 0}</strong>
                            </div>
                        </div>
                    </div>
                </body>
                </html>
            `;
        }

        // Test print function
        function testPrintFunction() {
            console.log('Testing print function...');
            const invoiceHTML = generateInvoiceHTML(testInvoiceData);
            const printWindow = window.open('', '_blank', 'width=800,height=600');
            printWindow.document.write(invoiceHTML);
            printWindow.document.close();
            printWindow.onload = () => {
                printWindow.focus();
                printWindow.print();
                printWindow.close();
            };
            document.getElementById('output').innerHTML += '<p>✅ Print function test completed - opened print dialog</p>';
        }

        // Test download function  
        function testDownloadFunction() {
            console.log('Testing download function...');
            const invoiceHTML = generateInvoiceHTML(testInvoiceData);
            
            // Create a blob with the HTML content
            const blob = new Blob([invoiceHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            // Create a temporary link and trigger download
            const link = document.createElement('a');
            link.href = url;
            link.download = `invoice-${testInvoiceData.invoice_number}.html`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            document.getElementById('output').innerHTML += '<p>✅ Download function test completed - HTML file downloaded</p>';
        }
    </script>
</body>
</html>
