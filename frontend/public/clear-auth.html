<!DOCTYPE html>
<html>
<head>
    <title>Clear Authentication</title>
</head>
<body>
    <h1>Clearing Authentication...</h1>
    <script>
        // Clear all authentication related items
        localStorage.removeItem('authToken');
        localStorage.removeItem('offline_auth_token');
        localStorage.removeItem('offline_credentials');
        localStorage.removeItem('offline_mode_enabled');
        localStorage.removeItem('pharma_org_id');
        localStorage.removeItem('org_id');
        localStorage.removeItem('orgId');
        
        sessionStorage.clear();
        
        // Redirect to main app
        setTimeout(() => {
            window.location.href = '/';
        }, 1000);
    </script>
</body>
</html>
