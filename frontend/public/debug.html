<!DOCTYPE html>
<html>
<head>
    <title>Debug Auth & Org</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .key { font-weight: bold; color: blue; }
        .value { color: green; }
        .missing { color: red; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Debug: Authentication & Organization</h1>
    
    <div class="section">
        <h2>Current Storage Values</h2>
        <div id="storage"></div>
    </div>
    
    <div class="section">
        <h2>Actions</h2>
        <button onclick="setDefaultOrgId()">Set Default Org ID</button>
        <button onclick="clearAll()">Clear All Storage</button>
        <button onclick="location.reload()">Refresh</button>
        <button onclick="goToApp()">Go to App</button>
    </div>
    
    <div class="section">
        <h2>Check Setup Status</h2>
        <button onclick="checkSetup()">Check Setup Status</button>
        <div id="setup-status"></div>
    </div>
    
    <script>
        function displayStorage() {
            const storage = document.getElementById('storage');
            let html = '<h3>LocalStorage:</h3>';
            
            const importantKeys = ['pharma_org_id', 'authToken', 'auth_token', 'user', 'companyName'];
            
            for (const key of importantKeys) {
                const value = localStorage.getItem(key);
                if (value) {
                    html += `<div><span class="key">${key}:</span> <span class="value">${value.substring(0, 100)}...</span></div>`;
                } else {
                    html += `<div><span class="key">${key}:</span> <span class="missing">Not Set</span></div>`;
                }
            }
            
            html += '<h3>SessionStorage:</h3>';
            for (const key of importantKeys) {
                const value = sessionStorage.getItem(key);
                if (value) {
                    html += `<div><span class="key">${key}:</span> <span class="value">${value.substring(0, 100)}...</span></div>`;
                } else {
                    html += `<div><span class="key">${key}:</span> <span class="missing">Not Set</span></div>`;
                }
            }
            
            storage.innerHTML = html;
        }
        
        function setDefaultOrgId() {
            const orgId = '11111111-1111-1111-1111-111111111111';
            localStorage.setItem('pharma_org_id', orgId);
            sessionStorage.setItem('pharma_org_id', orgId);
            alert('Set default org_id: ' + orgId);
            displayStorage();
        }
        
        function clearAll() {
            if (confirm('Clear all storage?')) {
                localStorage.clear();
                sessionStorage.clear();
                displayStorage();
            }
        }
        
        function goToApp() {
            window.location.href = '/';
        }
        
        async function checkSetup() {
            const statusDiv = document.getElementById('setup-status');
            try {
                const response = await fetch('https://pharma-backend-production-0c09.up.railway.app/api/setup/check');
                const data = await response.json();
                statusDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                
                if (data.organization?.org_id) {
                    statusDiv.innerHTML += `<button onclick="useThisOrgId('${data.organization.org_id}')">Use This Org ID</button>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<span class="missing">Error: ${error.message}</span>`;
            }
        }
        
        function useThisOrgId(orgId) {
            localStorage.setItem('pharma_org_id', orgId);
            sessionStorage.setItem('pharma_org_id', orgId);
            alert('Set org_id from setup: ' + orgId);
            displayStorage();
        }
        
        // Initial display
        displayStorage();
    </script>
</body>
</html>
