<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive API Testing - All Modules</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #1a202c;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .module-section {
            margin-bottom: 40px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .module-title {
            font-size: 20px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .test-btn {
            padding: 10px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        .test-btn:hover {
            transform: translateY(-2px);
        }
        .test-btn.success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        }
        .test-btn.error {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
        }
        .result-box {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }
        .status.error {
            background: #fed7d7;
            color: #742a2a;
        }
        .status.pending {
            background: #feebc8;
            color: #744210;
        }
        pre {
            background: #2d3748;
            color: #48bb78;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
        }
        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 15px;
        }
        .summary-item {
            text-align: center;
        }
        .summary-number {
            font-size: 32px;
            font-weight: bold;
        }
        .summary-label {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="summary" id="summary">

            <button class="test-btn" style="padding: 15px 30px; font-size: 18px;" onclick="runAllTests()">

    <script>
        const API_BASE = 'https://pharma-backend-production-0c09.up.railway.app/api';
        let testResults = {
            total: 0,
            passed: 0,
            failed: 0,
            pending: 0
        };

        // Helper function to make API calls
        async function apiCall(method, endpoint, data = null) {
            try {
                const options = {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    }
                };
                
                if (data) {
                    options.body = JSON.stringify(data);
                }
                
                const response = await fetch(`${API_BASE}${endpoint}`, options);
                const result = await response.json();
                
                return {
                    success: response.ok,
                    status: response.status,
                    data: result
                };
            } catch (error) {
                return {
                    success: false,
                    error: error.message
                };
            }
        }

        // Update test summary
        function updateSummary() {
            document.getElementById('total-tests').textContent = testResults.total;
            document.getElementById('passed-tests').textContent = testResults.passed;
            document.getElementById('failed-tests').textContent = testResults.failed;
            document.getElementById('pending-tests').textContent = testResults.pending;
        }

        // Display test result
        function displayResult(containerId, testName, result, details) {
            const container = document.getElementById(containerId);
            container.style.display = 'block';
            
            const status = result.success ? 'success' : 'error';
            const statusText = result.success ? 'PASSED' : 'FAILED';
            
            container.innerHTML += `
                <div style="margin-bottom: 15px;">
                    <strong>${testName}</strong>
                    <span class="status ${status}">${statusText}</span>
                    <pre>${JSON.stringify(details || result, null, 2)}</pre>
                </div>
            `;
            
            testResults.total++;
            if (result.success) {
                testResults.passed++;
            } else {
                testResults.failed++;
            }
            updateSummary();
        }

        // PURCHASE HUB TESTS
        async function testPurchaseEntry() {
            const purchaseData = {
                supplier_id: 1,
                invoice_number: 'TEST-PUR-' + Date.now(),
                invoice_date: new Date().toISOString().split('T')[0],

                    {
                        product_id: 1,
                        batch_number: 'BATCH-TEST-001',
                        quantity: 100,
                        rate: 50,
                        discount_percent: 10,
                        gst_percent: 18,
                        expiry_date: '2025-12-31'
                    }
                ],
                payment_mode: 'credit',
                payment_status: 'pending',
                total_amount: 5900,
                notes: 'API Test Purchase'
            };
            
            const result = await apiCall('POST', '/purchases/', purchaseData);
            displayResult('purchase-result', 'Purchase Entry', result, {
                invoice: purchaseData.invoice_number,
                response: result.data
            });
        }

            const result = await apiCall('POST', '/purchase-orders/', poData);
            displayResult('purchase-result', 'Purchase Order', result, {

        // MASTER HUB TESTS
        async function testCustomerManagement() {
            const customerData = {
                name: 'Test Customer ' + Date.now(),
                phone: '9876543210',
                email: 'test@example.com',
                address: 'Test Address',
                gst_number: '29ABCDE1234F1Z5',

            // Test Create
            const createResult = await apiCall('POST', '/customers/', customerData);

            // Test Read
            const readResult = await apiCall('GET', `/customers/${customerId}`);

        // Run all tests
        async function runAllTests() {
            // Reset counters
            testResults = { total: 0, passed: 0, failed: 0, pending: 0 };
            
            // Clear all result boxes
            document.querySelectorAll('.result-box').forEach(box => {
                box.innerHTML = '';
                box.style.display = 'none';
            });
            
            console.log('Starting comprehensive API tests...');
            
            // Purchase Hub
            await testPurchaseEntry();
            await testPurchaseOrder();
            await testGRN();
            await testPurchaseList();
            
            // Financial Hub
            await testPaymentEntry();
            await testPaymentTracking();
            await testCreditNote();

            // Returns Hub
