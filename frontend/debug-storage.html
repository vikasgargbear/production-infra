<!DOCTYPE html>
<html>
<head>
    <title>Debug Storage & Fix API</title>
    <style>
        body {
            font-family: monospace;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        h2 {
            color: #569cd6;
            border-bottom: 2px solid #569cd6;
            padding-bottom: 10px;
        }
        .success {
            color: #4ec9b0;
        }
        .error {
            color: #f48771;
        }
        .warning {
            color: #dcdcaa;
        }
        button {
            background: #007acc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover {
            background: #005a9e;
        }
        .fix-button {
            background: #4ec9b0;
        }
        .fix-button:hover {
            background: #3ca08e;
        }
        pre {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            border: 1px solid #464647;
        }
        .key {
            color: #9cdcfe;
        }
        .value {
            color: #ce9178;
        }
        .section {
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 Storage Debug & API Fix Tool</h1>
    
    <div class="container">
        <h2>📦 Current Storage State</h2>
        <div id="storageInfo"></div>
    </div>

    <div class="container">
        <h2>🔑 JWT Token Analysis</h2>
        <div id="tokenInfo"></div>
    </div>

    <div class="container">
        <h2>🛠️ Quick Fixes</h2>
        <div class="section">
            <button class="fix-button" onclick="fixOrgId()">
                ✅ Fix Org ID (Set Correct Value)
            </button>
            <button class="fix-button" onclick="testAPI()">
                🧪 Test Customer Search API
            </button>
            <button onclick="clearAll()">
                🗑️ Clear All Storage (Reset)
            </button>
        </div>
        <div id="fixResult"></div>
    </div>

    <div class="container">
        <h2>📊 API Test Results</h2>
        <div id="apiTest"></div>
    </div>

    <script>
        const CORRECT_ORG_ID = 'e78d6777-35f6-4b19-994f-caaede2f021a';
        
        function checkStorage() {
            const storageInfo = document.getElementById('storageInfo');
            let html = '<h3>LocalStorage:</h3><pre>';
            
            // Check all storage keys
            const importantKeys = [
                'pharma_org_id',
                'org_id',
                'orgId',
                'authToken',
                'auth_token',
                'pharma_setup_complete'
            ];
            
            html += '<strong>Important Keys:</strong>\n';
            importantKeys.forEach(key => {
                const value = localStorage.getItem(key);
                if (value) {
                    html += `<span class="key">${key}</span>: <span class="value">"${value.substring(0, 50)}${value.length > 50 ? '...' : ''}"</span>\n`;
                } else {
                    html += `<span class="key">${key}</span>: <span class="error">not found</span>\n`;
                }
            });
            
            html += '\n<strong>SessionStorage:</strong>\n';
            importantKeys.forEach(key => {
                const value = sessionStorage.getItem(key);
                if (value) {
                    html += `<span class="key">${key}</span>: <span class="value">"${value.substring(0, 50)}${value.length > 50 ? '...' : ''}"</span>\n`;
                }
            });
            
            html += '</pre>';
            
            // Check current org_id
            const currentOrgId = sessionStorage.getItem('pharma_org_id') || localStorage.getItem('pharma_org_id');
            if (currentOrgId === CORRECT_ORG_ID) {
                html += '<p class="success">✅ Org ID is correctly set!</p>';
            } else if (currentOrgId) {
                html += `<p class="warning">⚠️ Org ID exists but is different: ${currentOrgId}</p>`;
            } else {
                html += '<p class="error">❌ No Org ID found in storage!</p>';
            }
            
            storageInfo.innerHTML = html;
        }
        
        function checkToken() {
            const tokenInfo = document.getElementById('tokenInfo');
            const token = localStorage.getItem('authToken') || localStorage.getItem('auth_token');
            
            if (!token) {
                tokenInfo.innerHTML = '<p class="error">❌ No auth token found</p>';
                return;
            }
            
            try {
                const parts = token.split('.');
                if (parts.length !== 3) {
                    tokenInfo.innerHTML = '<p class="error">❌ Invalid token format</p>';
                    return;
                }
                
                const payload = JSON.parse(atob(parts[1]));
                let html = '<h3>Token Payload:</h3><pre>';
                html += JSON.stringify(payload, null, 2);
                html += '</pre>';
                
                if (payload.org_id) {
                    html += `<p class="success">✅ Token contains org_id: ${payload.org_id}</p>`;
                } else if (payload.organization_id) {
                    html += `<p class="success">✅ Token contains organization_id: ${payload.organization_id}</p>`;
                } else {
                    html += '<p class="warning">⚠️ Token does NOT contain org_id - need to use storage</p>';
                }
                
                // Check expiry
                if (payload.exp) {
                    const expiry = new Date(payload.exp * 1000);
                    const now = new Date();
                    if (expiry > now) {
                        html += `<p class="success">✅ Token valid until: ${expiry.toLocaleString()}</p>`;
                    } else {
                        html += `<p class="error">❌ Token expired at: ${expiry.toLocaleString()}</p>`;
                    }
                }
                
                tokenInfo.innerHTML = html;
            } catch (e) {
                tokenInfo.innerHTML = `<p class="error">❌ Error decoding token: ${e.message}</p>`;
            }
        }
        
        function fixOrgId() {
            // Set in both localStorage and sessionStorage
            localStorage.setItem('pharma_org_id', CORRECT_ORG_ID);
            sessionStorage.setItem('pharma_org_id', CORRECT_ORG_ID);
            
            // Also set other possible keys for compatibility
            localStorage.setItem('org_id', CORRECT_ORG_ID);
            localStorage.setItem('orgId', CORRECT_ORG_ID);
            
            const result = document.getElementById('fixResult');
            result.innerHTML = `
                <div class="success">
                    <h3>✅ Fixed!</h3>
                    <p>Organization ID has been set to: <strong>${CORRECT_ORG_ID}</strong></p>
                    <p>Set in: localStorage.pharma_org_id, sessionStorage.pharma_org_id, localStorage.org_id, localStorage.orgId</p>
                    <p><strong>Now refresh the main application page to test!</strong></p>
                </div>
            `;
            
            // Refresh the display
            checkStorage();
            
            // Auto-redirect after 3 seconds
            setTimeout(() => {
                window.location.href = 'http://localhost:3000';
            }, 3000);
        }
        
        async function testAPI() {
            const apiTest = document.getElementById('apiTest');
            apiTest.innerHTML = '<p class="warning">Testing API...</p>';
            
            const orgId = sessionStorage.getItem('pharma_org_id') || localStorage.getItem('pharma_org_id');
            
            if (!orgId) {
                apiTest.innerHTML = '<p class="error">❌ Cannot test API - no org_id found. Click "Fix Org ID" first!</p>';
                return;
            }
            
            try {
                const response = await fetch('https://pharma-backend-production-0c09.up.railway.app/api/customers/?search=test&limit=1', {
                    headers: {
                        'Accept': 'application/json',
                        'X-Org-Id': orgId
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    apiTest.innerHTML = `
                        <div class="success">
                            <h3>✅ API Test Successful!</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    apiTest.innerHTML = `
                        <div class="error">
                            <h3>❌ API Error ${response.status}</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (e) {
                apiTest.innerHTML = `<p class="error">❌ Network error: ${e.message}</p>`;
            }
        }
        
        function clearAll() {
            if (confirm('This will clear all storage and require you to log in again. Continue?')) {
                localStorage.clear();
                sessionStorage.clear();
                document.getElementById('fixResult').innerHTML = '<p class="warning">Storage cleared. Redirecting to login...</p>';
                setTimeout(() => {
                    window.location.href = 'http://localhost:3000';
                }, 2000);
            }
        }
        
        // Check on load
        window.onload = () => {
            checkStorage();
            checkToken();
        };
    </script>
</body>
</html>
