apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aasopharma-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: aasopharma-api@REPLACE_WITH_PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/REPLACE_WITH_PROJECT_ID/aasopharma/backend:REPLACE_WITH_IMMUTABLE_TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: APP_ENV
              value: production
            - name: DEBUG
              value: "false"
            - name: LOG_LEVEL
              value: INFO
            - name: LOG_FORMAT
              value: json
            - name: CORS_ORIGINS
              value: https://REPLACE_WITH_CLOUDFLARE_PAGES_ORIGIN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aasopharma-database-url
                  key: latest
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aasopharma-jwt-secret-key
                  key: latest
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aasopharma-supabase-url
                  key: latest
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: aasopharma-supabase-anon-key
                  key: latest
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: aasopharma-smtp-user
                  key: latest
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aasopharma-smtp-password
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 2
            periodSeconds: 30
            failureThreshold: 3
