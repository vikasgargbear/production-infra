<!DOCTYPE html>
<html>
<head>
    <title>Check Storage</title>
</head>
<body>
    <h1>Storage Check</h1>
    <div id="output"></div>
    <script>
        // Check localStorage
        const output = document.getElementById('output');
        
        output.innerHTML = '<h2>LocalStorage:</h2>';
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            output.innerHTML += `<p><b>${key}:</b> ${value}</p>`;
        }
        
        output.innerHTML += '<h2>SessionStorage:</h2>';
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const value = sessionStorage.getItem(key);
            output.innerHTML += `<p><b>${key}:</b> ${value}</p>`;
        }
        
        // Set a default org_id if none exists
        if (!localStorage.getItem('pharma_org_id') && !sessionStorage.getItem('pharma_org_id')) {
            const defaultOrgId = '11111111-1111-1111-1111-111111111111';
            localStorage.setItem('pharma_org_id', defaultOrgId);
            sessionStorage.setItem('pharma_org_id', defaultOrgId);
            output.innerHTML += '<h3 style="color: green;">Set default org_id: ' + defaultOrgId + '</h3>';
            output.innerHTML += '<p>Please refresh your application for changes to take effect.</p>';
        }
    </script>
</body>
</html>
